  const lines=[...head.filter(l=>l!==name),...x.lines].filter(l=>!/^₪[\d,]+$/.test(l)&&!/^(סה.?כ לתשלום|החל מ-?)$/.test(l));
  const pic=SINGLE[k]?(x.img||((k==='hotels')&&x.logos&&x.logos[0])||null):null;
  return{name,lines,pic,logos:SINGLE[k]?(pic===x.img?x.logos:[]).slice(0,1):(x.logos||[]).slice(0,2)};
}
function more(){
  const list=$('#list');const part=RES.slice(SHOWN,SHOWN+10);
  list.insertAdjacentHTML('beforeend',part.map((x,j)=>{const i=SHOWN+j;const v=view(x);
    return`<article class="item" aria-label="${esc(v.name||'אפשרות '+(i+1))}">
      ${v.pic?`<img class="pic" src="${esc(v.pic)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:''}
      ${!v.pic&&v.logos.length?`<div class="logos">${v.logos.map(s=>`<img src="${esc(s)}" alt="" loading="lazy" referrerpolicy="no-referrer">`).join('')}</div>`:''}
      <div class="body">${v.name?`<b>${esc(v.name)}</b>`:''}${v.lines.map(l=>`<span>${esc(l)}</span>`).join('<span aria-hidden="true" style="color:#B9C6D8">·</span>')}</div>
      <div class="buy"><div class="price">₪${nf(x.price)}<small>${PRICE_NOTE[CUR.kind]||''}</small></div><button class="go" data-i="${i}">להזמנה</button></div></article>`}).join(''));
  SHOWN+=part.length;
  list.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{const x=RES[+b.dataset.i];const v=view(x);
    book({kind:CUR.kind,title:CUR.title,search:CUR.label,lines:[...(x.head||[]),...x.lines],price:x.price,link:CUR.link,pick:v.name||null})});
  $('#moreb')&&$('#moreb').remove();
  if(SHOWN<RES.length){list.insertAdjacentHTML('afterend',`<button class="more" id="moreb">עוד תוצאות (${nf(RES.length-SHOWN)})</button>`);$('#moreb').onclick=more}
}

// ---------- booking ----------
function book(o){
  const dlg=$('#dlg');
  $('#dlgc').innerHTML=`<form id="bf" novalidate><h2>${o.price?'הזמנה':'בקשת הצעה'}</h2>
    ${o.free?'':`<div class="sum"><b>${esc(o.pick||o.title)}</b><br>${esc(o.search)}${o.price?`<br><b style="font-size:18px">₪${nf(o.price)}</b> <small>${esc(PRICE_NOTE[o.kind]||'')}</small>`:''}</div>`}
    ${field('שם מלא',`<input id="bn" autocomplete="name" required maxlength="80">`)}
    ${field('טלפון (וואטסאפ)',`<input id="bp" type="tel" inputmode="tel" dir="ltr" autocomplete="tel" required maxlength="30" placeholder="05X-XXXXXXX">`)}
    ${field('מייל (לא חובה)',`<input id="be" type="email" dir="ltr" autocomplete="email" maxlength="120">`)}
    ${field(o.free?'מה מחפשים? (יעד, תאריכים, כמה אנשים, תקציב)':'הערות לבר',`<textarea id="bt" maxlength="1500" ${o.free?'required':''} placeholder="${o.free?'':'שמות הנוסעים, מזוודות, בקשות מיוחדות…'}"></textarea>`)}
    <p class="note" style="font-size:13px">${o.price?'המחיר נכון לרגע החיפוש. ההזמנה סופית רק אחרי שבר מאשר ושולח לכם פרטי תשלום — שום דבר לא מחויב עכשיו.':'בר יחזור אליכם עם הצעות מחיר. שום דבר לא מחויב עכשיו.'}</p>
    <p class="err" id="bx" role="alert"></p>
    <button class="go">${o.price?'שליחת ההזמנה לאישור':'שליחת הבקשה'}</button></form>`;
  dlg.showModal();setTimeout(()=>$('#bn').focus(),30);
  $('#bf').onsubmit=async e=>{e.preventDefault();
    const name=$('#bn').value.trim(),phone=$('#bp').value.trim(),email=$('#be').value.trim(),notes=$('#bt').value.trim();
    const er=name.length<2?'כתבו שם':phone.replace(/\D/g,'').length<9?'כתבו מספר טלפון תקין':email&&!/^\S+@\S+\.\S+$/.test(email)?'המייל לא תקין':o.free&&notes.length<3?'כתבו מה אתם מחפשים':'';
    $('#bx').textContent=er;if(er)return;
    const btn=e.target.querySelector('.go');btn.disabled=true;btn.textContent='שולח…';
    const details={title:o.pick?`${o.pick} · ${o.title}`:o.title,search:o.search,lines:(o.lines||[]).slice(0,40).map(l=>String(l).slice(0,160)),customer_price:o.price||null,link:o.link||null};
    const{error}=await sb.from('travel_requests').insert({kind:o.kind,details,name,phone,email:email||null,notes:notes||null,lang:'he'});
    const msg=`היי בר, ${o.price?'שלחתי הזמנה באתר':'שלחתי בקשה באתר'}:\n${details.title}${o.search?'\n'+o.search:''}${o.price?`\nמחיר: ₪${nf(o.price)}`:''}${o.free?'\n'+notes:''}\nשם: ${name}`;
    const waL=`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
    $('#dlgc').innerHTML=error
      ?`<div class="okmsg"><h2>משהו השתבש בשליחה</h2><p>אפשר לשלוח לבר ישירות בוואטסאפ — הכל כבר כתוב:</p><a class="wa" href="${waL}" target="_blank" rel="noopener">שליחה בוואטסאפ</a></div>`
      :`<div class="okmsg"><div style="font-size:44px" aria-hidden="true">✈️</div><h2>${o.price?'ההזמנה נשלחה לבר':'הבקשה נשלחה לבר'}</h2><p>בר יאשר ויחזור אליכם בהקדם ב־${esc(phone)}.<br>רוצים לזרז? שלחו לו הודעה:</p><a class="wa" href="${waL}" target="_blank" rel="noopener">שליחה בוואטסאפ</a></div>`;
  };
}
$('#dlgx').onclick=()=>$('#dlg').close();
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))$('#dlg').close()});

// ---------- laptop status ----------
async function health(){
  const was=ONLINE;ONLINE=await online();
  if(ONLINE!==was&&(was!==null||ONLINE===false))panel();
  setTimeout(health,ONLINE?60000:15000);
}
tabs();panel();health();
})();
