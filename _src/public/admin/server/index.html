<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🔴 שרת הנסיעות</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#090B1F;--card:#12163A;--line:rgba(255,255,255,.1);--ink:#EEEAF8;--mute:#A3A5CB;--on:#22C55E;--off:#EF4444;--warn:#F59E0B}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif}
body{padding:20px 16px 40px}.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px}.mute{color:var(--mute)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.light{display:flex;align-items:center;gap:16px}
.dot{width:54px;height:54px;border-radius:50%;flex:0 0 auto;background:var(--off);box-shadow:0 0 28px var(--off)}
.dot.on{background:var(--on);box-shadow:0 0 28px var(--on);animation:p 2s ease-in-out infinite}.dot.warn{background:var(--warn);box-shadow:0 0 28px var(--warn)}
@keyframes p{50%{box-shadow:0 0 8px var(--on)}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none}}
.big{font-size:22px;font-weight:800}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 20px;background:#6A63FF;color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.bm{background:#F59E0B;color:#1A1200;cursor:grab;font-size:17px;padding:12px 22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats b{display:block;font-size:24px}
.log{font-size:13px;max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:4px}.log div{border-bottom:1px solid var(--line);padding-bottom:4px}
ol{margin:8px 0 0;padding-inline-start:22px;line-height:1.9}code{background:#0B0E28;padding:2px 6px;border-radius:6px}
.step{display:flex;gap:12px;align-items:flex-start}.n{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#6A63FF;display:grid;place-items:center;font-weight:800}
:focus-visible{outline:3px solid #D8AE57;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="mute">טוען…</p></div>
<script src="/lib/supabase.js"></script>
<script>
(()=>{
const sb=window.supabase.createClient('https://iktmyrfbejtjsiehcrar.supabase.co','sb_publishable_vEUqQPQSE0EG7YRnwNeAbg_PzViDO1a',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'complichess-auth'}});
const BEAGENT='https://travel.beagent.online';
const BOOKMARK="javascript:(function(){if(!/beagent\\.online$/.test(location.hostname)){location.href='https://travel.beagent.online/he';return}var s=document.createElement('script');s.src='https://barusik.com/admin/server/hands.js?v='+Date.now();document.head.appendChild(s)})()";
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KIND={flights:'טיסות',hotels:'מלונות',cars:'רכב',packages:'חבילות',tours:'טיולים',tickets:'כרטיסים'};
let HANDS=null,ALIVE=0,STATE='wait',LOGGED=null,RUN=false,CH=null,seq=0,ADMIN=false;
const pending=new Map(),stats={search:0,other:0,fail:0},LOG=[];
const log=t=>{LOG.unshift(new Date().toLocaleTimeString('he-IL')+' · '+t);LOG.length=Math.min(LOG.length,40);draw()};

// timers that keep running when this window is in the background
const tick=(()=>{try{const w=new Worker(URL.createObjectURL(new Blob(['onmessage=e=>setTimeout(()=>postMessage(e.data),e.data.ms)'],{type:'text/javascript'})));
  const cb=new Map();let n=0;w.onmessage=e=>{const f=cb.get(e.data.id);cb.delete(e.data.id);f&&f()};return ms=>new Promise(r=>{const id=++n;cb.set(id,r);w.postMessage({id,ms})})}catch{return ms=>new Promise(r=>setTimeout(r,ms))}})();
const every=(ms,fn)=>{(async()=>{for(;;){await tick(ms);try{await fn()}catch{}}})()};

// ---- talk to the BeAgent tab (started with the ⚡ bookmark) ----
addEventListener('message',e=>{
  if(e.origin!==BEAGENT||!e.data||e.data.src!=='bt-hands')return;
  const m=e.data;
  if(m.type==='hello'){HANDS=e.source;ALIVE=Date.now();HANDS.postMessage({src:'bt-page',type:'ack'},BEAGENT);if(ADMIN&&!RUN)start();return}
  if(m.type==='alive'){ALIVE=Date.now();if(!HANDS)HANDS=e.source;return}
  if(m.type==='result'){ALIVE=Date.now();const p=pending.get(m.id);if(p){pending.delete(m.id);m.ok?p.res(m.data):p.rej(new Error(m.error||'failed'))}}
});
const hands=(job,ms=120000)=>new Promise((res,rej)=>{
  if(!HANDS||HANDS.closed)return rej(new Error('no-hands'));
  const id=++seq+'';pending.set(id,{res,rej});HANDS.postMessage({src:'bt-page',type:'job',id,job},BEAGENT);
  tick(ms).then(()=>{if(pending.has(id)){pending.delete(id);rej(new Error('timeout'))}})});

function draw(){
  const on=STATE==='on',warn=STATE==='login';
  document.title=(on?'🟢':warn?'🟠':'🔴')+' שרת הנסיעות';
  const title={on:'השרת פועל',login:'צריך להתחבר ל-BeAgent',wait:'השרת כבוי',stopped:'השרת כבוי'}[STATE]||'מפעיל…';
  const sub={on:'הלקוחות יכולים לחפש ולהזמין עכשיו. השאר פתוחים את החלון הזה ואת לשונית BeAgent (אפשר למזער).',
    login:'בלשונית BeAgent התחבר כרגיל, ואז לחץ שם שוב על הסימניה ⚡.',
    wait:'הלקוחות רואים כרגע את הודעת הוואטסאפ. כדי להפעיל — שני צעדים למטה.',stopped:'הלקוחות רואים כרגע את הודעת הוואטסאפ.'}[STATE]||'';
  const head=`<div class="card light"><div class="dot ${on?'on':warn?'warn':''}" role="img" aria-label="${on?'פועל':'כבוי'}"></div><div><div class="big">${title}</div><div class="mute">${sub}</div></div></div>`;
  let body='';
  if(STATE==='wait'||STATE==='login')body=`<div class="card" style="display:flex;flex-direction:column;gap:16px">
    <div class="step"><span class="n">1</span><div><b>פעם ראשונה בלבד:</b> גרור את הכפתור הכתום אל סרגל הסימניות של Chrome (אם הסרגל מוסתר: Ctrl+Shift+B).<div class="row" style="margin-top:10px"><a class="btn bm" id="bm" title="גרור אותי לסרגל הסימניות">⚡ שרת ברוסיק</a></div></div></div>
    <div class="step"><span class="n">2</span><div>פתח את BeAgent ולחץ שם על הסימניה <b>⚡ שרת ברוסיק</b>. הנורית כאן תהפוך לירוקה.<div class="row" style="margin-top:10px"><button id="ob">פתיחת BeAgent</button></div></div></div></div>`;
  if(on||STATE==='stopped')body=`<div class="card stats"><div><b>${stats.search}</b><span class="mute">חיפושים</span></div><div><b>${stats.other}</b><span class="mute">השלמות</span></div><div><b>${stats.fail}</b><span class="mute">נכשלו</span></div></div>
    <div class="card row">${on?'<button class="ghost" id="stop">כיבוי השרת</button>':'<button id="go">הפעלת השרת</button>'}<a class="btn ghost" href="/admin/" target="_blank">דף הניהול</a><a class="btn ghost" href="/travel/" target="_blank">האתר ללקוחות</a></div>`;
  const lg=LOG.length?`<div class="card"><b>פעילות</b><div class="log">${LOG.map(l=>`<div>${esc(l)}</div>`).join('')}</div></div>`:'';
  app.innerHTML=`<h1>שרת Bar Lvovski Travel</h1>${head}${body}${lg}`;
  const $=id=>document.getElementById(id);
  if($('bm')){$('bm').setAttribute('href',BOOKMARK);$('bm').onclick=e=>{e.preventDefault();alert('את הכפתור הזה צריך לגרור (לא ללחוץ) אל סרגל הסימניות, ואז ללחוץ עליו כשאתה בתוך BeAgent.')}}
  $('ob')&&($('ob').onclick=()=>{const w=window.open(BEAGENT+'/he','bt-hands');w&&w.focus()});
  $('stop')&&($('stop').onclick=stop);$('go')&&($('go').onclick=start);
}

async function heartbeat(){try{await sb.rpc('travel_heartbeat',{p_on:STATE==='on',p_logged_in:LOGGED!==false,p_version:2})}catch{}}
async function start(){
  if(!HANDS||HANDS.closed||Date.now()-ALIVE>35000){STATE='wait';draw();return}
  let r;try{r=await hands({type:'start'},20000)}catch(e){STATE='wait';draw();return}
  LOGGED=!!r.loggedIn;
  if(!LOGGED){STATE='login';RUN=false;draw();heartbeat();return}
  STATE='on';RUN=true;log('השרת הופעל');heartbeat();pickQueued();
  if(!CH)CH=sb.channel('travel-jobs').on('postgres_changes',{event:'INSERT',schema:'public',table:'travel_jobs'},p=>{if(RUN&&p.new&&p.new.status==='queued')take(p.new)}).subscribe();
}
async function stop(){RUN=false;STATE='stopped';try{HANDS&&HANDS.postMessage({src:'bt-page',type:'stop'},BEAGENT)}catch{}await sb.rpc('travel_heartbeat',{p_on:false,p_logged_in:true,p_version:2}).catch(()=>{});log('השרת כובה');draw()}
every(12000,async()=>{
  if(RUN&&(!HANDS||HANDS.closed||Date.now()-ALIVE>35000)){RUN=false;STATE='wait';log('לשונית BeAgent נסגרה או נטענה מחדש — לחץ שם שוב על ⚡');draw()}
  heartbeat();
});
every(5000,()=>pickQueued());

const busy=new Set();
async function pickQueued(){if(!RUN)return;
  const{data}=await sb.from('travel_jobs').select('id,kind,params,status,created_at').eq('status','queued').order('created_at').limit(20);
  for(const j of data||[]){if(Date.now()-new Date(j.created_at)>150000){await sb.from('travel_jobs').update({status:'failed',error:'expired',updated_at:new Date().toISOString()}).eq('id',j.id).eq('status','queued');continue}take(j)}}
async function take(j){
  if(busy.has(j.id)||!RUN)return;busy.add(j.id);
  const{data}=await sb.from('travel_jobs').update({status:'running',updated_at:new Date().toISOString()}).eq('id',j.id).eq('status','queued').select('id');
  if(!data||!data.length){busy.delete(j.id);return}
  const p=j.params||{};const label=j.kind==='search'?`חיפוש ${KIND[p.kind]||p.kind}`:j.kind==='pkgdates'?'תאריכי חבילות':'השלמה';
  try{
    const res=await hands({type:j.kind,params:p},j.kind==='search'?110000:30000);
    const result=j.kind==='search'?res:{data:res};
    await sb.from('travel_jobs').update({status:'done',result,updated_at:new Date().toISOString()}).eq('id',j.id);
    if(j.kind==='search'){stats.search++;log(`${label} · ${(res.results||[]).length} תוצאות`)}else{stats.other++;draw()}
  }catch(e){
    stats.fail++;const msg=String(e.message||e);
    await sb.from('travel_jobs').update({status:'failed',error:msg.slice(0,200),updated_at:new Date().toISOString()}).eq('id',j.id);
    log(`${label} נכשל (${msg})`);
    if(msg==='no-login'){LOGGED=false;RUN=false;STATE='login';heartbeat();draw()}
  }finally{busy.delete(j.id)}
}

(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(!session){app.innerHTML=`<div class="card"><h1>שרת הנסיעות</h1><p>צריך להתחבר עם משתמש המנהל באתר.</p><a class="btn" href="/he/" target="_blank">לאתר להתחברות</a></div>`;return}
  const{data:isAdmin}=await sb.rpc('is_admin');
  if(isAdmin!==true){app.innerHTML=`<div class="card"><h1>אין הרשאה</h1><p class="mute">הדף פתוח רק למנהל.</p></div>`;return}
  ADMIN=true;draw();
  if(HANDS)start();
})();
})();
</script>
</body>
</html>
