<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barusik Crypto</title>
<meta name="description" content="בורסת מטבעות: יצירת מטבע חדש ומסחר במטבעות קיימים.">
<meta name="theme-color" content="#0F1733">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Barusik Crypto. One loud thing: the last price, set large, digits that changed roll in the trade's colour.
   Everything else is a quiet trading desk: market list · chart + price · book + ticket. Phone: one panel at a time. */
:root{
  --ground:#0F1733; --desk:#151F45; --desk-2:#1C2856; --line:rgba(200,212,255,.09); --line-2:rgba(200,212,255,.18);
  --ink:#E8ECFF; --ink-2:#B4BCE3; --muted:#7F89B8;
  --buy:#3DDBB8; --buy-soft:rgba(61,219,184,.14); --sell:#FF7A6B; --sell-soft:rgba(255,122,107,.14);
  --brass:#E6C27A;
  --r1:8px; --r2:14px;
  --f:"Rubik","Arial Hebrew",system-ui,sans-serif; --fd:"Unbounded","Rubik",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--buy)}
:focus-visible{outline:2px solid var(--buy);outline-offset:2px;border-radius:6px}
.n{direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:14px;height:58px;padding:0 max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:800;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.demo{font-size:13px;color:var(--brass);border:1px solid rgba(230,194,122,.35);border-radius:999px;padding:3px 10px;white-space:nowrap}
.top .grow{flex:1}
.wallet-pill{display:flex;align-items:center;gap:8px;background:var(--desk);border:1px solid var(--line);border-radius:999px;height:38px;padding:0 14px;font-weight:700}
.btn{height:40px;border-radius:999px;padding:0 18px;font-weight:700;background:var(--desk-2);border:1px solid var(--line-2)}
.btn.main{background:var(--ink);color:var(--ground);border-color:transparent}
.lang{background:var(--desk);border:1px solid var(--line);border-radius:999px;height:38px;padding:0 10px}

/* desk */
.desk{display:grid;grid-template-columns:270px minmax(0,1fr) 340px;gap:1px;background:var(--line);height:calc(100dvh - 58px - 44px)}
.desk>section{background:var(--ground);min-width:0;min-height:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;color:var(--muted);font-size:13px}
.ph h2{margin:0;font-size:14px;color:var(--ink-2);font-weight:700}

/* markets */
.search{margin:0 12px 8px;height:38px;border-radius:var(--r1);background:var(--desk);border:1px solid var(--line);padding:0 12px}
.mlist{overflow:auto;flex:1}
.mrow{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;width:100%;padding:9px 14px;text-align:start}
.mrow:hover{background:var(--desk)}
.mrow[aria-current="true"]{background:var(--desk-2)}
.coin{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#0F1733}
.mrow b{display:block;font-size:14px}
.mrow small{color:var(--muted);font-size:12px}
.mrow .px{text-align:end;font-size:14px}
.up{color:var(--buy)} .dn{color:var(--sell)}
.newcoin{margin:10px 12px 14px;height:44px;border-radius:var(--r2);border:1px dashed var(--line-2);color:var(--ink-2);font-weight:700}
.newcoin:hover{border-color:var(--buy);color:var(--buy)}

/* center: price + chart */
.head{padding:18px 22px 6px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px}
.who{display:flex;align-items:center;gap:12px}
.who .coin{width:40px;height:40px;font-size:13px}
.who h1{margin:0;font-size:20px;font-weight:800}
.who p{margin:0;color:var(--muted);font-size:13px}
.last{font-family:var(--fd);font-weight:700;font-size:clamp(34px,4.6vw,64px);line-height:1;letter-spacing:-.03em;display:flex}
.last span{display:inline-block}
.last .roll{animation:roll .45s cubic-bezier(.2,.8,.2,1)}
.last.up .roll{color:var(--buy)} .last.dn .roll{color:var(--sell)}
@keyframes roll{from{transform:translateY(-.5em);opacity:0}to{transform:none;opacity:1}}
.stats{display:flex;gap:22px;color:var(--muted);font-size:13px}
.stats b{display:block;color:var(--ink-2);font-size:15px;font-weight:700}
.tf{display:flex;gap:4px;padding:6px 22px}
.tf button{height:30px;padding:0 12px;border-radius:999px;color:var(--muted);font-weight:700;font-size:13px}
.tf button[aria-pressed="true"]{background:var(--desk-2);color:var(--ink)}
.chartbox{position:relative;flex:1;min-height:220px;margin:0 10px 10px}
canvas{display:block;width:100%;height:100%}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.tape{border-top:1px solid var(--line);height:170px;overflow:auto;padding:4px 16px}
.tape table{width:100%;border-collapse:collapse;font-size:13px}
.tape td{padding:3px 0}
.tape td:last-child{text-align:end;color:var(--muted)}

/* right: book + ticket */
.book{flex:1;overflow:hidden;display:flex;flex-direction:column;font-size:13px}
.lvls{flex:1;display:flex;flex-direction:column;overflow:hidden}
.lvls.asks{justify-content:flex-end}
.lvl{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:2px 16px;cursor:pointer}
.lvl i{position:absolute;inset-block:1px;inset-inline-end:0;border-radius:3px 0 0 3px}
.asks i{background:var(--sell-soft)} .bids i{background:var(--buy-soft)}
.lvl span{position:relative}
.lvl span:first-child{justify-self:start}
.lvl span:last-child{justify-self:end;color:var(--ink-2)}
.asks .lvl span:first-child{color:var(--sell)} .bids .lvl span:first-child{color:var(--buy)}
.mid{padding:6px 16px;font-weight:800;font-size:16px;border-block:1px solid var(--line);display:flex;justify-content:space-between}
.mid small{color:var(--muted);font-weight:500;font-size:12px}
.ticket{border-top:1px solid var(--line);padding:14px 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.sides{display:grid;grid-template-columns:1fr 1fr;background:var(--desk);border-radius:var(--r2);padding:4px}
.sides button{height:38px;border-radius:11px;font-weight:800;color:var(--muted)}
.sides button[aria-pressed="true"].b{background:var(--buy);color:#0F1733}
.sides button[aria-pressed="true"].s{background:var(--sell);color:#0F1733}
.kinds{display:flex;gap:14px;font-size:14px;color:var(--muted)}
.kinds button[aria-pressed="true"]{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:6px}
.fld{display:flex;align-items:center;background:var(--desk);border:1px solid var(--line);border-radius:var(--r1);height:44px;padding:0 12px;gap:8px}
.fld:focus-within{border-color:var(--line-2)}
.fld label{color:var(--muted);font-size:13px;min-width:50px}
.fld input{flex:1;min-width:0;background:none;border:0;outline:0;text-align:end;direction:ltr;font-size:16px}
.fld em{font-style:normal;color:var(--muted);font-size:13px}
.pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pcts button{height:30px;border-radius:var(--r1);background:var(--desk);color:var(--ink-2);font-size:13px}
.sum{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.go{height:48px;border-radius:var(--r2);font-weight:800;font-size:16px;color:#0F1733}
.go.b{background:var(--buy)} .go.s{background:var(--sell)}
.go:disabled{opacity:.5;cursor:default}
.avail{color:var(--muted);font-size:13px}

/* bottom drawer: my orders */
.mine{position:fixed;inset-inline:0;bottom:0;background:var(--desk);border-top:1px solid var(--line-2);transform:translateY(calc(100% - 44px));transition:transform .3s;z-index:20;max-height:52vh;display:flex;flex-direction:column}
.mine.open{transform:none}
.mine>button{height:44px;font-weight:700;color:var(--ink-2)}
.mine table{width:100%;border-collapse:collapse;font-size:13px}
.mine th{color:var(--muted);font-weight:500;text-align:start;padding:6px 16px}
.mine td{padding:6px 16px;border-top:1px solid var(--line)}
.mine .scroll{overflow:auto}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,8,22,.66);display:grid;place-items:center;z-index:50;padding:16px}
.sheet{background:var(--desk);border:1px solid var(--line-2);border-radius:20px;width:100%;max-width:420px;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:92dvh;overflow:auto}
.sheet h2{margin:0;font-size:20px}
.sheet p{margin:0;color:var(--ink-2)}
.sheet .fld{background:var(--ground)}
.hues{display:flex;gap:8px;flex-wrap:wrap}
.hues button{width:30px;height:30px;border-radius:50%}
.hues button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.msg{min-height:20px;font-size:14px;color:var(--brass)}
.toast{position:fixed;bottom:60px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-weight:700;z-index:60;pointer-events:none}

/* admin */
.admin{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink-2)}
.admin .row{display:flex;gap:8px;flex-wrap:wrap}

/* phone */
.tabs{display:none}
@media (max-width:980px){
  .desk{grid-template-columns:1fr;height:auto;min-height:calc(100dvh - 58px - 56px);padding-bottom:100px}
  .desk>section{display:none}
  .desk>section.on{display:flex;min-height:calc(100dvh - 58px - 56px - 44px)}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:44px;inset-inline:0;height:56px;background:var(--ground);border-top:1px solid var(--line);z-index:15}
  .tabs button{color:var(--muted);font-weight:700;font-size:13px}
  .tabs button[aria-current="true"]{color:var(--ink)}
  .top .demo{font-size:11px;padding:2px 8px;white-space:normal;max-width:96px;line-height:1.2}
  .top{gap:8px}
  .brand span,.wallet-pill span:last-child{display:none}
  .lang{width:84px}
  .btn{padding:0 12px}
  .who{min-width:0}.who h1{font-size:17px;overflow-wrap:anywhere}
  .head{padding:14px 16px 4px}
  .chartbox{min-height:300px}
}
@media (prefers-reduced-motion:reduce){.last .roll{animation:none}.mine{transition:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="Barusik">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#3DDBB8" stroke-width="2"/><path d="M11 9h7a4 4 0 0 1 0 8h-7zm0 8h8a4 4 0 0 1 0 8h-8z" fill="none" stroke="#E8ECFF" stroke-width="2.2" stroke-linejoin="round"/><path d="M14 6v3M14 25v3" stroke="#E8ECFF" stroke-width="2.2"/></svg>
    <span>Barusik Crypto</span>
  </a>
  <span class="demo" id="demo" data-t="demo"></span>
  <span class="grow"></span>
  <select class="lang" id="lang" aria-label="Language"></select>
  <span class="wallet-pill hide" id="pill"><span class="n" id="pillUsd"></span><span>USDB</span></span>
  <button class="btn main" id="loginBtn" data-t="login"></button>
</header>

<main class="desk" id="desk">
  <section id="pMarkets" aria-labelledby="hMarkets">
    <div class="ph"><h2 id="hMarkets" data-t="markets"></h2><span data-t="last24"></span></div>
    <input class="search" id="q" type="search" autocomplete="off">
    <div class="mlist" id="mlist" role="list"></div>
    <button class="newcoin" id="newCoin" data-t="create"></button>
  </section>

  <section id="pChart" class="on" aria-label="chart">
    <div class="head">
      <div class="who"><span class="coin" id="wCoin"></span><div><h1 id="wName"></h1><p id="wAbout"></p></div></div>
      <div class="last n" id="last" aria-live="polite"></div>
      <div class="stats">
        <div><span data-t="chg"></span><b class="n" id="sChg">–</b></div>
        <div><span data-t="vol"></span><b class="n" id="sVol">–</b></div>
        <div id="worldBox"><span data-t="world"></span><b class="n" id="sWorld">–</b></div>
      </div>
    </div>
    <div class="tf" id="tf" role="group"></div>
    <div class="chartbox"><canvas id="chart"></canvas><div class="empty hide" id="chartEmpty" data-t="noTrades"></div></div>
    <div class="tape"><table><tbody id="tape"></tbody></table></div>
  </section>

  <section id="pBook" aria-labelledby="hBook">
    <div class="book">
      <div class="ph"><h2 id="hBook" data-t="book"></h2><span><span data-t="price"></span> / <span data-t="amount"></span></span></div>
      <div class="lvls asks" id="asks"></div>
      <div class="mid"><span class="n" id="mid">–</span><small id="spread"></small></div>
      <div class="lvls bids" id="bids"></div>
    </div>
    <form class="ticket" id="ticket" novalidate>
      <div class="sides" role="group"><button type="button" class="b" id="sideB" aria-pressed="true" data-t="buy"></button><button type="button" class="s" id="sideS" aria-pressed="false" data-t="sell"></button></div>
      <div class="kinds" role="group"><button type="button" id="kLimit" aria-pressed="true" data-t="limit"></button><button type="button" id="kMarket" aria-pressed="false" data-t="marketOrder"></button></div>
      <div class="fld" id="fPrice"><label for="iPrice" data-t="price"></label><input id="iPrice" inputmode="decimal" autocomplete="off"><em>USDB</em></div>
      <div class="fld"><label for="iQty" data-t="amount"></label><input id="iQty" inputmode="decimal" autocomplete="off"><em id="qSym"></em></div>
      <div class="pcts" id="pcts"><button type="button" data-p=".25">25%</button><button type="button" data-p=".5">50%</button><button type="button" data-p=".75">75%</button><button type="button" data-p="1">100%</button></div>
      <div class="sum"><span data-t="total"></span><span class="n" id="total">–</span></div>
      <div class="avail" id="avail"></div>
      <button class="go b" id="go" type="submit"></button>
    </form>
    <div class="admin hide" id="admin">
      <b data-t="adminTitle"></b>
      <div id="adminStats"></div>
      <div class="row"><button type="button" class="btn" id="aLiq" data-t="adminLiq"></button><button type="button" class="btn" id="aHalt"></button></div>
    </div>
  </section>
</main>

<nav class="tabs" id="tabs" aria-label="panels">
  <button data-p="pMarkets" data-t="markets"></button>
  <button data-p="pChart" aria-current="true" data-t="chart"></button>
  <button data-p="pBook" data-t="trade"></button>
  <button data-p="mine" data-t="myOrders"></button>
</nav>

<div class="mine" id="mine">
  <button type="button" id="mineBtn"></button>
  <div class="scroll"><table><thead><tr><th data-t="market"></th><th data-t="side"></th><th data-t="price"></th><th data-t="filledCol"></th><th></th></tr></thead><tbody id="mineRows"></tbody></table></div>
</div>

  const lastK=c[c.length-1],ly=y(+lastK[4]);cx.setLineDash([3,4]);cx.strokeStyle=muted;cx.beginPath();cx.moveTo(0,ly);cx.lineTo(W-padR,ly);cx.stroke();cx.setLineDash([]);
  cx.fillStyle=muted;const fmtT=s=>{const d=new Date(s*1000);return S.tf>=1440?d.toLocaleDateString(L,{day:'numeric',month:'short'}):d.toLocaleTimeString(L,{hour:'2-digit',minute:'2-digit'})};
  [0,Math.floor(c.length/2),c.length-1].forEach(i=>{if(c[i]){cx.textAlign='center';cx.fillText(fmtT(+c[i][0]),(first+i)*bw+bw/2,H-6)}});
}
addEventListener('resize',()=>drawChart());
$('#tf').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;S.tf=+b.dataset.m;document.querySelectorAll('#tf button').forEach(x=>x.setAttribute('aria-pressed',x===b));loadCandles()};

/* ---------- book & tape ---------- */
function renderBook(){
  const {bids,asks}=S.book,a=cur(),d=dec(a?.last||asks[0]?.[0]||1);
  const max=Math.max(1,...bids.map(x=>+x[1]),...asks.map(x=>+x[1]));
  const row=x=>`<div class="lvl" data-p="${x[0]}"><i style="width:${(+x[1]/max*100).toFixed(1)}%"></i><span class="n">${fmt(x[0],d)}</span><span class="n">${fmtQ(+x[1])}</span></div>`;
  $('#asks').innerHTML=asks.slice(0,12).reverse().map(row).join('');
  $('#bids').innerHTML=bids.slice(0,12).map(row).join('');
  const bb=bids[0]?.[0],ba=asks[0]?.[0];
  $('#mid').textContent=bb&&ba?fmt((+bb+ +ba)/2,d):a?.last?fmt(a.last,d):'–';
  $('#spread').textContent=bb&&ba?`spread ${((ba-bb)/ba*100).toFixed(2)}%`:'';
}
document.querySelector('.book').onclick=e=>{const l=e.target.closest('[data-p]');if(!l)return;setKind('limit');$('#iPrice').value=l.dataset.p;calc()};
function renderTape(){
  const d=dec(cur()?.last||1);
  $('#tape').innerHTML=S.tape.map(r=>`<tr><td class="n ${r[3]==='buy'?'up':'dn'}">${fmt(r[1],d)}</td><td class="n">${fmtQ(+r[2])}</td><td>${new Date(r[4]*1000).toLocaleTimeString(L,{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</td></tr>`).join('');
}

/* ---------- ticket ---------- */
function setSide(s){S.side=s;$('#sideB').setAttribute('aria-pressed',s==='buy');$('#sideS').setAttribute('aria-pressed',s==='sell');paintTicket()}
function setKind(k){S.kind=k;$('#kLimit').setAttribute('aria-pressed',k==='limit');$('#kMarket').setAttribute('aria-pressed',k==='market');$('#fPrice').classList.toggle('hide',k==='market');calc()}
$('#sideB').onclick=()=>setSide('buy');$('#sideS').onclick=()=>setSide('sell');$('#kLimit').onclick=()=>setKind('limit');$('#kMarket').onclick=()=>setKind('market');
function refPrice(){if(S.kind==='limit'&&+$('#iPrice').value>0)return +$('#iPrice').value;const b=S.book;return S.side==='buy'?+(b.asks[0]?.[0]||cur()?.last||0):+(b.bids[0]?.[0]||cur()?.last||0)}
function calc(){const p=refPrice(),q=+$('#iQty').value;$('#total').textContent=p&&q?fmt(p*q,2)+' USDB':'–'}
$('#iPrice').oninput=calc;$('#iQty').oninput=calc;
$('#pcts').onclick=e=>{const b=e.target.closest('[data-p]');if(!b||!S.user)return;const f=+b.dataset.p,a=cur();
  if(S.side==='sell'){$('#iQty').value=+(Number(S.bal[a.symbol]?.available||0)*f).toFixed(8)}
  else{const p=refPrice();if(p)$('#iQty').value=+(Number(S.bal.USDB?.available||0)*f/p/1.002).toFixed(8)}calc()};
function paintTicket(){
  const a=cur();if(!a)return;$('#qSym').textContent=a.symbol;
  const g=$('#go');g.className='go '+(S.side==='buy'?'b':'s');
  if(!S.user){g.textContent=t('signFirst');$('#avail').textContent='';}
  else if(!S.bal.USDB&&!Object.keys(S.bal).length){g.textContent=t('claim');}
  else g.textContent=t(S.side==='buy'?'buyX':'sellX',{s:a.symbol});
  if(S.user)$('#avail').textContent=S.side==='buy'?t('availB',{v:fmt(S.bal.USDB?.available||0)}):t('availS',{v:fmtQ(+(S.bal[a.symbol]?.available||0)),s:a.symbol});
  g.disabled=!!a.halted&&!!S.user;calc();
}
$('#ticket').onsubmit=async e=>{e.preventDefault();
  if(!S.user)return loginSheet();
  if(!Object.keys(S.bal).length){try{await sb.rpc('cx_claim').then(r=>{if(r.error)throw r.error});toast(t('claimed'));await loadMe()}catch(x){toast(errText(x))}return}
  const q=+$('#iQty').value,p=+$('#iPrice').value;if(!(q>0)||(S.kind==='limit'&&!(p>0)))return toast(t('err.bad'));
  const g=$('#go');g.disabled=true;
  try{
    const r=S.kind==='limit'?await sb.rpc('cx_order',{p_market:S.m,p_side:S.side,p_price:p,p_qty:q}):await sb.rpc('cx_market',{p_market:S.m,p_side:S.side,p_qty:q});
    if(r.error)throw r.error;const o=r.data;
    toast(o.status==='filled'?t('filled'):+o.filled>0?t('partial'):o.status==='cancelled'?t('cancelled'):t('placed'));
    $('#iQty').value='';calc();await Promise.all([loadMe(),refreshMarket()]);
  }catch(x){toast(errText(x))}finally{g.disabled=false}
};

/* ---------- my orders ---------- */
function renderMine(){
  const open=S.orders.filter(o=>o.status==='open');
  $('#mineBtn').textContent=`${t('myOrders')} (${open.length})`;
  $('#mineRows').innerHTML=open.length?open.map(o=>`<tr><td class="n">${esc(o.market)}</td><td class="${o.side==='buy'?'up':'dn'}">${t(o.side)}</td><td class="n">${fmt(o.price,dec(o.price))}</td><td class="n">${fmtQ(+o.filled)} / ${fmtQ(+o.qty)}</td><td><button class="btn" data-x="${o.id}">${t('cancel')}</button></td></tr>`).join('')
    +`<tr><td colspan="5"><button class="btn" id="xAll">${t('cancelAll')}</button></td></tr>`:`<tr><td colspan="5">${t('none')}</td></tr>`;
}
$('#mineBtn').onclick=()=>$('#mine').classList.toggle('open');
$('#mineRows').onclick=async e=>{const b=e.target.closest('[data-x]');const all=e.target.closest('#xAll');if(!b&&!all)return;
  const r=all?await sb.rpc('cx_cancel_all',{}):await sb.rpc('cx_cancel',{p_id:+b.dataset.x});if(r.error)return toast(errText(r.error));toast(t('cancelled'));loadMe();refreshMarket()};

/* ---------- data ---------- */
async function loadMarkets(){const r=await sb.rpc('cx_markets');if(!r.error){S.markets=r.data||[];if(!cur()&&S.markets[0])S.m=S.markets[0].symbol;renderMarkets();renderHead();paintTicket()}}
async function loadCandles(){const r=await sb.rpc('cx_candles',{p_market:S.m,p_minutes:S.tf,p_limit:120});if(!r.error){S.candles=r.data||[];drawChart()}}
async function refreshMarket(){
  const [b,tp]=await Promise.all([sb.rpc('cx_book',{p_market:S.m,p_depth:14}),sb.rpc('cx_tape',{p_market:S.m,p_limit:40})]);
  if(!b.error){S.book=b.data;renderBook()}if(!tp.error){S.tape=tp.data;renderTape()}
  loadCandles();loadMarkets();
}
async function loadMe(){
  if(!S.user){S.bal={};S.orders=[];paintTicket();renderMine();return}
  const [b,o]=await Promise.all([sb.from('cx_balances').select('asset,available,locked'),sb.from('cx_orders').select('id,market,side,price,qty,filled,status').eq('status','open').order('id',{ascending:false}).limit(100)]);
  S.bal=Object.fromEntries((b.data||[]).map(x=>[x.asset,x]));S.orders=o.data||[];
  $('#pill').classList.toggle('hide',!S.bal.USDB);$('#pillUsd').textContent=fmt(S.bal.USDB?.available||0);
  paintTicket();renderMine();
}
async function loadWorld(){
  try{const ids=Object.values(WORLD_IDS).join(',');const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`);const j=await r.json();
    for(const[s,id]of Object.entries(WORLD_IDS))if(j[id])S.world[s]=j[id].usd;renderHead()}catch{}
}

/* ---------- account ---------- */
function loginSheet(){
  const d=document.createElement('div');d.className='scrim';d.innerHTML=`<form class="sheet" role="dialog" aria-modal="true" aria-labelledby="lgT" novalidate>
    <h2 id="lgT">${t('signIn')}</h2>
    <div class="fld"><label for="lgE">${t('email')}</label><input id="lgE" type="email" autocomplete="email" dir="ltr"></div>
    <div class="fld"><label for="lgP">${t('password')}</label><input id="lgP" type="password" autocomplete="current-password" dir="ltr"></div>
    <p class="msg" role="alert"></p>
    <button class="go b">${t('signIn')}</button>
    <a href="/${L}/">${t('noAcc')}</a>
    <button type="button" class="btn" data-close>${t('close')}</button></form>`;
  document.body.appendChild(d);d.querySelector('input').focus();
  const close=()=>d.remove();d.onclick=e=>{if(e.target===d||e.target.closest('[data-close]'))close()};
  d.querySelector('form').onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:$('#lgE').value.trim(),password:$('#lgP').value});
    if(r.error)d.querySelector('.msg').textContent=t('badLogin');else close()};
}
$('#loginBtn').onclick=async()=>{if(S.user){await sb.auth.signOut()}else loginSheet()};

/* ---------- create a coin ---------- */
$('#newCoin').onclick=()=>{
  if(!S.user)return loginSheet();
  let hue=170;const d=document.createElement('div');d.className='scrim';
  d.innerHTML=`<form class="sheet" role="dialog" aria-modal="true" aria-labelledby="ncT" novalidate>
    <h2 id="ncT">${t('create').replace('+ ','')}</h2><p>${t('cFee',{f:100})}</p>
    <div class="fld"><label for="ncS">${t('cSym')}</label><input id="ncS" maxlength="10" autocomplete="off" style="text-transform:uppercase"></div>
    <div class="fld"><label for="ncN">${t('cName')}</label><input id="ncN" maxlength="32" autocomplete="off" style="text-align:start;direction:auto"></div>
    <div class="fld"><label for="ncQ">${t('cSupply')}</label><input id="ncQ" inputmode="numeric" value="1000000"></div>
    <div class="fld"><label for="ncA">${t('cAbout')}</label><input id="ncA" maxlength="280" style="text-align:start;direction:auto"></div>
    <span>${t('cColor')}</span><div class="hues">${[170,40,0,210,280,330,95].map(h=>`<button type="button" data-h="${h}" aria-label="${h}" aria-pressed="${h===hue}" style="background:hsl(${h} 70% 62%)"></button>`).join('')}</div>
    <p class="msg" role="alert"></p>
    <button class="go b">${t('cGo')}</button><button type="button" class="btn" data-close>${t('close')}</button></form>`;
  document.body.appendChild(d);d.querySelector('input').focus();
  d.onclick=e=>{if(e.target===d||e.target.closest('[data-close]'))d.remove();const h=e.target.closest('[data-h]');if(h){hue=+h.dataset.h;d.querySelectorAll('[data-h]').forEach(x=>x.setAttribute('aria-pressed',x===h))}};
  d.querySelector('form').onsubmit=async e=>{e.preventDefault();
    const r=await sb.rpc('cx_create_coin',{p_symbol:$('#ncS').value,p_name:$('#ncN').value,p_supply:+$('#ncQ').value.replace(/,/g,''),p_hue:hue,p_about:$('#ncA').value});
    if(r.error)return d.querySelector('.msg').textContent=errText(r.error);
    d.remove();toast(t('cMade',{s:r.data.symbol,n:fmtQ(+$('#ncQ')?.value||0)}));await loadMarkets();pick(r.data.symbol);loadMe();setSide('sell')};
};

/* ---------- admin ---------- */
async function loadAdmin(){
  if(!S.admin)return $('#admin').classList.add('hide');
  $('#admin').classList.remove('hide');const r=await sb.rpc('cx_admin_overview');if(r.error)return;const o=r.data;
  $('#adminStats').innerHTML=`${esc(o.mode)} · fees <span class="n">${fmt(o.fees_usdb)}</span> USDB · ${o.traders} traders · ${o.trades_24h} trades/24h · <span class="n">${big(+o.volume_24h)}</span> vol · books ${o.books_balance?'✓':'✗'}`;
  $('#aHalt').textContent=cur()?.halted?t('resume'):t('halt');
}
$('#aLiq').onclick=async()=>{await loadWorld();let n=0;for(const s of Object.keys(WORLD_IDS)){if(!S.world[s])continue;const r=await sb.rpc('cx_admin_liquidity',{p_market:s,p_ref:S.world[s]});if(r.error)toast(r.error.message);else n+=r.data}toast(`+${n}`);refreshMarket();loadAdmin()};
$('#aHalt').onclick=async()=>{const a=cur();await sb.rpc('cx_admin_halt',{p_market:a.symbol,p_halted:!a.halted});await loadMarkets();loadAdmin()};

/* ---------- phone panels ---------- */
function show(id){
  if(id==='mine'){$('#mine').classList.add('open');return}
  document.querySelectorAll('.desk>section').forEach(s=>s.classList.toggle('on',s.id===id));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.p===id));
  if(id==='pChart')requestAnimationFrame(drawChart);
}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-p]');if(b)show(b.dataset.p)};

/* ---------- boot ---------- */
paint();
if(!sb){$('#chartEmpty').textContent='Network error';$('#chartEmpty').classList.remove('hide')}
else{
  sb.auth.onAuthStateChange((_e,session)=>{S.user=session?.user||null;$('#loginBtn').textContent=S.user?t('logout'):t('login');
    if(S.user)sb.rpc('is_admin').then(r=>{S.admin=r.data===true;loadAdmin()});else{S.admin=false;loadAdmin()}loadMe()});
  loadMarkets().then(refreshMarket);loadWorld();
  setInterval(()=>{if(!document.hidden)refreshMarket()},3000);
  setInterval(()=>{if(!document.hidden){loadMe();if(S.admin)loadAdmin()}},6000);
  setInterval(loadWorld,60000);
}
</script>
</body>
</html>
