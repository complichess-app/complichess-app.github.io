<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מה פנינה חושבת על הצ'אט שלכם</title>
<meta name="description" content="מעלים צ'אט מוואטסאפ ופנינה כותבת עליו דוח: מי מחזיק את הקבוצה, מי נעלם, מי מתנצל יותר מדי.">
<meta name="theme-color" content="#24122E">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;800&display=swap">
<style>
/* Penina. The pearl is the one loud thing: it sits on the first screen, it holds the score in the report.
   Everything else is plain text on aubergine, set like a letter from your aunt. */
:root{
  --night:#24122E; --plum:#331C42; --plum-2:#432757; --line:rgba(247,239,245,.12);
  --pearl:#F7EFF5; --pearl-2:#D9C9DD; --muted:#A891B3;
  --lip:#F0507F; --lip-ink:#2A0A17; --mint:#7BE0B8; --amber:#FFC46B;
  --fd:"Secular One","Assistant",system-ui,sans-serif; --fb:"Assistant","Arial Hebrew",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--pearl);font:18px/1.6 var(--fb);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--lip)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:8px}
.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.hide{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1100px;margin:0 auto}
header a.home{color:var(--pearl-2);text-decoration:none;font-weight:600;font-size:15px}
header select{background:var(--plum);border:1px solid var(--line);border-radius:999px;height:38px;padding:0 10px}

/* the pearl */
.pearl{--s:180px;width:var(--s);height:var(--s);border-radius:50%;position:relative;flex:none;
  background:radial-gradient(circle at 34% 28%,#fff 0 6%,rgba(255,255,255,.75) 10%,transparent 30%),
             radial-gradient(circle at 70% 78%,rgba(240,80,127,.32),transparent 45%),
             radial-gradient(circle at 50% 50%,#FBF4FA 0%,#E7D6E8 55%,#B9A0C2 100%);
  box-shadow:inset -12px -16px 30px rgba(80,40,90,.35),inset 8px 10px 22px rgba(255,255,255,.6),0 30px 60px -20px rgba(0,0,0,.6)}
.pearl.rolls{animation:roll 1.4s cubic-bezier(.2,.9,.25,1) both}
@keyframes roll{from{transform:translateX(calc(var(--dir,1)*-60vw)) rotate(calc(var(--dir,1)*-540deg))}to{transform:none}}

.hero{display:flex;align-items:center;gap:36px;padding:40px 0 30px}
.hero h1{font-family:var(--fd);font-weight:400;font-size:clamp(40px,7vw,76px);line-height:1;margin:0 0 14px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--pearl-2);font-size:19px;max-width:34ch}

.drop{display:block;margin:26px 0 8px;border:2px dashed rgba(247,239,245,.28);border-radius:26px;padding:34px 24px;text-align:center;transition:border-color .2s,background .2s}
.drop.over{border-color:var(--lip);background:rgba(240,80,127,.07)}
.drop b{display:block;font-family:var(--fd);font-weight:400;font-size:26px;margin-bottom:6px}
.drop p{margin:0 0 18px;color:var(--muted)}
.pick{display:inline-flex;align-items:center;height:54px;padding:0 28px;border-radius:999px;background:var(--lip);color:var(--lip-ink);font-weight:800;font-size:18px}
.private{color:var(--muted);font-size:15px;text-align:center;margin:6px 0 34px}

details.how{border-top:1px solid var(--line);padding:16px 0}
details.how summary{cursor:pointer;font-weight:800;font-size:18px;list-style:none}
details.how summary::before{content:'+';display:inline-block;width:22px;color:var(--lip)}
details.how[open] summary::before{content:'–'}
.how ol{margin:12px 0 0;padding-inline-start:44px;color:var(--pearl-2)}

/* stats */
.sec{padding:30px 0;border-top:1px solid var(--line)}
.sec h2{font-family:var(--fd);font-weight:400;font-size:30px;margin:0 0 6px}
.sec .sub{color:var(--muted);margin:0 0 20px;font-size:16px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.facts div{font-size:15px;color:var(--muted)}
.facts b{display:block;font-family:var(--fd);font-weight:400;font-size:30px;color:var(--pearl);line-height:1.1}
.who{display:grid;gap:0}
.person{display:grid;grid-template-columns:44px 1fr auto;gap:4px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--night);grid-row:span 2}
.person .nm{font-weight:800}
.person .meta{grid-column:2/4;color:var(--muted);font-size:15px}
.bar{height:8px;border-radius:999px;background:var(--plum-2);overflow:hidden;width:120px}
.bar i{display:block;height:100%;background:var(--lip)}
.clock{direction:ltr;display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end;height:90px;margin-top:12px}
.clock i{background:var(--plum-2);border-radius:3px 3px 0 0;min-height:3px}
.clock i.top{background:var(--amber)}
.clock-l{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;direction:ltr}

.ask{background:var(--plum);border-radius:26px;padding:26px;margin:10px 0 40px;display:flex;flex-direction:column;gap:14px}
.ask h3{margin:0;font-family:var(--fd);font-weight:400;font-size:26px}
.ask p{margin:0;color:var(--pearl-2)}
.go{height:56px;border-radius:999px;background:var(--lip);color:var(--lip-ink);font-weight:800;font-size:18px}
.go:disabled{opacity:.6;cursor:wait}
.msg{color:var(--amber);font-weight:600;min-height:1em;margin:0}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
.fld input{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--night);padding:0 14px;direction:ltr;text-align:start}

/* report */
.report .verdict{display:flex;gap:28px;align-items:center;padding:34px 0 10px}
.report .verdict .pearl{--s:150px;display:grid;place-items:center}
.score{font-family:var(--fd);font-size:54px;color:var(--lip-ink);line-height:1}
.score small{font-size:20px;opacity:.6}
.report h1{font-family:var(--fd);font-weight:400;font-size:clamp(32px,5.6vw,54px);line-height:1.05;margin:0}
.report .lead{font-size:20px;color:var(--pearl);margin:18px 0 0}
.report .sline{color:var(--muted);margin:8px 0 0}
.card{padding:24px 0;border-bottom:1px solid var(--line)}
.card .top{display:flex;align-items:center;gap:14px}
.card h3{margin:0;font-size:22px}
.card .role{color:var(--amber);font-weight:600}
.card p{margin:10px 0 0}
.flags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:15px}
.flags span{border-radius:999px;padding:4px 12px}
.flags .g{background:rgba(123,224,184,.14);color:var(--mint)}
.flags .r{background:rgba(240,80,127,.16);color:#FF8FB0}
.kind{color:var(--pearl-2);font-style:italic}
.card:last-child,blockquote:last-child{border-bottom:0}
blockquote{margin:0;padding:16px 0;border-bottom:1px solid var(--line)}
blockquote q{font-family:var(--fd);font-size:22px;quotes:'״' '״'}
blockquote cite{display:block;color:var(--muted);font-style:normal;font-size:15px;margin-top:4px}
ul.dyn{margin:0;padding-inline-start:20px}
ul.dyn li{margin:8px 0}
.advice{font-family:var(--fd);font-size:24px;line-height:1.35;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:12px;padding:30px 0 60px}
.btn2{height:50px;padding:0 22px;border-radius:999px;border:1px solid rgba(247,239,245,.3);font-weight:800}

.wait{display:flex;flex-direction:column;align-items:center;gap:20px;padding:60px 0;text-align:center}
.wait .pearl{--s:110px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(20deg)}}

footer{color:var(--muted);font-size:14px;text-align:center;padding:30px 20px 50px;border-top:1px solid var(--line)}

@media (max-width:640px){
  .hero{flex-direction:column;align-items:flex-start;gap:20px;padding-top:20px}
  .hero .pearl{--s:120px}
  .report .verdict{flex-direction:column;align-items:flex-start}
  .bar{width:70px}
}
@media (prefers-reduced-motion:reduce){.pearl.rolls,.wait .pearl{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><a class="home" href="/" data-t="home"></a><select id="lang" aria-label="Language"></select></header>

<main class="wrap">
  <!-- 1. upload -->
  <section id="start">
    <div class="hero"><div class="pearl rolls" aria-hidden="true"></div><div><h1 data-t="title"></h1><p data-t="lead"></p></div></div>
    <label class="drop" id="drop">
      <b data-t="drop"></b><p data-t="dropSub"></p>
      <span class="pick" data-t="choose"></span>
      <input type="file" id="file" accept=".txt,.zip,text/plain,application/zip" class="hide">
    </label>
    <p class="private" data-t="private"></p>
    <details class="how"><summary data-t="howIphone"></summary><ol data-list="stepsIphone"></ol></details>
    <details class="how"><summary data-t="howAndroid"></summary><ol data-list="stepsAndroid"></ol></details>
    <p class="msg" id="readMsg" role="alert"></p>
  </section>

  <!-- 2. what the browser found on its own -->
  <section id="local" class="hide">
    <div class="sec"><h2 id="chatTitle"></h2><p class="sub" data-t="localSub"></p><div class="facts" id="facts"></div></div>
    <div class="sec"><h2 data-t="whoTalks"></h2><div class="who" id="people"></div></div>
    <div class="sec"><h2 data-t="when"></h2><div class="clock" id="clock" aria-hidden="true"></div><div class="clock-l"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div><p class="sub" id="clockLine" style="margin-top:12px"></p></div>
    <div class="ask" id="ask">
      <h3 data-t="askTitle"></h3><p data-t="askSub"></p>
      <div id="loginBox" class="hide">
        <div class="fld"><label for="em" data-t="email"></label><input id="em" type="email" autocomplete="email"></div>
        <div class="fld" style="margin-top:10px"><label for="pw" data-t="password"></label><input id="pw" type="password" autocomplete="current-password"></div>
        <p style="margin-top:10px"><a href="/he/" data-t="noAcc"></a></p>
      </div>
      <p class="msg" id="askMsg" role="alert"></p>
      <button class="go" id="goBtn" type="button"></button>
      <button type="button" id="forgetBtn" data-t="forget" style="color:var(--muted);font-size:15px;text-decoration:underline;text-underline-offset:4px;align-self:center"></button>
    </div>
  </section>

  <!-- 3. waiting -->
  <section id="wait" class="wait hide" aria-live="polite"><div class="pearl" aria-hidden="true"></div><p id="waitLine"></p></section>

  <!-- 4. the report -->
  <section id="report" class="report hide"></section>
</main>
<footer data-t="foot"></footer>

<script src="chat.js"></script>

const drop=$('#drop');

async function openChat(f){
  $('#readMsg').textContent='';
  try{
    const text=await PeninaChat.readFile(f);const msgs=PeninaChat.parse(text);
    if(!msgs.length)throw 0;if(msgs.length<50)return $('#readMsg').textContent=t('tooSmall');

}

/* ---------- local stats ---------- */
function renderLocal(){
  const s=STATS,ppl=s.people;
  $('#chatTitle').textContent=ppl.slice(0,3).map(p=>p.name).join(', ')+(ppl.length>3?` \u2066+${ppl.length-3}\u2069`:'');
  const f=[[s.total.toLocaleString(),t('msgs')],[s.spanDays.toLocaleString(),t('days')],[s.activeDays.toLocaleString(),t('active')],[s.bestStreakDays,t('streak')],[ppl.length,t('people')]];
  $('#facts').innerHTML=f.map(([v,l])=>`<div><b class="n">${v}</b>${esc(l)}</div>`).join('');
  const max=ppl[0]?.msgs||1;
  $('#people').innerHTML=ppl.slice(0,12).map(p=>{
    const bits=[t('starts',{n:p.starts})];if(p.medianReplyMin!=null)bits.push(t('reply',{m:p.medianReplyMin}));if(p.media)bits.push(t('media',{n:p.media}));if(p.sorry)bits.push(t('sorry',{n:p.sorry}));if(p.nightPct>=8)bits.push(t('night',{p:p.nightPct}));
    return `<div class="person"><span class="dot" style="background:hsl(${hue(p.name)} 70% 72%)">${esc(initial(p.name))}</span><span class="nm">${esc(p.name)} <span class="n" style="color:var(--muted);font-weight:400">· ${p.share}%</span></span><span class="bar" aria-hidden="true"><i style="width:${(p.msgs/max*100).toFixed(0)}%"></i></span><span class="meta">${bits.map(esc).join(' · ')} ${p.topEmojis.slice(0,3).join('')}</span></div>`}).join('');
  const hm=Math.max(...s.hours,1);
  $('#clock').innerHTML=s.hours.map((v,i)=>`<i class="${i===s.busiestHour?'top':''}" style="height:${(v/hm*100).toFixed(0)}%"></i>`).join('');
  $('#clockLine').textContent=t('peak',{h:String(s.busiestHour).padStart(2,'0')});
}

  REQ=null;if(!sb||!USER)return;
  try{ADMIN=(await sb.rpc('is_admin')).data===true}catch{ADMIN=false}
  const r=await sb.from('pn_requests').select('id,status,created_at,decided_at').order('created_at',{ascending:false}).limit(5);
  if(r.error){BACKEND=!NOT_READY(r.error);return}
  BACKEND=true;const rows=r.data||[];
  REQ=rows.find(x=>x.status==='approved')||rows.find(x=>x.status==='pending')||rows[0]||null;
}
function goBtn(){
  const b=$('#goBtn'),m=$('#askMsg');$('#loginBox').classList.toggle('hide',!!USER);b.classList.remove('hide');
  clearInterval(pollReq);
  if(!USER){b.textContent=t('login');return}
  if(!BACKEND){b.classList.add('hide');m.textContent=t('soon');return}
  if(REQ?.status==='approved'){b.textContent=t('getReport');m.textContent=t('approved');return}
  if(REQ?.status==='pending'){b.textContent=t('check');m.textContent=t('pending');pollReq=setInterval(async()=>{if(document.hidden)return;await loadReq();if(REQ?.status!=='pending')goBtn()},20000);return}
  b.textContent=t('request');if(REQ?.status==='declined')m.textContent=t('declined');
}
async function refreshAsk(){await loadReq();$('#askMsg').textContent='';goBtn()}

$('#goBtn').onclick=async()=>{
  const m=$('#askMsg');m.textContent='';
  if(!sb)return m.textContent=t('busy');
  if(!USER){const r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error)return m.textContent=t('badLogin');USER=r.data.user;await refreshAsk();if(REQ?.status==='approved'||REQ?.status==='pending')return;}
  if(REQ?.status==='pending'){await refreshAsk();if(REQ?.status==='pending')m.textContent=t('pending');return}
  if(REQ?.status!=='approved'){
    const r=await sb.rpc('pn_request',{p_msgs:STATS.total,p_people:STATS.people.length,p_lang:L});
    if(r.error){m.textContent=NOT_READY(r.error)?t('soon'):/too many/.test(r.error.message)?t('tooMany'):t('busy');return}
    saveLocal();await refreshAsk();return;
  }
  $('#local').classList.add('hide');$('#wait').classList.remove('hide');scrollTo(0,0);
  let i=0;const lines=t('w');$('#waitLine').textContent=lines[0];const tick=setInterval(()=>$('#waitLine').textContent=lines[++i%lines.length],2600);
  try{
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(`${SB_URL}/functions/v1/penina`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`,apikey:SB_KEY},
      body:JSON.stringify({lang:L,stats:STATS,excerpt:EXCERPT})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||(r.status===404?'404':'busy'));
    REPORT=j.report;saveLocal();$('#wait').classList.add('hide');renderReport(REPORT);refreshAsk();
  }catch(e){
    $('#wait').classList.add('hide');$('#local').classList.remove('hide');await refreshAsk();
    m.textContent=String(e.message)==='not approved'?t('notApproved'):NOT_READY(e)?t('soon'):t('busy')+(ADMIN?` (${String(e.message).slice(0,60)})`:'');$('#ask').scrollIntoView();
  }finally{clearInterval(tick)}
};

/* ---------- the report ---------- */
function renderReport(r){
  const el=$('#report');el.classList.remove('hide');
  el.innerHTML=`
  <div class="verdict"><div class="pearl rolls" style="--dir:${RTL[L]?-1:1}" role="img" aria-label="${esc(t('score'))} ${r.score}/10"><span class="score n">${r.score}<small>/10</small></span></div>
    <div><h1>${esc(r.headline)}</h1>${r.score_line?`<p class="sline">${esc(r.score_line)}</p>`:''}</div></div>
  <p class="lead">${esc(r.verdict)}</p>
  <div class="sec"><h2>${t('people2')}</h2>${(r.people||[]).map(p=>`
    <article class="card"><div class="top"><span class="dot" style="background:hsl(${hue(p.name)} 70% 72%)">${esc(initial(p.name))}</span><div><h3>${esc(p.name)}</h3><span class="role">${esc(p.role)}</span></div></div>
      <p>${esc(p.roast)}</p><p class="kind">${esc(p.kind)}</p>
      <div class="flags"><span class="g">${t('green')}: ${esc(p.green)}</span><span class="r">${t('red')}: ${esc(p.red)}</span></div></article>`).join('')}</div>
  ${r.dynamics?.length?`<div class="sec"><h2>${t('dyn')}</h2><ul class="dyn">${r.dynamics.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
  ${r.moments?.length?`<div class="sec"><h2>${t('moments')}</h2>${r.moments.map(x=>`<blockquote><q>${esc(x.quote)}</q><cite>${esc(x.who)} · ${esc(x.note)}</cite></blockquote>`).join('')}</div>`:''}
  <div class="sec"><h2>${t('advice')}</h2><p class="advice">${esc(r.advice)}</p></div>
  <div class="actions"><button class="go" id="shareBtn" style="padding:0 26px">${t('share')}</button><button class="btn2" id="againBtn">${t('again')}</button></div>`;
  $('#shareBtn').onclick=share;$('#againBtn').onclick=()=>{REPORT=null;STATS=null;EXCERPT=null;forgetLocal();el.classList.add('hide');$('#start').classList.remove('hide');$('#file').value='';scrollTo(0,0)};
  scrollTo(0,0);
}

/* a story-sized picture of the verdict, drawn here so nothing leaves the phone */
async function share(){
  const r=REPORT,W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  await document.fonts.ready;const rtl=!!RTL[L];x.direction=rtl?'rtl':'ltr';
  x.fillStyle='#24122E';x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(400,520,20,540,600,260);g.addColorStop(0,'#FFFFFF');g.addColorStop(.25,'#FBF4FA');g.addColorStop(.7,'#E7D6E8');g.addColorStop(1,'#B9A0C2');
  x.fillStyle=g;x.beginPath();x.arc(540,600,250,0,7);x.fill();
  x.fillStyle='#2A0A17';x.textAlign='center';x.font='120px "Secular One"';x.fillText(`${r.score}/10`,540,640);
  const wrap=(txt,y,size,color,maxW=900,font='"Secular One"')=>{x.font=`${size}px ${font}`;x.fillStyle=color;const words=String(txt).split(' ');let line='',lines=[];for(const w of words){const tr=line?line+' '+w:w;if(x.measureText(tr).width>maxW){lines.push(line);line=w}else line=tr}lines.push(line);lines.forEach((l,i)=>x.fillText(l,540,y+i*size*1.2));return y+lines.length*size*1.2};
  let y=wrap(r.headline,1000,76,'#F7EFF5');y+=30;
  for(const p of (r.people||[]).slice(0,4)){y=wrap(`${p.name} · ${p.role}`,y+30,46,'#FFC46B',900,'Assistant');}
  x.font='40px Assistant';x.fillStyle='#A891B3';x.fillText('barusik.com/penina',540,1840);
  const blob=await new Promise(res=>c.toBlob(res,'image/png'));const file=new File([blob],'penina.png',{type:'image/png'});
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:t('title')});return}catch{}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='penina.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

try{const sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv&&sv.stats&&sv.excerpt&&Date.now()-sv.at<14*864e5){STATS=sv.stats;EXCERPT=sv.excerpt;REPORT=sv.report||null;$('#start').classList.add('hide');if(REPORT){renderReport(REPORT)}else $('#local').classList.remove('hide')}}catch{}
paint();
if(sb)sb.auth.onAuthStateChange((_e,s)=>{USER=s?.user||null;refreshAsk()});
</script>
