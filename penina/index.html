<style>
/* Penina. The pearl is the one loud thing: it sits on the first screen, it holds the score in the report.
   Everything else is plain text on aubergine, set like a letter from your aunt. */
:root{
  --night:#24122E; --plum:#331C42; --plum-2:#432757; --line:rgba(247,239,245,.12);
  --pearl:#F7EFF5; --pearl-2:#D9C9DD; --muted:#A891B3;
  --lip:#F0507F; --lip-ink:#2A0A17; --mint:#7BE0B8; --amber:#FFC46B;
  --fd:"Secular One","Assistant",system-ui,sans-serif; --fb:"Assistant","Arial Hebrew",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--pearl);font:18px/1.6 var(--fb);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
main{overflow-x:clip;overflow-wrap:break-word}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[tabindex="-1"]:focus{outline:none}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--lip)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:8px}
.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.hide{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1100px;margin:0 auto}
header a.home{color:var(--pearl-2);text-decoration:none;font-weight:600;font-size:15px;padding:10px 0}
header select{background:var(--plum);border:1px solid var(--line);border-radius:999px;height:44px;padding:0 12px;font-size:16px}

/* the pearl */
.pearl{--s:180px;width:var(--s);height:var(--s);border-radius:50%;position:relative;flex:none;
  background:radial-gradient(circle at 34% 28%,#fff 0 6%,rgba(255,255,255,.75) 10%,transparent 30%),
             radial-gradient(circle at 70% 78%,rgba(240,80,127,.32),transparent 45%),
             radial-gradient(circle at 50% 50%,#FBF4FA 0%,#E7D6E8 55%,#B9A0C2 100%);
  box-shadow:inset -12px -16px 30px rgba(80,40,90,.35),inset 8px 10px 22px rgba(255,255,255,.6),0 30px 60px -20px rgba(0,0,0,.6)}
.pearl.rolls{animation:roll 1.4s cubic-bezier(.2,.9,.25,1) both}
@keyframes roll{from{transform:translateX(calc(var(--dir,1)*-60vw)) rotate(calc(var(--dir,1)*-540deg))}to{transform:none}}

.hero{display:flex;align-items:center;gap:36px;padding:40px 0 30px}
.hero h1{font-family:var(--fd);font-weight:400;font-size:clamp(40px,7vw,76px);line-height:1;margin:0 0 14px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--pearl-2);font-size:19px;max-width:34ch}

.drop{display:block;position:relative;cursor:pointer;margin:26px 0 8px;border:2px dashed rgba(247,239,245,.28);border-radius:26px;padding:34px 24px;text-align:center;transition:border-color .2s,background .2s}
.drop.over{border-color:var(--lip);background:rgba(240,80,127,.07)}
.drop:focus-within{border-color:var(--amber)}
.drop.busy{opacity:.6;pointer-events:none}
.drop b{display:block;font-family:var(--fd);font-weight:400;font-size:26px;margin-bottom:6px}
.drop p{margin:0 0 18px;color:var(--muted)}
.pick{display:inline-flex;align-items:center;height:54px;padding:0 28px;border-radius:999px;background:var(--lip);color:var(--lip-ink);font-weight:800;font-size:18px}
.private{color:var(--muted);font-size:15px;text-align:center;margin:6px 0 34px}

details.how{border-top:1px solid var(--line);padding:16px 0}
details.how summary{cursor:pointer;font-weight:800;font-size:18px;list-style:none;min-height:44px;display:flex;align-items:center}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:'+';display:inline-block;width:22px;color:var(--lip)}
details.how[open] summary::before{content:'–'}
.how ol{margin:12px 0 0;padding-inline-start:44px;color:var(--pearl-2)}

/* stats */
.sec{padding:30px 0;border-top:1px solid var(--line)}
.sec h2{font-family:var(--fd);font-weight:400;font-size:30px;margin:0 0 6px}
.sec .sub{color:var(--muted);margin:0 0 20px;font-size:16px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.facts div{font-size:15px;color:var(--muted)}
.facts b{display:block;font-family:var(--fd);font-weight:400;font-size:30px;color:var(--pearl);line-height:1.1}
.who{display:grid;gap:0}
.person{display:grid;grid-template-columns:44px 1fr auto;gap:4px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--night);grid-row:span 2}
.person>*{min-width:0}
.person .nm{font-weight:800}
.person .meta{grid-column:2/4;color:var(--muted);font-size:15px}
.bar{height:8px;border-radius:999px;background:var(--plum-2);overflow:hidden;width:120px}
.bar i{display:block;height:100%;background:var(--lip)}
.clock{direction:ltr;display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end;height:90px;margin-top:12px}
.clock i{background:var(--plum-2);border-radius:3px 3px 0 0;min-height:3px}
.clock i.top{background:var(--amber)}
.clock-l{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;direction:ltr}

.ask{background:var(--plum);border-radius:26px;padding:26px;margin:10px 0 40px;display:flex;flex-direction:column;gap:14px}
.ask h3{margin:0;font-family:var(--fd);font-weight:400;font-size:26px}
.ask p{margin:0;color:var(--pearl-2)}
.go{height:56px;border-radius:999px;background:var(--lip);color:var(--lip-ink);font-weight:800;font-size:18px}
.go:disabled{opacity:.6;cursor:wait}
.msg{color:var(--amber);font-weight:600;min-height:1em;margin:0}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
.fld input{font-size:17px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--night);padding:0 14px;direction:ltr;text-align:start}

/* report */
.report .verdict{display:flex;gap:28px;align-items:center;padding:34px 0 10px}
.report .verdict .pearl{--s:150px;display:grid;place-items:center}
.score{font-family:var(--fd);font-size:54px;color:var(--lip-ink);line-height:1}
.score small{font-size:20px;opacity:.6}
.report .verdict>div{min-width:0;max-width:100%}
.report h1{overflow-wrap:anywhere;font-family:var(--fd);font-weight:400;font-size:clamp(32px,5.6vw,54px);line-height:1.05;margin:0}
.report .lead{font-size:20px;color:var(--pearl);margin:18px 0 0}
.report .sline{color:var(--muted);margin:8px 0 0}
.card{padding:24px 0;border-bottom:1px solid var(--line)}
.card .top{display:flex;align-items:center;gap:14px}
.card h3{margin:0;font-size:22px}
.card .role{color:var(--amber);font-weight:600}
.card p{margin:10px 0 0}
.flags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:15px}
.flags span{border-radius:999px;padding:4px 12px}
.flags .g{background:rgba(123,224,184,.14);color:var(--mint)}
.flags .r{background:rgba(240,80,127,.16);color:#FF8FB0}
.kind{color:var(--pearl-2);font-style:italic}
.card:last-child,blockquote:last-child{border-bottom:0}
blockquote{margin:0;padding:16px 0;border-bottom:1px solid var(--line)}
blockquote q{font-family:var(--fd);font-size:22px;quotes:'״' '״'}
blockquote cite{display:block;color:var(--muted);font-style:normal;font-size:15px;margin-top:4px}
ul.dyn{margin:0;padding-inline-start:20px}
ul.dyn li{margin:8px 0}
.advice{font-family:var(--fd);font-size:24px;line-height:1.35;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:12px;padding:30px 0 calc(60px + env(safe-area-inset-bottom))}
.btn2{height:50px;padding:0 22px;border-radius:999px;border:1px solid rgba(247,239,245,.3);font-weight:800}

.wait{display:flex;flex-direction:column;align-items:center;gap:20px;padding:60px 0;text-align:center}
.wait .pearl{--s:110px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(20deg)}}
.prog{width:min(320px,80vw);height:10px;border-radius:999px;background:var(--plum-2,rgba(255,255,255,.12));overflow:hidden}
.prog i{display:block;height:100%;width:4%;background:var(--amber);border-radius:999px;transition:width .6s}
.wait .sub{color:var(--muted);margin:0}

footer{color:var(--muted);font-size:14px;text-align:center;padding:30px 20px calc(50px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#forgetBtn{min-height:44px;padding:0 10px}

@media (max-width:640px){
  .hero{flex-direction:column;align-items:flex-start;gap:20px;padding-top:20px}
  .hero .pearl{--s:120px}
  .report .verdict{flex-direction:column;align-items:flex-start}
  .bar{width:70px}
}
@media (prefers-reduced-motion:reduce){.pearl.rolls,.wait .pearl{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><a class="home" href="/" data-t="home"></a><select id="lang" aria-label="Language"></select></header>

<main class="wrap">
  <!-- 1. upload -->
  <section id="start">
    <div class="hero"><div class="pearl rolls" aria-hidden="true"></div><div><h1 data-t="title"></h1><p data-t="lead"></p></div></div>
    <label class="drop" id="drop">
      <b data-t="drop"></b><p data-t="dropSub"></p>
      <span class="pick" data-t="choose"></span>
      <input type="file" id="file" accept=".txt,.zip,text/plain,application/zip,application/x-zip-compressed" class="sr">
    </label>
    <p class="private" data-t="private"></p>
    <details class="how"><summary data-t="howIphone"></summary><ol data-list="stepsIphone"></ol></details>
    <details class="how"><summary data-t="howAndroid"></summary><ol data-list="stepsAndroid"></ol></details>
    <p class="msg" id="readMsg" role="status" aria-live="polite"></p>
  </section>

  <!-- 2. what the browser found on its own -->
  <section id="local" class="hide">
    <div class="sec"><h2 id="chatTitle" tabindex="-1"></h2><p class="sub" data-t="localSub"></p><div class="facts" id="facts"></div></div>
    <div class="sec"><h2 data-t="whoTalks"></h2><div class="who" id="people"></div></div>
    <div class="sec"><h2 data-t="when"></h2><div class="clock" id="clock" aria-hidden="true"></div><div class="clock-l"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div><p class="sub" id="clockLine" style="margin-top:12px"></p></div>
    <div class="ask" id="ask">
      <h3 data-t="askTitle"></h3><p data-t="askSub"></p>
      <div id="loginBox" class="hide">
        <div class="fld"><label for="em" data-t="email"></label><input id="em" type="email" autocomplete="email"></div>
        <div class="fld" style="margin-top:10px"><label for="pw" data-t="password"></label><input id="pw" type="password" autocomplete="current-password"></div>
        <p style="margin-top:10px"><a href="/he/" data-t="noAcc" style="display:inline-block;padding:10px 0"></a></p>
      </div>
      <p class="msg" id="askMsg" role="status" aria-live="polite"></p>
      <button class="go" id="goBtn" type="button"></button>
      <button type="button" id="forgetBtn" data-t="forget" style="color:var(--muted);font-size:15px;text-decoration:underline;text-underline-offset:4px;align-self:center"></button>
    </div>
  </section>

  <!-- 3. waiting -->
  <section id="wait" class="wait hide"><div class="pearl" aria-hidden="true"></div><p id="waitLine" aria-hidden="true"></p><div class="prog" id="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="progLine"><i id="progBar"></i></div><p id="progLine" class="sub" role="status"></p><p id="keepLine" class="sub" style="max-width:420px"></p></section>

  <!-- 4. the report -->
  <section id="report" class="report hide"></section>
</main>
<footer data-t="foot"></footer>

const LANGS={he:'עברית',en:'English',ar:'العربية',ru:'Русский',es:'Español',fr:'Français'},RTL={he:1,ar:1};
let L=(()=>{const q=new URLSearchParams(location.search).get('lang');let s;try{s=localStorage.getItem('barusik.lang')}catch{}return T[q]?q:T[s]?s:'he'})();
const t=(k,v)=>{let s=T[L][k]??T.en[k]??k;if(typeof s==='string'&&v)for(const x in v)s=s.replaceAll('{'+x+'}',v[x]);return s};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue=n=>{let h=0;for(const c of String(n??''))h=(h*31+c.codePointAt(0))%360;return h};
const initial=n=>[...String(n??'').replace(/[^\p{L}\p{N}]/gu,'')][0]||'?';
const A=v=>Array.isArray(v)?v:[];

const SB_URL='https://iktmyrfbejtjsiehcrar.supabase.co',SB_KEY='sb_publishable_vEUqQPQSE0EG7YRnwNeAbg_PzViDO1a';
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'complichess-auth'}}):null;
let USER=null,EXCERPT=null,STATS=null,REPORT=null;

function paint(){
  document.documentElement.lang=L;document.documentElement.dir=RTL[L]?'rtl':'ltr';
  document.querySelector('.pearl.rolls')?.style.setProperty('--dir',RTL[L]?-1:1);
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('[data-list]').forEach(e=>e.innerHTML=t(e.dataset.list).map(x=>`<li>${esc(x)}</li>`).join(''));
  $('#lang').innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}"${k===L?' selected':''}>${v}</option>`).join('');
  document.title=t('title');document.querySelector('meta[name=description]')?.setAttribute('content',t('lead'));
  const na=document.querySelector('#loginBox a');if(na)na.href='/'+L+'/';
  if(STATS)renderLocal();if(REPORT)renderReport(REPORT);goBtn();
}
$('#forgetBtn').onclick=()=>{forgetLocal();STATS=null;EXCERPT=null;REPORT=null;$('#local').classList.add('hide');$('#start').classList.remove('hide');$('#file').value='';scrollTo(0,0)};
$('#lang').onchange=e=>{L=e.target.value;try{localStorage.setItem('barusik.lang',L)}catch{}
  try{const u=new URL(location.href);if(u.searchParams.has('lang')){u.searchParams.set('lang',L);history.replaceState(null,'',u)}}catch{}paint()};

/* ---------- reading the file ---------- */
const drop=$('#drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)openChat(f)});
$('#file').onchange=e=>{const f=e.target.files[0];if(f)openChat(f)};
let READING=false;
async function openChat(f){
  const msg=$('#readMsg');if(READING)return;msg.textContent='';
  const mb=Math.round(f.size/1048576*100)/100;
  if(mb>5120){$('#file').value='';return msg.textContent=t('tooBig')}
  READING=true;drop.classList.add('busy');drop.setAttribute('aria-busy','true');msg.textContent=t('reading');
  try{
    const r=await PeninaChat.open(f);
    if(!r||!r.n)throw new Error('bad');if(r.n<50||!r.stats){msg.textContent=t('tooSmall');return}
    EXCERPT=r.excerpt;STATS=r.stats;STATS.sizeMb=mb;if(window.PNames)PNames.fix();REPORT=null;saveLocal();$('#report').classList.add('hide');
    msg.textContent='';$('#start').classList.add('hide');$('#local').classList.remove('hide');renderLocal();goBtn();scrollTo(0,0);$('#chatTitle').focus({preventScroll:true});
  }catch(e){const s=String(e&&e.message);msg.textContent=s==='nodeflate'?t('zipOld'):(e&&e.name==='RangeError'||/memory|allocation|too large|array buffer/i.test(s))?t('memBig'):t('badFile')}
  finally{READING=false;drop.classList.remove('busy');drop.removeAttribute('aria-busy');$('#file').value=''}
}

/* ---------- local stats ---------- */
function renderLocal(){
  const s=STATS,ppl=s.people;
  $('#chatTitle').textContent=ppl.slice(0,3).map(p=>p.name).join(', ')+(ppl.length>3?` \u2066+${ppl.length-3}\u2069`:'');
  const f=[[s.total.toLocaleString(),t('msgs')],[s.spanDays.toLocaleString(),t('days')],[s.activeDays.toLocaleString(),t('active')],[s.bestStreakDays,t('streakDays')],[ppl.length,t('people')]];
  $('#facts').innerHTML=f.map(([v,l])=>`<div><b class="n">${esc(v)}</b>${esc(l)}</div>`).join('');
  const max=ppl[0]?.msgs||1;
  $('#people').innerHTML=ppl.slice(0,12).map(p=>{
    const bits=[t('starts',{n:p.starts})];if(p.medianReplyMin!=null)bits.push(t('reply',{m:p.medianReplyMin}));if(p.media)bits.push(t('media',{n:p.media}));if(p.sorry)bits.push(t('sorry',{n:p.sorry}));if(p.nightPct>=8)bits.push(t('night',{p:p.nightPct}));
    return `<div class="person"><span class="dot" style="background:hsl(${hue(p.name)} 70% 72%)">${esc(initial(p.name))}</span><span class="nm">${esc(p.name)} <span class="n" style="color:var(--muted);font-weight:400">· ${p.share}%</span></span><span class="bar" aria-hidden="true"><i style="width:${(p.msgs/max*100).toFixed(0)}%"></i></span><span class="meta">${bits.map(esc).join(' · ')} ${esc(A(p.topEmojis).slice(0,3).join(''))}</span></div>`}).join('');
  const hm=Math.max(...s.hours,1);
  $('#clock').innerHTML=s.hours.map((v,i)=>`<i class="${i===s.busiestHour?'top':''}" style="height:${(v/hm*100).toFixed(0)}%"></i>`).join('');
  $('#clockLine').textContent=t('peak',{h:String(s.busiestHour).padStart(2,'0')});
}

const NOT_READY=e=>/does not exist|schema cache|not find the function|relation .* does not exist|404/i.test(String(e?.message||e||''));
let ADMIN=false,REQ=null,BACKEND=true,pollReq=null,PAY=null;
// A report costs money when Bar switched payments on (in demo mode only he sees it). Free otherwise: the request waits for his approval.
const payProduct=()=>{if(!PAY||PAY.mode==='off'||(PAY.mode==='demo'&&!ADMIN))return null;return(PAY.products||[]).find(p=>p.id==='penina_report')||null};
const payPrice=()=>{const p=payProduct();if(!p)return null;const v=Number(p.price)+Number(p.price_per_mb||0)*Math.ceil(Number(STATS&&STATS.sizeMb||0));return v>0?(Number.isInteger(v)?v:v.toFixed(2)):null};
const KEY='penina.chat';
const saveLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify({stats:STATS,excerpt:EXCERPT,report:REPORT,at:Date.now()}))}catch{}};
const forgetLocal=()=>{try{localStorage.removeItem(KEY);localStorage.removeItem('penina.job')}catch{}};

async function loadReq(){
  REQ=null;if(!sb||!USER)return;
  try{ADMIN=(await sb.rpc('is_admin')).data===true}catch{ADMIN=false}
  try{PAY=(await sb.rpc('pay_public')).data||null}catch{PAY=null}
  const r=await sb.from('pn_requests').select('id,status,created_at,decided_at').eq('uid',USER.id).order('created_at',{ascending:false}).limit(5);
  if(r.error){BACKEND=!NOT_READY(r.error);return}
  BACKEND=true;const rows=r.data||[];
  REQ=rows.find(x=>x.status==='approved')||rows.find(x=>x.status==='pending')||rows[0]||null;
}
function goBtn(){
  const b=$('#goBtn'),m=$('#askMsg');$('#loginBox').classList.toggle('hide',!!USER);b.classList.remove('hide');
  clearInterval(pollReq);
  if(!USER){b.textContent=t('login');return}
  if(!BACKEND){b.classList.add('hide');m.textContent=t('soon');return}
  if(getJob()){b.textContent=t('resume');m.textContent=t('resumeMsg');return}
  if(REQ?.status==='approved'){b.textContent=t('getReport');m.textContent=t('approved');return}
  const price=payPrice();
  if(price!==null){const bank=PAY&&PAY.mode==='manual';b.textContent=t(bank?'payBtnM':'payBtn',{p:price});m.textContent=t('payMsg');const s=document.querySelector('[data-t=askSub]');if(s)s.textContent=t(bank?'paySubM':'paySub');return}
  if(REQ?.status==='pending'){b.textContent=t('check');m.textContent=t('pending');pollReq=setInterval(async()=>{if(document.hidden)return;await loadReq();if(REQ?.status!=='pending')goBtn()},20000);return}
  b.textContent=t('request');if(REQ?.status==='declined')m.textContent=t('declined');
}
async function refreshAsk(){await loadReq();$('#askMsg').textContent='';goBtn()}

// one tap at a time: a double tap must not open two requests
let GOING=false;
$('#goBtn').onclick=async()=>{
  if(GOING)return;GOING=true;const b=$('#goBtn');b.disabled=true;
  try{await go()}catch{$('#askMsg').textContent=navigator.onLine===false?t('offline'):t('busy')}
  finally{GOING=false;b.disabled=false}
};
['#em','#pw'].forEach(s=>$(s).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#goBtn').click()}}));
async function go(){
  const m=$('#askMsg');m.textContent='';
  if(!sb)return m.textContent=t('busy');
  if(!USER){const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||!pw){m.textContent=t('badLogin');$(em?'#pw':'#em').focus();return}
    const r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error){const s=String(r.error.message||'');m.textContent=/confirm/i.test(s)?t('unconfirmed'):(r.error.status===400||/invalid|credentials/i.test(s))?t('badLogin'):navigator.onLine===false||!r.error.status?t('offline'):t('busy');return}
    USER=r.data.user;await refreshAsk();if(REQ?.status==='approved'||REQ?.status==='pending')return;}
  if(getJob())return runJob(getJob());
  if(REQ?.status!=='approved'&&payPrice()!==null){
    let id=REQ?.status==='pending'?REQ.id:null;
    if(!id){const r=await sb.rpc('pn_request',{p_msgs:STATS.total,p_people:STATS.people.length,p_lang:L,p_mb:STATS.sizeMb||0});
      if(r.error){m.textContent=NOT_READY(r.error)?t('soon'):/too many/.test(r.error.message)?t('tooMany'):t('busy');return}id=r.data&&r.data.id}
    saveLocal();location.href=`/pay/?p=penina_report&ref=${id}&lang=${L}&back=${encodeURIComponent('/penina/')}`;return;
  }
  if(REQ?.status==='pending'){await refreshAsk();if(REQ?.status==='pending')m.textContent=t('pending');return}
  if(REQ?.status!=='approved'){
    const r=await sb.rpc('pn_request',{p_msgs:STATS.total,p_people:STATS.people.length,p_lang:L,p_mb:STATS.sizeMb||0});
    if(r.error){m.textContent=NOT_READY(r.error)?t('soon'):/too many/.test(r.error.message)?t('tooMany'):t('busy');return}
    saveLocal();await refreshAsk();return;
  }
  let answers=[],photos=[];
  if(window.PQ){try{const q=await PQ.run();answers=q.answers||[];photos=q.photos||[]}catch{answers=[];photos=[]}}
  runJob({answers,photos});
}

/* ---------- writing the report in parts: each part is saved on the server, so a sleeping phone just carries on ---------- */
const JOB='penina.job';
function getJob(){try{const j=JSON.parse(localStorage.getItem(JOB)||'null');return j&&STATS&&EXCERPT&&!REPORT&&Date.now()-j.at<6*36e5?j:null}catch{return null}}
const setJob=j=>{try{j?localStorage.setItem(JOB,JSON.stringify(j)):localStorage.removeItem(JOB)}catch{if(j){try{localStorage.setItem(JOB,JSON.stringify({...j,photos:[]}))}catch{}}}};
async function callFn(body){
  const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('sign in');
  const r=await fetch(`${SB_URL}/functions/v1/penina`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`,apikey:SB_KEY},body:JSON.stringify(body)});
  let j={};try{j=JSON.parse((await r.text()).trim()||'{}')}catch{}
  if(!r.ok||j.error){const e=new Error(j.error||('http '+r.status));e.status=r.status;throw e}
  return j;
}
const visible=()=>document.hidden?new Promise(res=>{const f=()=>{if(!document.hidden){document.removeEventListener('visibilitychange',f);res()}};document.addEventListener('visibilitychange',f)}):Promise.resolve();
let RUNNING=false,LOCK=null;
const keepAwake=async()=>{try{LOCK=await navigator.wakeLock?.request('screen')}catch{}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&RUNNING)keepAwake()});
async function runJob(job){
  if(RUNNING)return;RUNNING=true;const m=$('#askMsg');m.textContent='';
  $('#start').classList.add('hide');$('#local').classList.add('hide');$('#report').classList.add('hide');$('#wait').classList.remove('hide');scrollTo(0,0);
  let i=0;const lines=t('w');$('#waitLine').textContent=lines[0];const tick=setInterval(()=>$('#waitLine').textContent=lines[++i%lines.length],2600);
  $('#keepLine').textContent=t('keepOpen');keepAwake();
  const show=(n,tot)=>{const pc=Math.min(100,Math.round(n/tot*100));$('#progBar').style.width=Math.max(4,pc)+'%';$('#prog').setAttribute('aria-valuenow',pc);$('#progLine').textContent=t('prog',{n,t:tot})};
  const base={lang:L,stats:STATS,excerpt:EXCERPT,answers:job.answers||[],photoNames:(job.photos||[]).map(p=>p.name)};
  try{
    let st;
    for(let k=0;;k++){try{st=await callFn({...base,mode:'start',id:job.id});break}catch(e){if(e.status===403||e.status===401||k>=3)throw e;await visible();await new Promise(r=>setTimeout(r,3000))}}
    job={...job,id:st.id,at:Date.now()};setJob(job);
    let n=st.done.length,tot=Math.max(st.parts.length,22);show(n,tot);
    const one=async p=>{for(let k=0;k<4;k++){try{await callFn({...base,mode:'part',id:job.id,part:p});n++;show(n,tot);return}catch(e){if(e.status===404||e.status===400)throw e;await visible();await new Promise(r=>setTimeout(r,2000+k*3000))}}};
    // first Opus reads the chat once and decides who writes what, one call after the other so the second reads the first one's cache
    if(st.ready===false){
      for(const p of st.parts)if(!st.done.includes(p))await one(p);
      st=await callFn({...base,mode:'status',id:job.id});
      if(st.ready===false)throw new Error('plan');
    }
    // then the writer: every part on its own, with only the lines it needs
    const todo=st.parts.filter(p=>!st.done.includes(p));tot=st.parts.length;n=tot-todo.length;show(n,tot);
    if(todo.includes('warm'))await one('warm').catch(()=>{});
    const rest=todo.filter(p=>p!=='warm');let q=0;
    await Promise.all(Array.from({length:Math.min(5,rest.length)},async()=>{while(q<rest.length){const p=rest[q++];await one(p).catch(()=>{})}}));
    let fin;
    for(let k=0;;k++){try{fin=await callFn({...base,mode:'finish',id:job.id,photos:job.photos||[]});break}catch(e){if(e.status===409||k>=2)throw e;await visible();await new Promise(r=>setTimeout(r,3000))}}
    REPORT=fin.report;setJob(null);saveLocal();$('#wait').classList.add('hide');renderReport(REPORT);refreshAsk();
    const h=$('#report h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}
  }catch(e){
    const msg=String(e.message);
    if(e.status===404&&msg==='gone')setJob(null);
    $('#wait').classList.add('hide');$('#local').classList.remove('hide');await refreshAsk();
    m.textContent=msg==='not approved'?t('notApproved'):NOT_READY(e)?t('soon'):(getJob()?t('partFail'):t('busy'))+(ADMIN?` (${msg.slice(0,60)})`:'');$('#ask').scrollIntoView();
  }finally{clearInterval(tick);RUNNING=false;try{LOCK?.release()}catch{};LOCK=null}
}

/* ---------- the report ---------- */
function renderReport(r){
  const el=$('#report');el.classList.remove('hide');
  el.innerHTML=`
  <div class="verdict"><div class="pearl rolls" style="--dir:${RTL[L]?-1:1}" role="img" aria-label="${esc(t('score'))} ${Number(r.score)||0}/10"><span class="score n">${Number(r.score)||0}<small>/10</small></span></div>
    <div><h1>${esc(r.headline)}</h1>${r.score_line?`<p class="sline">${esc(r.score_line)}</p>`:''}</div></div>
  <p class="lead">${esc(r.verdict)}</p>
  <div class="sec"><h2>${esc(t('people2'))}</h2>${A(r.people).map(p=>`
    <article class="card"><div class="top"><span class="dot" style="background:hsl(${hue(p.name)} 70% 72%)">${esc(initial(p.name))}</span><div><h3>${esc(p.name)}</h3><span class="role">${esc(p.role)}</span></div></div>
      <p>${esc(p.roast)}</p><p class="kind">${esc(p.kind)}</p>
      <div class="flags"><span class="g">${esc(t('green'))}: ${esc(p.green)}</span><span class="r">${esc(t('red'))}: ${esc(p.red)}</span></div></article>`).join('')}</div>
  ${A(r.dynamics).length?`<div class="sec"><h2>${esc(t('dyn'))}</h2><ul class="dyn">${A(r.dynamics).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
  ${A(r.moments).length?`<div class="sec"><h2>${esc(t('moments'))}</h2>${A(r.moments).map(x=>`<blockquote><q>${esc(x&&x.quote)}</q><cite>${esc(x&&x.who)} · ${esc(x&&x.note)}</cite></blockquote>`).join('')}</div>`:''}
  <div class="sec"><h2>${esc(t('advice'))}</h2><p class="advice">${esc(r.advice)}</p></div>
  <div class="actions"><button class="go" id="shareBtn" type="button" style="padding:0 26px">${esc(t('share'))}</button><button class="btn2" id="againBtn" type="button">${esc(t('again'))}</button></div>`;
  $('#shareBtn').onclick=share;$('#againBtn').onclick=()=>{REPORT=null;STATS=null;EXCERPT=null;forgetLocal();el.classList.add('hide');$('#start').classList.remove('hide');$('#file').value='';scrollTo(0,0)};
  scrollTo(0,0);
}

/* a story-sized picture of the verdict, drawn here so nothing leaves the phone */
async function share(){
  const r=REPORT,W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  await document.fonts.ready;const rtl=!!RTL[L];x.direction=rtl?'rtl':'ltr';
  x.fillStyle='#24122E';x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(400,520,20,540,600,260);g.addColorStop(0,'#FFFFFF');g.addColorStop(.25,'#FBF4FA');g.addColorStop(.7,'#E7D6E8');g.addColorStop(1,'#B9A0C2');
  x.fillStyle=g;x.beginPath();x.arc(540,600,250,0,7);x.fill();
  x.textAlign='center';if(r.v<2&&r.score!=null){x.fillStyle='#2A0A17';x.font='120px "Secular One"';x.fillText(`${r.score}/10`,540,640);}
  const wrap=(txt,y,size,color,maxW=900,font='"Secular One"')=>{x.font=`${size}px ${font}`;x.fillStyle=color;const words=String(txt).split(' ');let line='',lines=[];for(const w of words){const tr=line?line+' '+w:w;if(x.measureText(tr).width>maxW){lines.push(line);line=w}else line=tr}lines.push(line);lines.forEach((l,i)=>x.fillText(l,540,y+i*size*1.2));return y+lines.length*size*1.2};
  let y=wrap(r.headline??'',1000,76,'#F7EFF5');y+=30;
  for(const p of A(r.people).slice(0,4)){if(y>1700)break;y=wrap(`${p.name??''}${p.role?' · '+p.role:''}`,y+30,46,'#FFC46B',900,'Assistant');}
  x.font='40px Assistant';x.fillStyle='#A891B3';x.fillText('barusik.com/penina',540,1840);
  const blob=await new Promise(res=>c.toBlob(res,'image/png'));const file=new File([blob],'penina.png',{type:'image/png'});
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:t('title')});return}catch{}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='penina.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

try{const sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv&&sv.stats&&sv.excerpt&&Date.now()-sv.at<14*864e5){STATS=sv.stats;EXCERPT=sv.excerpt;REPORT=sv.report||null;$('#start').classList.add('hide');if(REPORT){renderReport(REPORT)}else $('#local').classList.remove('hide')}}catch{}
const SHARED_VIEW=()=>/[?&](r|a)=/.test(location.search);
if(SHARED_VIEW()){const m=document.createElement('meta');m.name='robots';m.content='noindex';document.head.appendChild(m)}
paint();
if(window.PShare)PShare.boot();
if(sb)sb.auth.onAuthStateChange((_e,s)=>{USER=s?.user||null;refreshAsk()});
// a report that was half written when the page closed carries on by itself
if(sb&&getJob())sb.auth.getSession().then(({data})=>{if(data.session&&getJob()&&!SHARED_VIEW()){USER=data.session.user;runJob(getJob())}});
