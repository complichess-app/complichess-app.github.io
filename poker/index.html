<style>
/* The card room. Felt the colour of a bottle of ink, brass where your hand goes, ivory cards.
   Everything that isn't the table stays quiet so the table can be loud. */
:root{
  --room:#0E1A17; --room-2:#15241F; --panel:#182A24; --line:rgba(236,228,206,.12);
  --felt:#0F4A3A; --felt-2:#0B3A2D; --rail:#3A2716; --brass:#D9A441; --brass-2:#F1C66B;
  --ivory:#F6F0E2; --ink:#14110C; --mute:#9DB0A7; --red:#C8313A; --hot:#FF6B4A; --ok:#5FD39A;
  --fd:"Unbounded","Rubik",system-ui,sans-serif; --fb:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --card-w:clamp(34px,8.6vw,58px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#17302A 0%,var(--room) 60%);color:var(--ivory);font:16px/1.5 var(--fb);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--brass-2)}
:focus-visible{outline:3px solid var(--brass-2);outline-offset:2px;border-radius:10px}
.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.mute{color:var(--mute)}
.small{font-size:13.5px}

header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));max-width:1280px;margin:0 auto}
header.top .brand{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;color:var(--ivory);text-decoration:none}
header.top .brand i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brass);color:var(--ink);font-style:normal;font-size:17px}
header.top .sp{flex:1}
header.top select{background:var(--panel);border:1px solid var(--line);border-radius:999px;height:40px;padding:0 10px}
header.top .acct{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);min-width:0}
header.top .acct b{color:var(--ivory);font-weight:600;max-width:28vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;background:var(--brass);color:var(--ink);font-weight:700;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ivory);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.04)}
.btn.small{min-height:36px;padding:0 14px;font-size:14px}
.btn.red{background:var(--red);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- home ---------- */
.home{max-width:1080px;margin:0 auto;padding:12px 16px 60px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding:26px 0 30px}
.hero h1{font-family:var(--fd);font-weight:800;font-size:clamp(34px,6vw,64px);line-height:1;margin:0 0 14px;letter-spacing:-.03em}
.hero h1 em{font-style:normal;color:var(--brass-2)}
.hero p{margin:0;font-size:18px;color:#D8DDD2;max-width:40ch}
.fan{position:relative;height:220px}
.fan .fc{display:block;position:absolute;left:50%;top:14px;transform-origin:50% 130%;animation:rise .6s cubic-bezier(.2,.9,.3,1) both}
.fan .card{--card-w:104px;box-shadow:0 20px 40px -12px rgba(0,0,0,.7)}
@keyframes rise{from{opacity:0;translate:0 30px}to{opacity:1;translate:0 0}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.box h2{margin:0;font-size:20px;font-weight:700}
.box p{margin:0;color:var(--mute);font-size:15px}
.box label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--mute)}
.box input,.box select,dialog input,dialog select{background:var(--room);border:1px solid var(--line);border-radius:12px;height:44px;padding:0 12px;color:var(--ivory);font-size:16px;width:100%}
.box .row{display:flex;gap:10px}.box .row>*{flex:1}
.check{flex-direction:row!important;align-items:center;gap:10px!important;color:var(--ivory)!important;font-size:15px!important}
.check input{width:20px!important;height:20px!important;accent-color:var(--brass)}
.box .btn{margin-top:auto}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--mute);padding:12px 14px;border-radius:14px;background:rgba(217,164,65,.07);border:1px solid rgba(217,164,65,.2);margin-top:18px}
.ranks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 16px;margin-top:10px}
.ranks div{display:flex;align-items:center;gap:10px;font-size:14.5px}
.ranks .mini{display:flex;gap:3px;direction:ltr}
.ranks .card{--card-w:30px}
.err{color:#FF9C8A;font-size:14px;min-height:1.2em}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{background:#fff;color:#1f1f1f}

/* ---------- cards ---------- */
.card{--w:var(--card-w);display:inline-block;vertical-align:top;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.12);background:var(--ivory);color:var(--ink);position:relative;flex:none;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 6px 14px -6px rgba(0,0,0,.6);font-family:var(--fd);font-weight:700;user-select:none}
.card .r{position:absolute;top:calc(var(--w)*.06);left:calc(var(--w)*.09);font-size:calc(var(--w)*.36);line-height:.95;letter-spacing:-.05em;display:flex;flex-direction:column;align-items:center}
.card .r i{font-style:normal;font-family:var(--fb);font-size:calc(var(--w)*.3);line-height:1}
.card .s{position:absolute;bottom:calc(var(--w)*.05);right:calc(var(--w)*.08);font-size:calc(var(--w)*.52);line-height:1;font-family:var(--fb)}
.card.red{color:var(--red)}
.card.back{background:repeating-linear-gradient(45deg,#7A1F28 0 4px,#8E2832 4px 8px);box-shadow:inset 0 0 0 calc(var(--w)*.06) var(--ivory),0 6px 14px -6px rgba(0,0,0,.6)}
.card.back:after{content:"B";position:absolute;inset:0;display:grid;place-items:center;color:rgba(246,240,226,.85);font-size:calc(var(--w)*.5)}
.card.ghost{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
.card.dim{filter:brightness(.55) saturate(.6)}
.card.hl{box-shadow:0 0 0 3px var(--brass-2),0 8px 18px -6px rgba(0,0,0,.7);transform:translateY(-4px)}
.card.in{animation:deal .38s cubic-bezier(.2,.9,.3,1) both}
@keyframes deal{from{opacity:0;transform:translateY(-30px) rotate(-12deg) scale(.8)}to{opacity:1;transform:none}}
.card.flip{animation:flip .45s ease both}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}

/* ---------- the table ---------- */
.roomwrap{display:grid;grid-template-columns:1fr 340px;gap:14px;max-width:1380px;margin:0 auto;padding:0 14px 14px;height:calc(100svh - 64px)}
.stage{position:relative;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 2px 8px;font-size:14px}
.bar h1{font-size:18px;margin:0;font-weight:700;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.06);color:var(--mute)}
.pill.b{background:rgba(217,164,65,.16);color:var(--brass-2)}
.pill.g{background:rgba(95,211,154,.14);color:var(--ok)}
.watch{font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:6px}
.feltwrap{position:relative;flex:1;display:flex;min-height:0}
.felt{position:relative;flex:1;min-height:340px;margin:8px 2% 0}
#fx{position:absolute;inset:8px 2% 0;pointer-events:none;z-index:30}
.oval{position:absolute;inset:7% 9%;border-radius:999px;background:radial-gradient(ellipse at 50% 40%,#16614C 0%,var(--felt) 45%,var(--felt-2) 100%);
  box-shadow:0 0 0 14px var(--rail),0 0 0 16px #5A3D22,0 30px 80px -10px rgba(0,0,0,.8),inset 0 0 60px rgba(0,0,0,.45)}
.oval:before{content:"";position:absolute;inset:6%;border-radius:999px;border:1.5px solid rgba(241,198,107,.16)}
.mark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--fd);font-weight:800;color:rgba(241,198,107,.07);font-size:clamp(26px,5vw,54px);letter-spacing:.1em}
.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:2}
.board{display:flex;gap:6px;direction:ltr}
.potv{font-weight:700;font-size:15px;background:rgba(0,0,0,.35);padding:4px 14px;border-radius:999px;display:flex;gap:8px;align-items:center}
.msg{font-size:14px;color:#E8E2CF;background:rgba(0,0,0,.35);padding:6px 14px;border-radius:999px;text-align:center;max-width:70vw}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:clamp(86px,17vw,140px);z-index:3}
.seat .hole{display:flex;gap:3px;height:calc(var(--card-w)*1.4*.75);margin-bottom:-14px;direction:ltr}
.seat .hole .card{--card-w:calc(var(--cw,58px)*.78)}
.seat.me .hole .card{--card-w:var(--cw,58px)}
.seat.me .hole{height:calc(var(--cw,58px)*1.15)}
.plate{position:relative;width:100%;background:#0B1512;border:1.5px solid rgba(255,255,255,.1);border-radius:14px;padding:6px 8px 5px;text-align:center;box-shadow:0 10px 20px -8px rgba(0,0,0,.7)}
.plate .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .ch{font-size:14px;font-weight:700;color:var(--brass-2)}
.seat.turn .plate{border-color:var(--brass-2);box-shadow:0 0 0 3px rgba(241,198,107,.25),0 10px 20px -8px rgba(0,0,0,.7)}
.seat.folded{opacity:.5}
.seat.win .plate{border-color:var(--ok);box-shadow:0 0 0 3px rgba(95,211,154,.3)}
.seat .tag{position:absolute;top:-10px;inset-inline-end:-6px;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 6px;background:var(--hot);color:#2A0A00}
.seat .hand{font-size:11.5px;color:var(--ok);font-weight:600}
.timer{position:absolute;inset-inline:6px;bottom:2px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.timer i{display:block;height:100%;background:var(--brass-2);transform-origin:0 50%}
[dir=rtl] .timer i{transform-origin:100% 50%}
.timer i.go{animation:shrink linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.empty{width:clamp(70px,13vw,104px);height:46px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.18);display:grid;place-items:center;font-size:12.5px;color:var(--mute)}
button.empty:hover{border-color:var(--brass);color:var(--brass-2)}
.chipst{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;z-index:2;transition:left .45s ease,top .45s ease,opacity .45s}
.chip{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,var(--hot) 23% 60%,#fff 61% 67%,var(--hot) 68%);box-shadow:0 2px 0 #8a2a17}
.chip.b{background:radial-gradient(circle,#fff 0 22%,#3B6CFF 23% 60%,#fff 61% 67%,#3B6CFF 68%);box-shadow:0 2px 0 #1b3594}
.hole.four{gap:1px}.seat .hole.four .card{--card-w:calc(var(--cw,58px)*.5)}.seat.me .hole.four .card{--card-w:calc(var(--cw,58px)*.72)}
.tom{position:absolute;top:-12px;inset-inline-start:-8px;width:30px;height:30px;border-radius:50%;background:#2A1A12;box-shadow:0 0 0 1.5px rgba(255,120,90,.5);font-size:16px;line-height:30px;text-align:center;opacity:.85;transition:transform .15s,opacity .15s;z-index:2}
.tom:hover,.tom:focus-visible{opacity:1;transform:scale(1.15) rotate(-12deg)}
.flyt{position:absolute;transform:translate(-50%,-50%);font-size:34px;z-index:30;pointer-events:none;transition:left .6s cubic-bezier(.3,.1,.5,1),top .6s cubic-bezier(.2,-.6,.6,1)}
.flyt.go{animation:spin .6s linear}
@keyframes spin{to{rotate:540deg}}
.splat{position:absolute;transform:translate(-50%,-50%);width:120px;height:90px;z-index:29;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,#E0342B 0 26%,transparent 27%),radial-gradient(circle at 22% 38%,#E0342B 0 9%,transparent 10%),radial-gradient(circle at 80% 30%,#C92A22 0 8%,transparent 9%),radial-gradient(circle at 70% 78%,#E0342B 0 10%,transparent 11%),radial-gradient(circle at 30% 80%,#C92A22 0 7%,transparent 8%),radial-gradient(circle at 92% 60%,#E0342B 0 5%,transparent 6%),radial-gradient(circle at 50% 52%,#7BC043 0 4%,transparent 5%);
  animation:splat 2.6s ease-out forwards}
@keyframes splat{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}12%{transform:translate(-50%,-50%) scale(1.15)}20%{transform:translate(-50%,-50%) scale(1)}75%{opacity:.95}100%{opacity:0;transform:translate(-50%,-30%) scale(1)}}
.dbtn{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:#fff;color:#111;font:800 12px var(--fd);display:grid;place-items:center;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.5);transition:left .5s,top .5s}

/* actions: PokerNow's bar. Big English buttons, always the same order, sizing panel behind RAISE */
.actions{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 4px max(10px,env(safe-area-inset-bottom));min-height:64px;position:relative}
.actions .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;width:100%}
.actions .lt{direction:ltr}
.turnlbl{font:800 12px/1 var(--fd);letter-spacing:.12em;color:var(--ink);background:var(--brass-2);border-radius:999px;padding:5px 12px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(241,198,107,.18)}}
.act{flex:1;max-width:220px;min-width:96px;min-height:56px;border-radius:14px;font:800 16px/1.1 var(--fb);letter-spacing:.04em;padding:0 14px;text-transform:uppercase;transition:transform .1s,filter .15s}
.act:active{transform:scale(.97)}.act:hover{filter:brightness(1.1)}
.act.f{background:#5A1F1F;color:#FFE1DA;box-shadow:inset 0 0 0 1.5px rgba(255,140,120,.45)}
.act.f.sure{background:#C8313A;color:#fff}
.act.c{background:#1E7A55;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18)}
.act.r{background:var(--brass);color:var(--ink)}
.act.b{background:rgba(255,255,255,.1);color:var(--ivory);max-width:120px}
.act.p{min-height:44px;font-size:14px;background:rgba(255,255,255,.07);color:var(--ivory);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.act.p.on{background:var(--ivory);color:var(--ink);box-shadow:none}
.act[disabled]{opacity:.5}
.raisep{display:flex;flex-direction:column;gap:8px;width:min(560px,100%)}
.raisep .presets button{flex:1;min-height:40px;border-radius:10px;background:rgba(255,255,255,.1);color:var(--ivory);font:700 13px var(--fb);letter-spacing:.03em;white-space:nowrap;padding:0 6px}
.raisep .presets button:hover{background:rgba(255,255,255,.18)}
.raisep .slide{flex-wrap:nowrap}
.raisep input[type=range]{flex:1;min-width:0;accent-color:var(--brass);height:30px}
.raisep input[type=number]{width:96px;height:44px;border-radius:10px;border:1.5px solid rgba(255,255,255,.25);background:#0B1512;color:#fff;padding:0 6px;text-align:center;font-weight:700;font-size:17px}
.stepb{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.1);font-size:22px;font-weight:700;flex:none}
.keys{font-size:12px;color:var(--mute);direction:ltr}
.potv{direction:ltr}.potv small{font-size:12px;font-weight:600;color:#D8DDD2;margin-inline-start:4px}

/* side */
.side{background:var(--panel);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{padding:7px 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--mute);position:relative}
.tabs button[aria-selected=true]{background:var(--ivory);color:var(--ink)}
.tabs .dot{position:absolute;top:2px;inset-inline-end:2px;width:8px;height:8px;border-radius:50%;background:var(--hot)}
.pane{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.pane .li{line-height:1.45}.pane .li small{color:var(--mute)}
.pane .hd{margin-top:8px;font-weight:700;color:var(--brass-2);font-size:12.5px;letter-spacing:.04em}
.pane .req{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;background:rgba(255,255,255,.04)}
.pane .req .row{display:flex;gap:6px;align-items:center}
.pane .req input{width:100px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--room);padding:0 8px}
.pane label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.pane label input:not([type=checkbox]){width:120px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--room);padding:0 8px}
.pane .pl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.pane .pl b{flex:1}
.chatbox{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.chatbox input{flex:1;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--room);padding:0 12px}
.ledger td{padding:4px 6px}.ledger{border-collapse:collapse;width:100%;font-size:13.5px}.ledger th{text-align:start;color:var(--mute);font-weight:600;padding:4px 6px}
.pos{color:var(--ok)}.neg{color:#FF9C8A}
.sidebtn{display:none}

dialog{border:1px solid var(--line);border-radius:22px;background:var(--panel);color:var(--ivory);padding:22px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 12px;font-size:20px}
dialog form{display:flex;flex-direction:column;gap:10px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.toast{position:fixed;inset-inline:0;bottom:max(90px,env(safe-area-inset-bottom));margin:auto;width:max-content;max-width:90vw;background:#0B1512;border:1px solid var(--line);color:var(--ivory);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;z-index:50;animation:pop .2s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.banner{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:rgba(217,164,65,.12);border:1px solid rgba(217,164,65,.3);color:var(--brass-2);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:600;margin:2px 0 6px}

@media (max-width:980px){
  .roomwrap{grid-template-columns:1fr;height:auto;min-height:calc(100svh - 64px)}
  .stage{min-height:calc(100svh - 70px)}
  .side{position:fixed;inset:auto 0 0 0;height:70svh;border-radius:22px 22px 0 0;z-index:40;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
  .side.open{transform:none;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
  .sidebtn{display:inline-flex}
  .hero{grid-template-columns:1fr}.fan{height:170px}.fan .card{--card-w:80px}
  .grid3{grid-template-columns:1fr}
}
@media (max-width:640px){
  .oval{inset:5% 12% 4%}
  .felt{min-height:min(118vw,560px)}
  .seat{width:clamp(76px,24vw,110px)}
  .plate .nm{font-size:12px}.plate .ch{font-size:13px}
  .seat .hole.four .card{--card-w:calc(var(--cw,58px)*.4)}
  .act{min-width:0;flex:1;min-height:50px}
  .bar h1{max-width:38vw;font-size:16px}
  header.top .acct span,header.top .acct b{display:none}
  header.top .brand span{font-size:15px}
  .bar .btn.small{min-height:34px;padding:0 11px;font-size:13px}
  .watch .co{display:none}
  .actions{position:sticky;bottom:0;z-index:20;background:linear-gradient(rgba(14,26,23,0),var(--room) 18%);padding-top:14px}
  .act{max-width:none;min-height:54px;font-size:15px;padding:0 8px}
  .raisep .presets{flex-wrap:nowrap;gap:5px}.raisep .presets button{font-size:11.5px;padding:0 3px}
  body.in-room header.top{padding-top:max(6px,env(safe-area-inset-top));padding-bottom:4px}
  body.in-room .roomwrap{height:calc(100svh - 52px);min-height:0}
  body.in-room .stage{min-height:0;height:100%}
  body.in-room .felt{min-height:0}
  body.in-room .bar{gap:6px;padding:2px 0 4px}
  body.in-room .bar .watch{display:none}
}

/* ---------- the seats, v2: a character behind every plate, her basket beside her ---------- */
.seats{position:absolute;inset:0;z-index:3;pointer-events:none}
.seats>*{pointer-events:auto}
.seat{position:absolute;transform:translate(-50%,-62%);display:flex;flex-direction:column;align-items:center;width:var(--sw);--sw:clamp(92px,15vw,150px);--avw:clamp(62px,8.4vw,104px);z-index:3;transition:left .5s ease,top .5s ease}
.seat.empty-seat{transform:translate(-50%,-50%)}
.seat .who{position:relative;display:flex;flex-direction:column;align-items:center;width:100%}
.seat .av{position:relative;width:var(--avw);aspect-ratio:100/110;margin-bottom:-12px;z-index:1;cursor:default;border-radius:46% 46% 18% 18%;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.08),rgba(0,0,0,0) 70%)}
.seat .av.clickable{cursor:pointer}
.seat .avs{position:absolute;inset:0;z-index:1;transition:transform .25s}
.seat .avs svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.av-shut{display:none}
.seat.hit .av-open{display:none}.seat.hit .av-shut{display:inline}
.seat.hit .avs{animation:flinch .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes flinch{0%{transform:none}15%{transform:translate(-5px,-2px) rotate(-7deg) scale(.96)}35%{transform:translate(4px,1px) rotate(5deg)}55%{transform:translate(-3px,0) rotate(-3deg)}75%{transform:translate(2px,0) rotate(1deg)}100%{transform:none}}
.seat.folded .avs{filter:grayscale(.75) brightness(.7)}
.seat.turn .av:after{content:"";position:absolute;inset:-6px;border-radius:50% 50% 20% 20%;box-shadow:0 0 0 3px rgba(241,198,107,.75),0 0 24px rgba(241,198,107,.5);pointer-events:none;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(241,198,107,.35),0 0 10px rgba(241,198,107,.2)}}
.seat .hole{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);display:flex;gap:2px;direction:ltr;z-index:2;--cw:calc(var(--avw)*.36)}
.seat .hole .card{--card-w:var(--cw);box-shadow:0 6px 12px -4px rgba(0,0,0,.7)}
.seat .hole .card:nth-child(1){transform:rotate(-7deg) translateY(2px)}.seat .hole .card:nth-child(2){transform:rotate(6deg)}
.seat .hole.four{gap:0}.seat .hole.four .card{--card-w:calc(var(--avw)*.27)}
.seat .hole.four .card:nth-child(1){transform:rotate(-12deg) translateY(4px)}.seat .hole.four .card:nth-child(2){transform:rotate(-4deg)}.seat .hole.four .card:nth-child(3){transform:rotate(4deg)}.seat .hole.four .card:nth-child(4){transform:rotate(12deg) translateY(4px)}
.seat.me{--avw:clamp(72px,9.6vw,118px)}
.seat.me .hole{left:auto;right:auto;bottom:auto;top:16%;transform:none;inset-inline-end:calc(50% + var(--avw)*.44);--cw:calc(var(--avw)*.6)}
.seat.me .hole.four .card{--card-w:calc(var(--avw)*.44)}

.seat .hole .card.in{animation:deal .4s cubic-bezier(.2,.9,.3,1) both}.seat .hole .card.d1{animation-delay:.08s}.seat .hole .card.d2{animation-delay:.16s}.seat .hole .card.d3{animation-delay:.24s}
.seat .hole .card.hl{transform:translateY(-6px)}
.seat .plate{position:relative;z-index:3;width:100%;padding:5px 8px 6px}

.seat.winner .plate{border-color:var(--ok);box-shadow:0 0 0 3px rgba(95,211,154,.3)}
.seat.turn .plate{border-color:var(--brass-2)}
.seat .tag{position:absolute;top:-9px;inset-inline-end:-6px;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 6px;background:var(--hot);color:#2A0A00}
.seat .tag.grey{background:#555;color:#eee}
.seat .hand{font-size:11.5px;color:var(--ok);font-weight:700;min-height:0;direction:ltr;white-space:nowrap}
.seat.me .hand{font-size:12.5px;color:#8DF5C0;position:absolute;top:50%;inset-inline-end:calc(100% + 6px);transform:translateY(-50%);background:rgba(0,0,0,.6);padding:2px 9px;border-radius:999px;letter-spacing:.02em}
.seat .hand:empty{display:none}
.seat .timer{position:absolute;inset-inline:6px;bottom:2px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.seat .timer i{display:block;height:100%;background:var(--brass-2);transform-origin:0 50%;transform:scaleX(0)}
[dir=rtl] .seat .timer i{transform-origin:100% 50%}
.seat .timer i.go{animation:shrink linear forwards}
.seat .bask{position:absolute;top:calc(var(--avw)*.42);inset-inline-start:calc(100% - 6px);display:flex;flex-direction:column;align-items:center;gap:1px;z-index:3}
.seat.right .bask{inset-inline-start:auto;inset-inline-end:calc(100% - 6px)}
[dir=rtl] .seat .bask{inset-inline-start:auto;inset-inline-end:calc(100% - 6px)}
[dir=rtl] .seat.right .bask{inset-inline-end:auto;inset-inline-start:calc(100% - 6px)}
.seat .bkb{width:calc(var(--avw)*.62);touch-action:none;cursor:default;padding:0}
.seat.mine .bkb{cursor:grab}
.seat .bkb svg{width:100%;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.seat .bkn{min-width:26px;height:22px;border-radius:999px;background:#1C0E08;color:#FFB59E;font:700 12px/22px var(--fb);padding:0 7px;box-shadow:inset 0 0 0 1px rgba(255,120,90,.35);cursor:default}
.seat.mine .bkn{cursor:pointer;background:var(--brass);color:var(--ink);box-shadow:none}
.seat.mine .bkn:not([disabled]):hover{filter:brightness(1.08)}
.seat .bkn[disabled]{opacity:1}
.seat .bkb[disabled]{opacity:1}
.seat .sit{width:clamp(70px,12vw,100px);height:46px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.22);display:grid;place-items:center;font-size:12.5px;color:var(--mute)}
.seat .sit:hover{border-color:var(--brass);color:var(--brass-2)}
.seat .emptyl{width:clamp(70px,12vw,100px);height:46px;border-radius:14px;border:1.5px dashed rgba(255,255,255,.2);display:grid;place-items:center;font-size:12px;color:var(--mute)}
.felt.aiming .seat:not(.mine):not(.empty-seat) .av{cursor:crosshair}
.felt.aiming .seat:not(.mine):not(.empty-seat) .av:before{content:"";position:absolute;inset:8% 16% 30%;border-radius:50%;border:2px dashed #FF6A4D;z-index:4;animation:aim 1s linear infinite}
@keyframes aim{to{transform:rotate(360deg)}}
.felt.aiming .seat.mine .bkb{animation:wob .5s ease-in-out infinite alternate}
@keyframes wob{to{transform:rotate(-6deg) scale(1.06)}}
.chipst.win{color:var(--ok)}
.flyt{position:absolute;left:0;top:0;width:clamp(26px,3.2vw,38px);height:clamp(26px,3.2vw,38px);pointer-events:none;z-index:40;will-change:transform}
.flyt svg,.tm-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
.flyt.drag{position:fixed;transform:translate(-50%,-50%);z-index:60}
.splat2{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:41;animation:splat2 3.4s ease-out forwards}
.splat2 svg{width:100%;display:block}
.splat2 .sp-drip{animation:drip 3s ease-in forwards}
@keyframes splat2{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}10%{transform:translate(-50%,-50%) scale(1.18)}18%{transform:translate(-50%,-50%) scale(.96)}26%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes drip{from{transform:translateY(-6px)}to{transform:translateY(10px)}}
dialog.looks{width:min(560px,94vw)}
.board.b2{margin-top:-4px}.board.b2 .card{--card-w:clamp(26px,6vw,44px)}
.ph{position:absolute;left:12%;right:12%;top:6%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#0B1512;box-shadow:0 0 0 3px var(--brass),0 10px 18px -6px rgba(0,0,0,.6);display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.ph.cam{font-size:30px;box-shadow:0 0 0 2px dashed rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
.look .avs,.lookrow .avs{position:relative}
.look.photo{cursor:pointer}
.seat.photo .hole{bottom:-4%}
.lookgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.look{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px;border-radius:16px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1.5px transparent}
.look.on,.look:hover{box-shadow:inset 0 0 0 2px var(--brass)}
.look .avs,.lookrow .avs{width:100%;max-width:96px;aspect-ratio:100/110;display:block}
.look .avs svg,.lookrow .avs svg{width:100%;height:100%;display:block}
.look b{font-size:13px}
.lookrow{display:flex;align-items:center;gap:12px}.lookrow .avs{width:72px}
@media (max-width:640px){
  .seat{--sw:clamp(70px,22vw,96px);--avw:clamp(48px,13.5vw,60px)}
  .seat.me{--avw:clamp(58px,16vw,74px)}
  .seat:not(.me) .hole{bottom:10%;--cw:calc(var(--avw)*.4)}
  .seat .plate{padding:3px 5px 4px}
  .lookgrid{grid-template-columns:repeat(4,1fr);gap:6px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
