<style>
/* Layout: social super-app. Desktop = nav column (start) · feed · rail (end). Phone = top bar + feed + bottom tab bar. RTL for he/ar, LTR for the rest. */
:root{color-scheme:only light;
  --canvas:#F1F1F7;        /* page ground, faint violet bias */
  --surface:#FFFFFF;       /* cards, bars */
  --surface-2:#F6F6FB;     /* inputs, hovers (inset) */
  --surface-3:#ECECF5;     /* pressed, chips */
  --ink:#16152B;           /* primary text */
  --ink-2:#4C4B68;         /* secondary text */
  --muted:#6B6A87;         /* meta (AA on white and canvas) */
  --line:rgba(22,21,43,.09);
  --line-2:rgba(22,21,43,.16);
  --brand:#3B34E8;         /* Platformika blue-violet: actions, links, active nav */
  --brand-ink:#FFFFFF;
  --brand-soft:rgba(59,52,232,.10);
  --gold:#E9A800;          /* creator money: the 99% */
  --gold-soft:rgba(233,168,0,.14);
  --gold-ink:#7A5600;
  --like:#D42A44;
  --online:#14A673;
  --chat-me:#DDDBFF;       /* my bubble */
  --chat-wall:#EBEAF4;
  --scrim:rgba(14,13,30,.55);
  --shadow:0 0 0 1px rgba(22,21,43,.05),0 1px 2px rgba(22,21,43,.05),0 4px 14px rgba(22,21,43,.05);
  --shadow-pop:0 0 0 1px rgba(22,21,43,.06),0 12px 40px rgba(22,21,43,.18);

  --font-display:"Fredoka","IBM Plex Sans Hebrew","Arial Hebrew",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Hebrew","Arial Hebrew","Segoe UI",system-ui,sans-serif;

  --r-s:10px; --r-m:16px; --r-l:22px;
  --nav-w:248px; --rail-w:320px; --feed-w:620px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#0D0D19; --surface:#161629; --surface-2:#1D1D34; --surface-3:#26263F;
  --ink:#EDEDF9; --ink-2:#B7B6D3; --muted:#9897B8;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --brand:#7C77FF; --brand-ink:#0D0D19; --brand-soft:rgba(124,119,255,.16);
  --gold:#FFC93C; --gold-soft:rgba(255,201,60,.14); --gold-ink:#FFD978;
  --like:#FF5A72; --online:#33D196; --chat-me:#2F2B6E; --chat-wall:#111122;
  --scrim:rgba(0,0,0,.65);
  --shadow:0 0 0 1px rgba(255,255,255,.06);
  --shadow-pop:0 0 0 1px rgba(255,255,255,.09),0 16px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --canvas:#0D0D19; --surface:#161629; --surface-2:#1D1D34; --surface-3:#26263F;
  --ink:#EDEDF9; --ink-2:#B7B6D3; --muted:#9897B8;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --brand:#7C77FF; --brand-ink:#0D0D19; --brand-soft:rgba(124,119,255,.16);
  --gold:#FFC93C; --gold-soft:rgba(255,201,60,.14); --gold-ink:#FFD978;
  --like:#FF5A72; --online:#33D196; --chat-me:#2F2B6E; --chat-wall:#111122;
  --scrim:rgba(0,0,0,.65);
  --shadow:0 0 0 1px rgba(255,255,255,.06);
  --shadow-pop:0 0 0 1px rgba(255,255,255,.09),0 16px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
[dir="ltr"] svg.flip,[dir="rtl"] .send svg,[dir="rtl"] .send-c svg{transform:scaleX(-1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));inset-inline-start:8px;z-index:70;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:12px;font-weight:600;text-decoration:none;transform:translateY(-200%)}
.skip:focus{transform:none}
main:focus{outline:0}
h1,h2,h3{text-wrap:balance;margin:0}
p{text-wrap:pretty;margin:0}

/* ---------- shell ---------- */
.app{min-height:100%;display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr) var(--rail-w);gap:28px;max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.nav{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;max-height:100dvh;display:flex;flex-direction:column;gap:4px;padding-block:22px}
.logo{display:flex;align-items:center;gap:10px;padding:6px 12px 22px;font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.mark{width:34px;height:34px;flex:none}
.nav a.item{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:16px;position:relative;transition:background .15s}
.nav a.item:hover{background:var(--surface-3);color:var(--ink)}
.nav a.item[aria-current="page"]{color:var(--ink);font-weight:700;background:var(--surface)}
.nav a.item[aria-current="page"] svg{stroke:var(--brand)}
.nav .badge{margin-inline-start:auto}
.nav .spacer{flex:1}
.nav .me-chip{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;text-decoration:none;color:var(--ink)}
.nav .me-chip:hover{background:var(--surface-3)}
.nav .me-chip .meta{min-width:0;line-height:1.2}
.nav .me-chip b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .me-chip small{display:block;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;transition:transform .1s,background .15s,opacity .15s;white-space:nowrap;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{opacity:.92}
.btn.ghost{background:var(--surface-3);color:var(--ink)}
.btn.ghost:hover{background:var(--line-2)}
.btn.danger{background:#DC2626;color:#fff}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn.sm svg.i{width:18px;height:18px}
.btn[disabled]{opacity:.45;pointer-events:none}
.nav .btn.primary{margin-top:14px;height:50px;font-size:16px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#D42A44;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.linkish{color:var(--muted);text-decoration:underline;text-underline-offset:2px;font-size:13px}
.linkish:hover{color:var(--ink)}
.langsel select{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-size:13px;cursor:pointer}

main{min-width:0;padding-block:22px 40px;display:flex;flex-direction:column;gap:16px;max-width:var(--feed-w);width:100%;justify-self:center}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;max-height:100dvh;overflow-y:auto;padding-block:22px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}

/* top bar + tab bar (phone) */
.topbar,.tabbar{display:none}

/* signed out: only the logo and the page */
body.out .nav,body.out .rail,body.out .tabbar,body.out .topbar .iconbtn{display:none}
body.out .app{display:block}
body.out main{margin:0 auto;max-width:460px;padding-top:min(12vh,96px)}
.landing{padding:32px 24px 28px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.landing .mark{width:56px;height:56px}
.landing h1{font-family:var(--font-display);font-weight:700;font-size:32px}
.landing .lead{color:var(--ink-2);font-size:16px;max-width:32ch}
.landing .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.landing .small{color:var(--muted);font-size:13.5px;max-width:36ch;margin-top:4px}
.links{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center}
.loading{color:var(--muted);text-align:center;padding:48px 0}

.card{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow)}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.page-h h1{font-family:var(--font-display);font-weight:600;font-size:28px;letter-spacing:-.01em}

/* avatar */
.av{--s:44px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:calc(var(--s)*.42);color:#fff;background:hsl(var(--h,246) 62% 46%);overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av.s32{--s:32px}.av.s36{--s:36px}.av.s56{--s:56px}.av.s96{--s:96px}.av.s120{--s:120px}
.av.icon{background:var(--brand-soft);color:var(--brand)}
.av.icon svg.i{width:20px;height:20px}

/* ---------- stories ---------- */
.stories{display:flex;gap:14px;overflow-x:auto;padding:16px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;flex:none;font-size:12.5px;color:var(--ink-2)}
.story .ring{width:70px;height:70px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,var(--brand),#9C5BFF,var(--gold),var(--brand));display:grid;place-items:center}
.story .ring.seen{background:var(--line-2)}
.story .ring>.inner{width:100%;height:100%;border-radius:50%;border:3px solid var(--surface);overflow:hidden;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;text-align:center;line-height:1.15;padding:6px}
.story .ring.add{background:none;border:2px dashed var(--line-2)}
.story .ring.add>.inner{border:0;background:var(--surface-2);color:var(--brand)}
.story span{max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- composer ---------- */
.composer{padding:16px;display:flex;flex-direction:column;gap:12px}
.composer .row{display:flex;gap:12px;align-items:center}
.composer .fake{flex:1;min-width:0;text-align:start;height:46px;padding:0 18px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer .fake:hover{background:var(--surface-3)}
.composer .acts{display:flex;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.composer .acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:12px;color:var(--ink-2);font-weight:500;font-size:14px}
.composer .acts button:hover{background:var(--surface-2)}

/* ---------- post ---------- */
.post{overflow:hidden;position:relative}
.post-h{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.post-h .who{min-width:0;flex:1;line-height:1.25}
.post-h .who b{display:block;font-weight:600}
.post-h .who small{color:var(--muted);font-size:13px}
.post-h a{text-decoration:none;color:inherit}.post-h a:hover b{text-decoration:underline}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.post-text{padding:0 16px 12px;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.post-text.big{font-family:var(--font-display);font-size:24px;font-weight:500;line-height:1.3}
.post-img{display:block;width:100%;max-height:640px;object-fit:cover;background:var(--surface-2)}
.post-stats{display:flex;gap:16px;padding:10px 16px 0;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.post-stats span{display:inline-flex;align-items:center;gap:5px}
.post-stats svg.i{width:16px;height:16px}
.post-stats .h svg{fill:var(--like);stroke:var(--like)}
.post-acts{display:flex;gap:2px;padding:6px 8px 8px}
.post-acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:42px;border-radius:12px;color:var(--ink-2);font-weight:500;font-size:14px;min-width:0}
.post-acts button:hover{background:var(--surface-2)}
.post-acts button.on{color:var(--like)}
.post-acts button.on svg{fill:var(--like);stroke:var(--like)}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.comments{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cmt .bub{background:var(--surface-2);border-radius:16px;padding:8px 12px;min-width:0}
.cmt .bub b{font-size:13.5px;display:block}
.cmt .bub p{overflow-wrap:anywhere;white-space:pre-wrap}
.cmt-in{display:flex;gap:10px;align-items:center}
.cmt-in input{flex:1;min-width:0;height:40px;border-radius:999px;border:0;outline:0;background:var(--surface-2);padding:0 16px}
.cmt-in input:focus{box-shadow:0 0 0 2px var(--brand-soft)}

/* menu */
.menu{position:absolute;inset-inline-end:12px;top:52px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-pop);padding:6px;z-index:5;min-width:200px;color:var(--ink)}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;text-align:start}
.menu button:hover{background:var(--surface-2)}
.menu svg.i{width:18px;height:18px}
.menu .danger{color:var(--like)}
.clip .menu{inset-inline:6px;min-width:0;font-size:14px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 3px var(--brand)}100%{box-shadow:var(--shadow)}}
.promo{display:inline-flex;align-items:center;gap:4px;margin-inline-start:6px;padding:1px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink);font-size:12px;font-weight:600;vertical-align:1px}
.boost{display:flex;align-items:center;gap:10px;margin:0 12px 10px;padding:8px;padding-inline-start:12px;border-radius:14px;background:var(--gold-soft);color:var(--gold-ink);font-size:13.5px;text-decoration:none}
.boost span{flex:1;min-width:0}
.boost b{flex:none;background:var(--gold);color:#241900;padding:6px 12px;border-radius:999px;font-size:13.5px;white-space:nowrap}
.boost:hover b{opacity:.9}

/* ---------- empty state ---------- */
.empty{padding:36px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.empty .art{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);margin-bottom:6px}
.empty .art svg{width:26px;height:26px}
.empty h2{font-family:var(--font-display);font-weight:600;font-size:20px}
.empty p{color:var(--ink-2);max-width:40ch}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}

/* ---------- rail ---------- */
.wallet{padding:18px;display:flex;flex-direction:column;gap:12px}
.wallet .lbl{color:var(--ink-2);font-size:13.5px;font-weight:500}
.split{display:flex;align-items:center;gap:12px}
.split .bar{flex:1;height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden;display:flex}
.split .bar i{display:block;height:100%}
.split .bar i.c{width:99%;background:var(--gold)}
.split .bar i.o{width:1%;background:var(--muted)}
.legend{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink-2)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.sec-h h3{font-size:15px;font-weight:600}
.sec-h a{font-size:13.5px;color:var(--brand);font-weight:500;text-decoration:none}
.invite{padding:18px;display:flex;flex-direction:column;gap:12px}
.invite h3{font-size:15px;font-weight:600}
.invite p{color:var(--ink-2);font-size:14px}
.linkbox{display:flex;align-items:center;gap:8px;padding:6px;padding-inline-start:12px;border-radius:12px;background:var(--surface-2);min-width:0}
.linkbox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--ink-2);direction:ltr;text-align:left;user-select:all}
.foot{font-size:12.5px;color:var(--muted);padding:4px 6px;line-height:1.7;display:flex;flex-direction:column;gap:10px}
.foot .links{justify-content:flex-start}

/* chat list */
.clist{display:flex;flex-direction:column;padding:6px}
.citem{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;text-decoration:none;color:var(--ink);text-align:start;width:100%}
.citem:hover{background:var(--surface-2)}
.citem .meta{flex:1;min-width:0}
.citem .meta b{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.citem .meta b small{color:var(--muted);font-weight:400;font-size:12.5px;font-variant-numeric:tabular-nums;flex:none}
.citem .meta b span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .meta>span{display:block;color:var(--ink-2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .meta>span.wrap{white-space:normal;color:var(--ink)}
.citem .meta small.when{display:block;color:var(--muted);font-size:12.5px}
.av.saved{background:var(--brand)}
.av.saved svg{width:22px;height:22px}

/* ---------- chat view ---------- */
.chat{display:flex;flex-direction:column;height:calc(100dvh - 62px);min-height:420px;overflow:hidden}
.chat-h{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.chat-h .who{flex:1;min-width:0;line-height:1.25}
.chat-h .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-h .who small{color:var(--muted);font-size:13px}
.chat-h a{color:inherit;text-decoration:none}
.chat-body{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:6px;background-color:var(--chat-wall);background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:18px 18px}
.msg{max-width:78%;padding:8px 12px 6px;border-radius:16px;background:var(--surface);box-shadow:0 1px 1px rgba(0,0,0,.04);align-self:flex-start;display:flex;flex-direction:column}
.msg.me{background:var(--chat-me);align-self:flex-end;border-end-end-radius:6px}
.msg p{white-space:pre-wrap;overflow-wrap:anywhere}
.msg small{align-self:flex-end;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;margin-top:2px}
.day{align-self:center;background:var(--surface);color:var(--ink-2);font-size:12.5px;padding:4px 12px;border-radius:999px;margin:8px 0;box-shadow:var(--shadow)}
.chat-in{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.chat-in textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:var(--surface-2);border-radius:22px;padding:11px 16px;max-height:120px;line-height:1.4}
.send{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}

/* ---------- clips ---------- */
.clips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.clip{aspect-ratio:9/16;max-width:100%;border-radius:16px;overflow:hidden;background:#000;position:relative}
.clip video{width:100%;height:100%;object-fit:cover;display:block}
.clip .cap{position:absolute;inset-inline:0;bottom:0;padding:28px 10px 10px;padding-inline-end:52px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:13px;overflow-wrap:anywhere}
.clip .cap a{color:#fff;font-weight:700;text-decoration:none}
.clip .ov{position:absolute;background:rgba(0,0,0,.45);color:#fff}
.clip .ov:hover{background:rgba(0,0,0,.6);color:#fff}
.clip .ov.snd{top:8px;inset-inline-end:8px}
.clip .ov.opt{top:8px;inset-inline-start:8px}
.clip .ov.lk{bottom:8px;inset-inline-end:8px}
.clip .ov.lk.on{color:#FF5A72}
.clip .ov.lk.on svg{fill:currentColor}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--brand-soft);color:var(--ink-2);font-size:14px}
.note svg{color:var(--brand);width:20px;height:20px;margin-top:1px}

/* ---------- profile ---------- */
.cover{height:170px;background:linear-gradient(120deg,var(--brand),#8E54FF 55%,var(--gold));border-radius:var(--r-l) var(--r-l) 0 0;position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.prof{padding:0 20px 20px;display:flex;flex-direction:column;gap:12px}
.prof .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:-52px}
.prof .head .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:6px;min-width:0}
.prof .av.s120{border:5px solid var(--surface)}
.prof h1{font-family:var(--font-display);font-weight:600;font-size:28px;overflow-wrap:anywhere}
.prof .handle{color:var(--muted)}
.prof .bio{color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.counts{display:flex;gap:22px;font-size:14.5px;color:var(--ink-2)}
.counts b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums;margin-inline-end:6px}
.prof .links{justify-content:flex-start;padding-top:4px}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{flex:1;padding:14px 8px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:3px}
.cell{text-decoration:none;aspect-ratio:1;max-width:100%;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;padding:10px;font-size:13px;color:var(--ink-2);text-align:center;border-radius:4px;overflow-wrap:anywhere}
.cell img,.cell video{width:100%;height:100%;object-fit:cover}
.cell.has-img{padding:0}

/* ---------- creators ---------- */
.hero-split{padding:24px;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.donut{width:150px;height:150px;position:relative}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.donut .c b{font-family:var(--font-display);font-size:40px;font-weight:600;color:var(--gold-ink)}
.donut .c small{display:block;font-size:13px;color:var(--ink-2);margin-top:4px}
.hero-split h2{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.2;margin-bottom:8px}
.hero-split p{color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{padding:16px;display:flex;flex-direction:column;gap:4px}
.stat small{color:var(--ink-2);font-size:13px}
.stat b{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.plain{padding:18px;display:flex;flex-direction:column;gap:6px}
.plain h3{font-size:15px;font-weight:600}
.plain p{color:var(--ink-2);font-size:14.5px}

/* ---------- sheets / modals ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:grid;place-items:center;padding:20px;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);border-radius:24px;box-shadow:var(--shadow-pop);width:100%;max-width:540px;max-height:calc(100dvh - 40px);overflow:auto;animation:rise .28s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(16px) scale(.98);opacity:0}}
.scrim.still,.scrim.still .sheet{animation:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:18px;font-weight:600;flex:1;text-align:center}
.sheet-h .pad{width:40px;flex:none}
.sheet-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet-b>p{color:var(--ink-2)}
.sheet textarea.big{width:100%;min-height:140px;border:0;outline:0;resize:vertical;background:none;font-size:20px;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.field input,.field textarea{height:48px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 14px;outline:0;min-width:0}
.field textarea{height:auto;min-height:90px;padding:12px 14px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.hint{color:var(--muted);font-size:13px}
.err{color:var(--like);font-size:13.5px}
.prev{position:relative;border-radius:16px;overflow:hidden}
.prev img{display:block;width:100%;max-height:340px;object-fit:cover}
.prev .iconbtn{position:absolute;top:8px;inset-inline-end:8px;background:rgba(0,0,0,.55);color:#fff}
.tools{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.tools .grow{flex:1}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.story-prev{aspect-ratio:9/14;max-width:100%;max-height:52dvh;margin:0 auto;border-radius:18px;display:grid;place-items:center;padding:24px;color:#fff;font-family:var(--font-display);font-size:26px;font-weight:600;text-align:center;line-height:1.3;width:100%;overflow-wrap:anywhere}
.who-row{display:flex;gap:12px;align-items:center}
.who-row small{display:block;color:var(--muted);font-size:13px}

.onb{max-width:460px}
.onb .hero{padding:26px 24px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.onb .hero .mark{width:52px;height:52px}
.onb .hero h1{font-family:var(--font-display);font-weight:700;font-size:28px}
.onb .hero p{color:var(--ink-2)}
.onb .who{text-align:center;color:var(--muted);font-size:13.5px;border-top:1px solid var(--line);padding-top:14px}

/* story viewer */
.viewer{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center}
.viewer .frame{position:relative;width:min(100%,calc(100dvh*9/16));height:100%;max-height:100dvh;display:grid;place-items:center;padding:60px 28px;color:#fff;font-family:var(--font-display);font-size:30px;font-weight:600;text-align:center;line-height:1.3;overflow-wrap:anywhere}
.viewer .bars{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:12px;display:flex;gap:4px}
.viewer .bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.viewer .bars i b{display:block;height:100%;width:0;background:#fff}
.viewer .vh{position:absolute;top:calc(24px + env(safe-area-inset-top,0px));inset-inline:12px;display:flex;align-items:center;gap:10px;font-family:var(--font-body);font-size:14px;font-weight:600;z-index:2}
.viewer .vh small{opacity:.75;font-weight:400}
.viewer .vh .x{margin-inline-start:auto;color:#fff}
.viewer .vh .x:hover{background:rgba(255,255,255,.15)}
.viewer .tapzone{position:absolute;top:80px;bottom:0;width:40%}
.viewer .tapzone.next{inset-inline-end:0}
.viewer .tapzone.prev{inset-inline-start:0}

.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--canvas);padding:12px 18px;border-radius:14px;font-weight:500;z-index:60;box-shadow:var(--shadow-pop);text-align:center;animation:rise .25s ease-out}

/* ---------- responsive ---------- */
@media (min-width:1181px){.search.desk{display:none}}
@media (max-width:1180px){
  .app{grid-template-columns:84px minmax(0,1fr)}
  .rail{display:none}
  .nav .logo span,.nav a.item span,.nav .me-chip .meta,.nav .btn.primary span{display:none}
  .nav .logo{justify-content:center;padding-inline:0}
  .nav a.item{justify-content:center;padding:12px}
  .nav .badge{position:absolute;top:4px;inset-inline-end:8px;margin:0}
  .nav .btn.primary{width:52px;padding:0;align-self:center}
  .nav .me-chip{justify-content:center}
}
@media (max-width:720px){

  .topbar .logo{padding:0;font-size:23px;flex:1;min-width:0}
  .topbar .mark{width:30px;height:30px}
  .topbar .iconbtn{position:relative;background:var(--surface);box-shadow:var(--shadow);width:44px;height:44px}
  .topbar .badge{position:absolute;top:-3px;inset-inline-end:-3px;min-width:18px;height:18px;font-size:11px}
  main{padding:4px max(12px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:12px}
  body.out main{padding-top:24px}
  .tabbar{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:20;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border-top:1px solid var(--line)}
  .tabbar a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);text-decoration:none;font-size:11px;font-weight:500;position:relative}
  .tabbar a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar a[aria-current="page"]{color:var(--ink)}
  .tabbar a[aria-current="page"] svg{stroke:var(--brand)}
  .tabbar .plus{width:48px;height:36px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin-top:2px}
  .page-h h1{font-size:24px}
  .card,.post{border-radius:18px}
  .post-acts button{font-size:13px;gap:5px}
  .hero-split{grid-template-columns:1fr;justify-items:center;text-align:center;padding:20px}
  .stats{gap:8px}.stat{padding:12px}.stat b{font-size:21px}.stat small{font-size:12px}
  .prof{padding:0 16px 16px}
  .prof .av.s120{--s:96px;border-width:4px}
  .prof .head{margin-top:-44px}
  .prof h1{font-size:24px}
  .chat{height:calc(100dvh - 164px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px));min-height:320px}
  .scrim{place-items:end center;padding:0}
  .sheet{border-radius:24px 24px 0 0;max-height:94dvh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .clips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search.desk{display:none}
  .search.desk.show{display:flex}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  input,textarea,select{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

let L=(()=>{const q=new URLSearchParams(location.search).get('lang');let s=null;try{s=localStorage.getItem('barusik.lang')}catch(e){}return T[q]?q:T[s]?s:'he'})();
const t=(k,v)=>{let s=T[L][k]??T.he[k]??k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const tx=(k,v)=>esc(t(k,v));
const fmt=n=>new Intl.NumberFormat(LOC[L]).format(n);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
// Hebrew dual forms come back as "לפני שעתיים (2)" in Chrome; the number in brackets is noise
const rtf=()=>{const f=new Intl.RelativeTimeFormat(LOC[L],{numeric:'auto'});return{format:(n,u)=>f.format(n,u).replace(/\s*\(\d+\)$/,'')}};
const sameDay=(a,b)=>a.toDateString()===b.toDateString();
const shortDate=x=>new Date(x).toLocaleDateString(LOC[L],{day:'numeric',month:'short'});
const hm=x=>new Date(x).toLocaleTimeString(LOC[L],{hour:'2-digit',minute:'2-digit'});
function rel(x){const d=(Date.now()-ts(x))/1000;if(d<60)return t('now');if(d<3600)return rtf().format(-Math.floor(d/60),'minute');if(d<86400)return rtf().format(-Math.floor(d/3600),'hour');if(d<172800)return cap(rtf().format(-1,'day'));return shortDate(x)}
const listTime=x=>sameDay(new Date(x),new Date())?hm(x):shortDate(x);
function dayLabel(x){const d=new Date(x),n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);if(sameDay(d,n))return cap(rtf().format(0,'day'));if(sameDay(d,y))return cap(rtf().format(-1,'day'));return d.toLocaleDateString(LOC[L],{weekday:'long',day:'numeric',month:'long'})}
const langSelect=()=>`<label class="langsel"><span class="sr">${tx('language')}</span><select data-lang>${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" lang="${k}"${k===L?' selected':''}>${v}</option>`).join('')}</select></label>`;
const legalLinks=()=>`<a class="linkish" href="/${L}/privacy/">${tx('privacy')}</a><a class="linkish" href="/${L}/terms/">${tx('terms')}</a>`;
function applyShell(){
  const H=document.documentElement;H.lang=L;H.dir=RTL[L]?'rtl':'ltr';
  $$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $$('[data-ta]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.ta)));
  $('meta[name=description]')?.setAttribute('content',t('outLead')+' '+t('outShared'));
}

/* ---------- state (from the server) ---------- */
let USER=null,ME=null,READY=false,OFFLINE=!sb,AUTHKNOWN=false,RECOVERY=/type=recovery/.test(location.hash),LINKERR=false;
const PROF={};                        // id -> pk_profiles row
let POSTS=[],LIKES=[],CMTS=[],MSGS=[],BLOCKED=new Set();
let BOOST=new Map(),PAY=null;           // post id -> boosted until; PAY = {price} when the paid boost is on sale
const OPEN={};                        // post id -> comments open
const SOUND=new Set();                // clips the person turned the sound on for
const LOOKED=new Set();               // profiles already fetched on demand
try{const r=new URLSearchParams(location.search).get('ref');if(r)localStorage.setItem('platformika.ref',r)}catch(e){}
// an expired or used link from a sign-up or reset e-mail comes back as #error=...; say so instead of ignoring it
if(/error_description=/.test(location.hash)){LINKERR=true;history.replaceState(null,'',location.pathname+location.search)}

const posts=k=>POSTS.filter(p=>p.kind===k);
const likesOf=id=>LIKES.filter(l=>l.post===id);
const likedByMe=id=>!!USER&&LIKES.some(l=>l.post===id&&l.uid===USER.id);
const cmtsOf=id=>CMTS.filter(c=>c.post===id);
const who=id=>PROF[id]||{id,name:t('user'),handle:'',hue:200};
const activeStories=()=>posts('story').filter(s=>Date.now()-ts(s.created_at)<86400000).sort((a,b)=>ts(a.created_at)-ts(b.created_at));
const handle=h=>h?`<bdi dir="ltr">@${esc(h)}</bdi>`:'';

async function loadProfiles(ids){
  const need=[...new Set(ids)].filter(id=>id&&!PROF[id]);if(!need.length)return;
  const{data}=await sb.from('pk_profiles').select('*').in('id',need);(data||[]).forEach(p=>PROF[p.id]=p);
}
// a profile or chat opened from a link may belong to someone who has not shown up in the feed yet
function lookup(by,v){const k=by+':'+v;if(LOOKED.has(k))return false;LOOKED.add(k);
  sb.from('pk_profiles').select('*').eq(by,v).limit(1).then(({data})=>{(data||[]).forEach(p=>PROF[p.id]=p);render(true)},()=>render(true));return true}
async function loadAll(){
  if(!sb)return;
  const[pr,mr]=await Promise.all([
    sb.from('pk_posts').select('*').order('created_at',{ascending:false}).limit(300),
    USER?sb.from('pk_messages').select('*').or(`sender.eq.${USER.id},recipient.eq.${USER.id}`).order('created_at').limit(2000):Promise.resolve({data:[]})
  ]);
  if(pr.error){OFFLINE=true;return}
  OFFLINE=false;POSTS=pr.data||[];MSGS=mr.data||[];
  if(USER){try{const br=await sb.from('pk_blocks').select('blocked');BLOCKED=new Set(br.error?[]:(br.data||[]).map(b=>b.blocked))}catch(e){BLOCKED=new Set()}}
  if(BLOCKED.size){POSTS=POSTS.filter(p=>!BLOCKED.has(p.author));MSGS=MSGS.filter(m=>!BLOCKED.has(m.sender)&&!BLOCKED.has(m.recipient))}
  // paid boosts: active rows only (RLS hides expired ones); quiet if the table is not there yet
  try{const br=await sb.from('pk_boosts').select('post_id,until');BOOST=new Map(br.error?[]:(br.data||[]).filter(b=>ts(b.until)>Date.now()).map(b=>[b.post_id,b.until]))}catch(e){BOOST=new Map()}
  const ids=POSTS.map(p=>p.id);
  if(ids.length){
    const[lr,cr]=await Promise.all([sb.from('pk_likes').select('post,uid,created_at').in('post',ids),sb.from('pk_comments').select('*').in('post',ids).order('created_at')]);
    LIKES=lr.data||[];CMTS=cr.data||[];
  }else{LIKES=[];CMTS=[]}
  await loadProfiles(POSTS.map(p=>p.author).concat(CMTS.map(c=>c.author),LIKES.map(l=>l.uid),MSGS.map(m=>m.sender),MSGS.map(m=>m.recipient)));
}
async function loadPay(){
  PAY=null;
  try{const{data,error}=await sb.rpc('pay_public');if(error||!data)return;
    const pr=(data.products||[]).find(x=>x.id==='platformika_boost');if(!pr||!(+pr.price>0))return;
    let ok=data.mode==='manual'||data.mode==='live';
    if(!ok&&data.mode==='demo'){const a=await sb.rpc('is_admin');ok=a.data===true}
    if(ok)PAY={price:+pr.price};
  }catch(e){PAY=null}
}
let reloadT=0;
function reloadSoon(){clearTimeout(reloadT);reloadT=setTimeout(async()=>{await loadAll();render(true)},350)}
let live=null;
function goLive(){
  if(!sb||live)return;
  live=sb.channel('platformika')
    .on('postgres_changes',{event:'*',schema:'public',table:'pk_posts'},reloadSoon)
    .on('postgres_changes',{event:'*',schema:'public',table:'pk_comments'},reloadSoon)
    .on('postgres_changes',{event:'*',schema:'public',table:'pk_likes'},reloadSoon)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'pk_messages'},reloadSoon)
    .subscribe();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&READY)reloadSoon()});

function av(p,size=''){if(!p)return`<span class="av ${size}"></span>`;const src=p.avatar_url&&(p.avatar_url.startsWith('blob:')?p.avatar_url:media(p.avatar_url));return`<span class="av ${size}" style="--h:${hue(p.hue)}">${src?`<img src="${esc(src)}" alt="" decoding="async">`:esc([...(p.name||'?').trim()][0]||'?')}</span>`}
function toast(s){$('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2800)}
const selectAll=el=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)};
async function copy(text,btn){
  try{await navigator.clipboard.writeText(text);toast(t('linkCopied'));return}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;opacity:0';document.body.append(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();
  if(ok){toast(t('linkCopied'));return}
  // no clipboard at all: put the link where it can be selected by hand
  const c=btn?.closest('.linkbox')?.querySelector('code');
  if(c){selectAll(c);toast(t('copyManual'));return}
  openLayer(`${sheetHead(t('share'))}<div class="sheet-b"><div class="linkbox"><code>${esc(text)}</code></div><p class="hint">${tx('copyManual')}</p></div>`,{onMount:sh=>selectAll($('code',sh))});
}
async function share(url,btn){if(navigator.share&&matchMedia('(pointer:coarse)').matches){try{await navigator.share({url});return}catch(e){if(e&&e.name==='AbortError')return}}copy(url,btn)}
function compress(file,max=1600,q=.84){return new Promise((res,rej)=>{if(!file||!file.type.startsWith('image/'))return rej(new Error('type'));const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q)};im.onerror=rej;im.src=u})}
function pickFile(accept){return new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>r(i.files[0]||null);i.click()})}
const rid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
async function upload(blob,ext,type){
  const path=`${USER.id}/${rid()}.${ext}`;
  const{error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:type,cacheControl:'31536000',upsert:false});
  if(error)throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
function mediaPath(url){const k='/'+BUCKET+'/';const i=(url||'').indexOf(k);return i<0?null:decodeURIComponent(url.slice(i+k.length))}
const refLink=()=>SITE+'?ref='+encodeURIComponent(ME?.handle||'');
function busy(btn,on,label){if(!btn)return;if(on){btn.dataset.l=btn.innerHTML;btn.disabled=true;btn.textContent=label||t('wait')}else{btn.disabled=false;if(btn.dataset.l)btn.innerHTML=btn.dataset.l}}
function errText(e){const m=String(e?.message||e||'').toLowerCase();
  if(m.includes('invalid login'))return t('eLogin');
  if(m.includes('email not confirmed'))return t('eConfirm');
  if(m.includes('already registered')||m.includes('already been registered'))return t('eExists');
  if(m.includes('weak')||m.includes('password should'))return t('eWeak');
  if(m.includes('rate limit'))return t('eRate');
  if(m.includes('duplicate')||m.includes('unique'))return t('eTaken');
  if(m.includes('payload too large')||m.includes('exceeded the maximum'))return t('eBig');
  if(m.includes('mime')||m.includes('not supported'))return t('eType');
  if(m.includes('fetch')||m.includes('network'))return t('eNet');
  return t('eOther',{m:e?.message||t('eRetry')})}
const sheetHead=title=>`<div class="sheet-h"><button class="iconbtn" data-close aria-label="${tx('close')}">${ic('x')}</button><h2>${esc(title)}</h2><span class="pad"></span></div>`;
const emptyCard=(icon,title,body,actions='',tag='section')=>`<${tag} class="${tag==='section'?'card ':''}empty"><div class="art">${ic(icon)}</div><h2>${esc(title)}</h2>${body?`<p>${esc(body)}</p>`:''}${actions?`<div class="row">${actions}</div>`:''}</${tag}>`;

/* ---------- layers (sheets) ---------- */
let opener=null;
function openLayer(html,{onMount,cls='',lock=false}={}){const Lr=$('#layer'),swap=!!$('[data-scrim]',Lr);if(!Lr.innerHTML)opener=document.activeElement;Lr.innerHTML=`<div class="scrim ${swap?'still':''}" data-scrim ${lock?'data-lock="1"':''}><div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;const sc=$('[data-scrim]',Lr);sc.addEventListener('click',e=>{if(e.target===sc&&!sc.dataset.lock)closeLayer()});const sh=$('.sheet',Lr),h=$('h1,h2',sh);if(h){h.id='layerTitle';sh.setAttribute('aria-labelledby','layerTitle')}onMount?.(sh);const f=$('[autofocus]',Lr)||$('input,textarea,button',Lr);f?.focus()}
function closeLayer(){const had=$('#layer').innerHTML;$('#layer').innerHTML='';stopStory();if(had&&opener&&opener.isConnected)opener.focus({preventScroll:true});opener=null}
function closeMenus(){$$('.menu').forEach(m=>m.remove());$$('[data-act="post-menu"][aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'))}
addEventListener('keydown',e=>{
  const Lr=$('#layer');
  if(e.key==='Escape'){const m=$('.menu');if(m){const b=m.parentElement?.querySelector('[data-act="post-menu"]');closeMenus();b?.focus();return}
    if(Lr.innerHTML&&!$('[data-scrim][data-lock]'))closeLayer();return}
  // keep Tab inside an open sheet or the story viewer
  if(e.key==='Tab'&&Lr.innerHTML){const f=$$('a[href],button:not([disabled]),input,textarea,select,video[controls]',Lr).filter(x=>x.offsetParent!==null||x.closest('.viewer'));if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(!Lr.contains(document.activeElement)){e.preventDefault();a.focus()}else if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
  const m=$('.menu');if(m&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const bs=$$('button',m),i=bs.indexOf(document.activeElement);bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus()}
});

const MAILRE=/^\S+@\S+\.\S+$/;
function authSheet(tab='login',msg=''){
  openLayer(`${sheetHead(t(tab))}
  <div class="tabs" role="tablist"><button role="tab" aria-selected="${tab==='login'}" data-auth="login">${tx('login')}</button><button role="tab" aria-selected="${tab==='signup'}" data-auth="signup">${tx('signup')}</button></div>
  <form class="sheet-b" id="auForm" novalidate>
    ${tab==='signup'?`<div class="field"><label for="auName">${tx('uname')}</label><input id="auName" dir="ltr" autocomplete="username" maxlength="20" placeholder="yourname" autocapitalize="none" spellcheck="false"></div>`:''}
    <div class="field"><label for="auMail">${tx('mail')}</label><input id="auMail" type="email" dir="ltr" autocomplete="email" autocapitalize="none" spellcheck="false" autofocus></div>
    <div class="field"><label for="auPass">${tx('pass')}</label><input id="auPass" type="password" dir="ltr" autocomplete="${tab==='login'?'current-password':'new-password'}" minlength="6"></div>
    <span class="err" id="auErr" role="alert" ${msg?'':'hidden'}>${esc(msg)}</span>
    <button class="btn primary block" type="submit">${tx(tab==='login'?'login':'createAcc')}</button>
    ${tab==='login'?`<button type="button" class="btn ghost sm" id="auReset" style="align-self:center">${tx('forgot')}</button>`:''}
    <p class="hint" style="text-align:center">${tx('outShared')}</p>
  </form>`,{cls:'onb',onMount:sh=>{
    $$('[data-auth]',sh).forEach(b=>b.onclick=()=>{const m=$('#auMail',sh).value;authSheet(b.dataset.auth);$('#auMail').value=m});
    const err=$('#auErr',sh),say=s=>{err.hidden=!s;err.textContent=s||''};
    $('#auReset',sh)?.addEventListener('click',async e=>{const m=$('#auMail',sh).value.trim();if(!MAILRE.test(m)){say(t('mailFirst'));$('#auMail',sh).focus();return}
      const b=e.currentTarget;busy(b,true);const{error}=await sb.auth.resetPasswordForEmail(m,{redirectTo:SITE});busy(b,false);
      if(error&&!/rate limit/i.test(error.message)){say(errText(error));return}say(error?t('eRate'):'');if(!error)toast(t('resetSent'))});
    $('#auForm',sh).addEventListener('submit',async e=>{e.preventDefault();const b=$('button[type=submit]',sh);
      const mail=$('#auMail',sh).value.trim(),pass=$('#auPass',sh).value;
      if(tab==='signup'){const n=$('#auName',sh).value.trim();if(n.length<2||n.length>20){say(t('unameLen'));$('#auName',sh).focus();return}}
      if(!MAILRE.test(mail)){say(t('badMail'));$('#auMail',sh).focus();return}
      if(pass.length<6){say(t('passShort'));$('#auPass',sh).focus();return}
      say('');busy(b,true);
      try{
        if(tab==='signup'){
          const name=$('#auName',sh).value.trim();
          const{data:free}=await sb.rpc('username_available',{p_name:name});
          if(free===false){busy(b,false);say(t('unameTaken'));return}
          const{data,error}=await sb.auth.signUp({email:mail,password:pass,options:{data:{username:name},emailRedirectTo:SITE}});
          if(error)throw error;
          if(!data.session){openLayer(`${sheetHead(t('checkMail'))}<div class="sheet-b" style="text-align:center"><p>${tx('checkMailB')}<br><b dir="ltr">${esc(mail)}</b></p><p>${tx('checkMailB2')}</p><button class="btn primary block" id="auBack">${tx('toLogin')}</button></div>`,{onMount:s2=>{$('#auBack',s2).onclick=()=>{authSheet('login');$('#auMail').value=mail;$('#auPass').focus()}}});return}
        }else{
          const{error}=await sb.auth.signInWithPassword({email:mail,password:pass});if(error)throw error;
        }
      }catch(x){busy(b,false);say(errText(x))}
    });
  }});
}

async function signedIn(user){
  USER=user;

let stTimer=null;
const storySeen=(()=>{try{return JSON.parse(localStorage.getItem('platformika.seen')||'{}')}catch(e){return{}}})();
function stopStory(){cancelAnimationFrame(stTimer);stTimer=null}
function viewStories(author){
  const list=activeStories().filter(s=>s.author===author);if(!list.length)return;
  let i=Math.max(0,list.findIndex(s=>!storySeen[s.id]));const Lr=$('#layer');if(!Lr.innerHTML)opener=document.activeElement;
  const show=()=>{
    stopStory();const s=list[i];storySeen[s.id]=1;try{localStorage.setItem('platformika.seen',JSON.stringify(storySeen))}catch(e){}
    const w=who(s.author);
    Lr.innerHTML=`<div class="viewer" role="dialog" aria-modal="true" aria-label="${tx('storyOf',{n:w.name})}">
      <div class="frame" dir="auto" style="background:${bgOf(s.bg)}">${esc(s.body)}
        <div class="bars">${list.map((_,k)=>`<i><b style="width:${k<i?100:0}%"></b></i>`).join('')}</div>
        <div class="vh">${av(w,'s32')}<span>${esc(w.name)} <small>${esc(rel(s.created_at))}</small></span><button class="iconbtn x" data-close aria-label="${tx('close')}">${ic('x')}</button></div>
        <button class="tapzone prev" aria-label="${tx('prev')}"></button><button class="tapzone next" aria-label="${tx('next')}"></button>
      </div></div>`;
    const bar=$$('.bars b',Lr)[i];const t0=performance.now(),D=5000;
    const tick=now=>{const p=Math.min(1,(now-t0)/D);bar.style.width=p*100+'%';if(p<1)stTimer=requestAnimationFrame(tick);else next()};
    stTimer=requestAnimationFrame(tick);
    $('.tapzone.next',Lr).onclick=next;$('.tapzone.prev',Lr).onclick=prev;$('.x',Lr).focus();
    // the arrow that points forward depends on the reading direction
    $('.viewer',Lr).onkeydown=e=>{const fw=RTL[L]?'ArrowLeft':'ArrowRight',bw=RTL[L]?'ArrowRight':'ArrowLeft';if(e.key===fw){e.preventDefault();next()}else if(e.key===bw){e.preventDefault();prev()}};
  };
  const prev=()=>{i=Math.max(0,i-1);show()};
  const next=()=>{if(i<list.length-1){i++;show()}else{closeLayer();render()}};
  show();
}

      if(error){list.innerHTML=`<p class="err" style="text-align:center;padding:12px">${esc(errText(error))}</p>`;return}
      const rows=(data||[]).filter(u=>!BLOCKED.has(u.id));rows.forEach(u=>PROF[u.id]=u);
      list.innerHTML=rows.length?rows.map(u=>`<a class="citem" href="#chat-${u.id}" data-close>${av(u)}<span class="meta"><b>${esc(u.name)}</b><span>${handle(u.handle)}</span></span></a>`).join(''):`<p class="hint" style="text-align:center;padding:12px">${tx('nobody')}</p>`};
    q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(run,250)});run();
  }});
}
function clipNew(){
  let file=null;
  openLayer(`${sheetHead(t('newClip'))}
  <div class="sheet-b">
    <button class="btn ghost block" id="clFile">${ic('video')}${tx('pickVideo')}</button>
    <p class="hint" style="text-align:center">${tx('videoHint')}</p>
    <div id="clPrev"></div>
    <div class="field"><label for="clCap">${tx('caption')}</label><input id="clCap" dir="auto" maxlength="120" placeholder="${tx('captionPh')}"></div>
    <button class="btn primary block" id="clPost" disabled>${tx('publish')}</button>
  </div>`,{onMount:sh=>{
    $('#clFile',sh).onclick=async()=>{const f=await pickFile('video/mp4,video/quicktime,video/webm');if(!f)return;if(!f.type.startsWith('video/')){toast(t('notVideo'));return}
      if(f.size>MAX_VIDEO){toast(t('videoBig'));return}
      file=f;const u=URL.createObjectURL(f);$('#clPrev',sh).innerHTML=`<div class="clip" style="max-width:220px;margin:0 auto"><video src="${u}" muted autoplay loop playsinline></video></div>`;$('#clPost',sh).disabled=false};
    $('#clPost',sh).onclick=async()=>{const b=$('#clPost',sh);busy(b,true,t('uploading'));
      try{const ext=(file.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4';
        const type=file.type==='video/quicktime'||ext==='mov'?'video/quicktime':file.type==='video/webm'?'video/webm':'video/mp4';
        const url=await upload(file,ext,type);
        const{error}=await sb.from('pk_posts').insert({kind:'clip',body:$('#clCap',sh).value.trim(),media_url:url,media_type:'video'});if(error)throw error;
        closeLayer();await loadAll();if(location.hash.slice(1)!=='clips')location.hash='clips';render();toast(t('clipPosted'))}catch(x){busy(b,false);toast(errText(x))}};
  }});
}

/* ---------- rail ---------- */
function railHTML(){
  return`
  <label class="search" for="qr">${ic('search')}<input id="qr" type="search" aria-label="${tx('searchPh')}" placeholder="${tx('searchPh')}" value="${esc(state.q||'')}" autocomplete="off"></label>
  <section class="card wallet" aria-label="${tx('splitLbl')}">
    <div class="lbl">${tx('splitLbl')}</div>
    <div class="split" role="img" aria-label="${tx('splitAria')}"><div class="bar"><i class="c"></i><i class="o"></i></div></div>
    <div class="legend"><span><b>99%</b> ${tx('toCreators')}</span><span><b>1%</b> ${tx('toPlatform')}</span></div>
    <a class="btn ghost sm" href="#creators">${tx('toHub')}</a>
  </section>
  <section class="card"><div class="sec-h"><h3>${tx('chats')}</h3><a href="#chats">${tx('all')}</a></div>${chatListHTML(4)}</section>
  <section class="card invite"><h3>${tx('invite')}</h3><p>${tx('inviteP')}</p>${linkBox()}</section>
  <div class="foot"><div class="links">${langSelect()}${legalLinks()}</div><p>${tx('name')} · ${tx('footBy')} <a href="/${L}/">Barusik Platforms</a> · © ${new Date().getFullYear()}</p></div>`;
}
function vOut(){
  return`<section class="card landing">
    <svg class="mark"><use href="#logo"/></svg>
    <h1>${tx('name')}</h1>
    <p class="lead">${tx('outLead')}</p>
    <div class="row"><button class="btn primary" data-act="login">${tx('login')}</button><button class="btn ghost" data-act="signup">${tx('signup')}</button></div>
    <p class="small">${tx('outShared')}</p>
  </section>
  <div class="links">${langSelect()}<a class="linkish" href="/${L}/">${tx('mainSite')}</a>${legalLinks()}</div>`;
}

/* ---------- router ---------- */
const state={route:'home',q:'',ptab:'posts'};
const VIEWS={home:vHome,clips:vClips,chats:vChats,alerts:vAlerts,creators:vCreators,profile:()=>vProfile(null)};
function go(r){if(location.hash!=='#'+r)location.hash=r;else render()}
function render(soft){
  const raw=location.hash.slice(1)||'home';
  if(!sb){document.body.classList.add('out');$('#view').innerHTML=emptyCard('info',t('noNet'),t('noNetB'),`<button class="btn primary" data-act="reload">${tx('eRetry')}</button>`);return}
  if(!READY||!ME){
    document.body.classList.add('out');$('#rail').innerHTML='';
    $('#view').innerHTML=READY?'':!AUTHKNOWN||USER?`<p class="loading">${tx('loading')}</p>`:vOut();
    document.title=t('name')+(L==='he'?' · Platformika':'');
    return;
  }
  document.body.classList.remove('out');
  if(raw.startsWith('post-')){const id=raw.slice(5);history.replaceState(null,'','#home');setTimeout(()=>{const el=document.getElementById('post-'+id);el?.scrollIntoView({block:'center'});el?.classList.add('flash')},60)}
  const r=location.hash.slice(1)||'home';
  let html,navKey=r;
  if(r.startsWith('chat-')){html=vChat(r.slice(5));navKey='chats'}
  else if(r.startsWith('u-')){const h=decodeURIComponent(r.slice(2));html=vProfile(h);navKey=h===ME.handle?'profile':''}
  else{state.route=VIEWS[r]?r:'home';html=VIEWS[state.route]();navKey=state.route}
  if(r==='alerts'){try{localStorage.setItem('platformika.alertsSeen',String(Date.now()))}catch(e){}}
  // keep what the person is typing, and where each clip was playing, when live updates redraw the page
  const ae=document.activeElement,keep=ae&&ae.id&&$('#view').contains(ae)&&'value' in ae?{id:ae.id,v:ae.value,s:ae.selectionStart}:null;
  const chatAtEnd=(()=>{const b=$('#chatBody');return!b||b.scrollHeight-b.scrollTop-b.clientHeight<60})();
  const clipAt={};$$('[data-clip]').forEach(v=>{const id=v.closest('[data-post]')?.dataset.post;if(id)clipAt[id]=v.currentTime});
  const y=scrollY;
  $('#view').innerHTML=html;
  $('#rail').innerHTML=railHTML();
  if(keep){const el=document.getElementById(keep.id);if(el){el.value=keep.v;el.focus({preventScroll:true});try{el.setSelectionRange(keep.s,keep.s)}catch(e){}}}
  if(soft)scrollTo(0,y);
  $$('[data-r]').forEach(a=>a.dataset.r===navKey?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  const seen=seenAlerts(),unread=alerts().filter(a=>ts(a.at)>seen).length;
  $$('[data-badge]').forEach(b=>{b.hidden=!unread;b.textContent=unread});
  $('#navMe').innerHTML=`${av(ME,'s36')}<span class="meta"><b>${esc(ME.name)}</b><small>${handle(ME.handle)}</small></span>`;
  if(r.startsWith('chat-')&&$('#chatBody')){const b=$('#chatBody');if(chatAtEnd)b.scrollTop=b.scrollHeight;bindChat()}
  $$('[data-clip]').forEach(v=>{const id=v.closest('[data-post]')?.dataset.post;if(clipAt[id])v.currentTime=clipAt[id];v.muted=!SOUND.has(id);v.play?.().catch(()=>{})});
  const name=t('name');
  document.title=r.startsWith('chat-')?`${t('chat')} · ${name}`:r.startsWith('u-')?`@${decodeURIComponent(r.slice(2))} · ${name}`:state.route==='home'?name:`${t(state.route==='profile'?'profile':state.route)} · ${name}`;
}
addEventListener('hashchange',()=>{closeMenus();render();scrollTo(0,0);const ae=document.activeElement;if(!ae||ae===document.body||!ae.matches('input,textarea'))$('#view').focus({preventScroll:true})});

function bindChat(){
  const f=$('#chatForm'),ta=$('#chatText');if(!f)return;
  const grow=()=>{ta.style.height='auto';ta.style.height=Math.min(120,ta.scrollHeight)+'px'};
  ta.addEventListener('input',grow);
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();f.requestSubmit()}});
  f.addEventListener('submit',async e=>{e.preventDefault();const v=ta.value.trim();if(!v)return;ta.value='';
    const tmp={id:'tmp'+Date.now(),sender:USER.id,recipient:f.dataset.to,body:v,created_at:new Date().toISOString()};MSGS.push(tmp);render(true);$('#chatText')?.focus();
    const{error}=await sb.from('pk_messages').insert({recipient:f.dataset.to,body:v});
    if(error){MSGS=MSGS.filter(m=>m!==tmp);render(true);const n=$('#chatText');if(n&&!n.value)n.value=v;toast(errText(error))}else reloadSoon()});
}

/* ---------- events ---------- */
document.addEventListener('input',e=>{
  if(e.target.id==='q'||e.target.id==='qr'){state.q=e.target.value;const id=e.target.id,pos=e.target.selectionStart;if((location.hash.slice(1)||'home')!=='home')history.replaceState(null,'','#home');render();const el=$('#'+id);if(el){el.focus();el.setSelectionRange(pos,pos)}}
});
document.addEventListener('change',e=>{
  const s=e.target.closest('[data-lang]');if(!s||!T[s.value])return;
  L=s.value;try{localStorage.setItem('barusik.lang',L)}catch(x){}
  try{const u=new URL(location.href);if(u.searchParams.has('lang')){u.searchParams.set('lang',L);history.replaceState(null,'',u)}}catch(x){}
  applyShell();render(true);$('[data-lang]')?.focus();
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-act="cmt-form"]');if(!f)return;e.preventDefault();
  const id=f.closest('[data-post]').dataset.post,inp=$('input',f),v=inp.value.trim();if(!v)return;inp.value='';
  OPEN[id]=true;CMTS.push({id:'tmp',post:id,author:USER.id,body:v,created_at:new Date().toISOString()});render(true);$('#c-'+id)?.focus();
  const{error}=await sb.from('pk_comments').insert({post:id,body:v});if(error)toast(errText(error));reloadSoon();
});
document.addEventListener('click',async e=>{
  const close=e.target.closest('[data-close]');if(close){closeLayer();if(close.tagName!=='A')return}
  const wasOpen=$('[data-act="post-menu"][aria-expanded="true"]');
  if(!e.target.closest('.menu'))closeMenus();
  const pt=e.target.closest('[data-ptab]');if(pt){state.ptab=pt.dataset.ptab;render(true);return}
  const jump=e.target.closest('[data-jump]');if(jump&&jump.dataset.jump){e.preventDefault();state.q='';go('home');setTimeout(()=>{const el=document.getElementById('post-'+jump.dataset.jump);el?.scrollIntoView({block:'center',behavior:'smooth'});el?.classList.add('flash')},40);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;const postEl=a.closest('[data-post]');const p=postEl&&POSTS.find(x=>x.id===postEl.dataset.post);
  if(a.tagName==='A')e.preventDefault();
  switch(act){
    case'login':case'signup':authSheet(act,LINKERR?t('linkBad'):'');LINKERR=false;break;
    case'reload':location.reload();break;
    case'compose':compose();break;
    case'compose-img':compose();$('#cmpImg')?.click();break;
    case'story-new':storyCompose();break;
    case'story-view':viewStories(a.dataset.author);break;
    case'clip-new':clipNew();break;
    case'clip-sound':{const v=$('video',postEl),id=postEl.dataset.post;if(!v)break;const on=!SOUND.has(id);on?SOUND.add(id):SOUND.delete(id);v.muted=!on;a.setAttribute('aria-pressed',on);a.setAttribute('aria-label',t(on?'soundOff':'soundOn'));a.innerHTML=ic(on?'sound':'mute');v.play?.().catch(()=>{});break}
    case'chat-new':chatNew();break;
    case'invite':inviteSheet();break;
    case'logout':await sb.auth.signOut();break;
    case'search':state.showSearch=!state.showSearch;go('home');setTimeout(()=>$('#q')?.focus(),30);break;
    case'copy-ref':copy(refLink(),a);break;
    case'edit-profile':editProfile();break;
    case'block':blockUser(a.dataset.uid);break;
    case'unblock':unblockUser(a.dataset.uid);break;
    case'report':reportSheet(a.dataset.uid,null);break;
    case'delete-account':deleteAccountSheet();break;
    case'like':{if(!p)break;const on=likedByMe(p.id);
      if(on)LIKES=LIKES.filter(l=>!(l.post===p.id&&l.uid===USER.id));else LIKES.push({post:p.id,uid:USER.id,created_at:new Date().toISOString()});
      render(true);if(!on)$(`[data-post="${p.id}"] [data-act="like"] svg`)?.classList.add('pop');
      const r=on?await sb.from('pk_likes').delete().eq('post',p.id).eq('uid',USER.id):await sb.from('pk_likes').insert({post:p.id});
      if(r.error&&!String(r.error.message).includes('duplicate')){toast(errText(r.error));reloadSoon()}break}
    case'comment':if(!p)break;OPEN[p.id]=!OPEN[p.id];render(true);if(OPEN[p.id])$('#c-'+p.id)?.focus();break;
    case'share':if(p)share(SITE+'#post-'+p.id,a);break;
    case'post-menu':{if(!p||wasOpen===a)break;const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');
      m.innerHTML=`<button role="menuitem" data-m="copy">${ic('link')}${tx('copyLink')}</button>${a.dataset.mine?`<button role="menuitem" class="danger" data-m="del">${ic('trash')}${tx('del')}</button>`:`<button role="menuitem" data-m="report">${ic('flag')}${tx('reportPostM')}</button><button role="menuitem" data-m="block">${ic('block')}${tx('blockM')}</button>`}`;
      postEl.append(m);a.setAttribute('aria-expanded','true');m.querySelector('button').focus();
      m.addEventListener('click',async ev=>{const b=ev.target.closest('[data-m]');if(!b)return;
        if(b.dataset.m==='copy'){copy(SITE+(p.kind==='clip'?'#clips':'#post-'+p.id));closeMenus()}
        else if(b.dataset.m==='report'){closeMenus();reportSheet(p.author,p.id)}
        else if(b.dataset.m==='block'){closeMenus();blockUser(p.author)}
        else if(b.dataset.m==='del'){
          if(!b.dataset.sure){b.dataset.sure=1;b.innerHTML=`${ic('trash')}${tx('delSure')}`;return}
          const{error}=await sb.from('pk_posts').delete().eq('id',p.id);
          if(error){toast(errText(error));return}
          const path=mediaPath(p.media_url);if(path)sb.storage.from(BUCKET).remove([path]).catch(()=>{});
          POSTS=POSTS.filter(x=>x.id!==p.id);render(true);toast(t('removed'))}
      });break}
  }
});

/* ---------- start ---------- */
applyShell();render();
if(sb){
  sb.auth.onAuthStateChange((ev,session)=>{
    const u=session?.user||null;AUTHKNOWN=true;
    if(ev==='PASSWORD_RECOVERY'){RECOVERY=true;if(READY&&ME)passSheet()}
    if(u&&(!USER||USER.id!==u.id)){signedIn(u)}
    else if(!u&&USER){USER=null;ME=null;READY=false;closeLayer();render()}
    else if(!u&&!USER){READY=false;render();if(LINKERR){LINKERR=false;authSheet('login',t('linkBad'))}}
  });
  // signed in from another tab or another Barusik platform: pick the session up without a reload
  const recheck=()=>{if(USER)return;sb.auth.getSession().then(({data})=>{const u=data?.session?.user;if(u&&!USER)signedIn(u)}).catch(()=>{})};
  addEventListener('storage',e=>{if(e.key==='complichess-auth')recheck()});
  addEventListener('focus',recheck);document.addEventListener('visibilitychange',()=>{if(!document.hidden)recheck()});
}
})();
</script>
