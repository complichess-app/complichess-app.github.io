<style>
:root{--bg:#090B1F;--card:#12163A;--line:rgba(255,255,255,.12);--ink:#EEEAF8;--mute:#A9ABD0;--pk:#6A63FF;--gold:#D8AE57;--ok:#49E8C8;--bad:#FF8A8A}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:max(20px,env(safe-area-inset-top)) 16px 32px}
.brand{align-self:center;color:var(--gold);font-weight:800;text-decoration:none;margin-bottom:18px;font-size:15px}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:22px;font-weight:800;line-height:1.25}p{margin:0;line-height:1.55}
.mute{color:var(--mute)}.small{font-size:13.5px}
.sum{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:12px}
.total{font-size:30px;font-weight:800}.total small{font-size:14px;font-weight:500;color:var(--mute);align-self:center}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--mute)}
input{font:inherit;font-size:16px;background:#0B0E28;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 14px;width:100%}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:15px 18px;background:var(--pk);color:#fff;cursor:pointer;font-size:17px}
button:disabled{opacity:.6;cursor:wait}
.btn{display:inline-block;font-weight:800;border-radius:14px;padding:15px 22px;background:var(--pk);color:#fff;text-decoration:none;font-size:17px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:15px;padding:12px 16px}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0}.row button{white-space:nowrap}
.err{color:var(--bad);font-size:14px;min-height:1em}.good{color:var(--ok);font-size:14px}
details summary{cursor:pointer;color:var(--mute);font-size:14.5px}details[open] summary{margin-bottom:8px}
.big{font-size:44px;line-height:1}a{color:var(--gold)}
footer{margin-top:18px;max-width:440px;text-align:center;color:var(--mute);font-size:12.5px;line-height:1.6}
.spin{width:34px;height:34px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--gold);border-radius:50%;animation:r 1s linear infinite;align-self:center}@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
</style>

const q=new URLSearchParams(location.search);
const pick=()=>{const a=q.get('lang');if(T[a])return a;try{const s=localStorage.getItem('barusik.lang');if(T[s])return s}catch{}const n=(navigator.language||'he').slice(0,2);return T[n]?n:'he'};
const L=pick(),t=(k,v={})=>String(T[L][k]||T.he[k]||'').replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');
document.documentElement.lang=L;document.documentElement.dir=L==='he'||L==='ar'?'rtl':'ltr';document.title=t('title')+' · Barusik';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nis=n=>{const x=Number(n||0);return Number.isInteger(x)?String(x):x.toFixed(2)};
const safeBack=u=>/^\/[^/\\]/.test(u||'')?u:'/';
const say=(title,sub,btn,href)=>{app.innerHTML=`<div class="ticket" style="align-items:center;text-align:center"><h1>${esc(title)}</h1>${sub?`<p class="mute">${esc(sub)}</p>`:''}${btn?`<a class="btn" href="${esc(href)}">${esc(btn)}</a>`:''}</div>`};
const fn=async b=>{const{data:{session}}=await sb.auth.getSession();const r=await fetch(`${SB_URL}/functions/v1/pay`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,...(session?{Authorization:`Bearer ${session.access_token}`}:{})},body:JSON.stringify({lang:L,...b})});let j={};try{j=await r.json()}catch{}return j};
const saved=()=>{try{return JSON.parse(localStorage.getItem('barusik-pay')||'{}')}catch{return{}}};
const save=o=>{try{localStorage.setItem('barusik-pay',JSON.stringify(o))}catch{}};
let PUB=null;
document.getElementById('foot').textContent=t('foot');

function paidView(back){say(t('paid'),t('paidSub'),t('cont'),safeBack(back))}

// back from the payment company: ask the server, which asks the company
async function confirmView(id,params,back){
  app.innerHTML=`<div class="ticket" style="align-items:center;text-align:center"><div class="spin" aria-hidden="true"></div><p>${esc(t('checking'))}</p></div>`;
  for(let i=0;i<8;i++){
    const j=await fn({mode:'confirm',order:id||undefined,params});
    if(j.paid){let b=back;if(!b&&j.id){const{data}=await sb.rpc('pay_order_view',{p_id:j.id});b=data&&data.back_url}return paidView(b)}
    if(id){const{data}=await sb.rpc('pay_order_view',{p_id:id});if(data&&data.status==='paid')return paidView(back||data.back_url)}
    await new Promise(r=>setTimeout(r,2500));
  }
  say(t('title'),t('wait'));
}

function form(o){
  // o: {title,desc,list,discount,amount,coupon?,onPay(fields),couponable,demo,needLogin,noDetails}
  const S=saved();
  app.innerHTML=`<form class="ticket" id="f" novalidate>
    <h1>${esc(o.title)}</h1>${o.desc?`<p class="mute small">${esc(o.desc)}</p>`:''}
    ${PUB&&PUB.mode==='demo'?`<p class="good">${esc(t('demo'))}</p>`:''}
    <div class="sum" id="sum"></div>
    ${o.couponable?`<details id="cp"><summary>${esc(t('coupon'))}</summary><div class="row"><input id="code" aria-label="${esc(t('code'))}" placeholder="${esc(t('code'))}" dir="ltr" autocomplete="off" autocapitalize="characters"><button type="button" class="ghost" id="ap">${esc(t('apply'))}</button></div><p class="small" id="cm"></p></details>`:''}
    <div id="fields" style="display:flex;flex-direction:column;gap:10px">
      <label>${esc(t('name'))}<input id="nm" autocomplete="name" maxlength="120" value="${esc(o.name||S.name||'')}"></label>
      <label>${esc(t('phone'))}<input id="ph" type="tel" inputmode="tel" dir="ltr" autocomplete="tel" maxlength="20" placeholder="05X-XXXXXXX" value="${esc(o.phone||S.phone||'')}"></label>
      <label>${esc(t('mail'))}<input id="ml" type="email" dir="ltr" autocomplete="email" maxlength="160" value="${esc(o.email||S.email||'')}"></label>
    </div>
    <p class="err" id="e" role="alert"></p>
    <button id="go"></button>
    <p class="mute small">${esc(t('secure'))}</p><p class="mute small">${t('agree')}</p>
  </form>`;
  const $=id=>document.getElementById(id);let cur={...o};
  const draw=()=>{$('sum').innerHTML=`${Number(cur.discount)>0?`<div><span class="mute">${esc(t('price'))}</span><span>₪${nis(cur.list)}</span></div><div><span class="mute">${esc(t('discount'))}</span><span>−₪${nis(cur.discount)}</span></div>`:''}<div class="total"><small>${esc(t('total'))}</small><span>₪${nis(cur.amount)}</span></div>`;
    $('go').textContent=Number(cur.amount)>0?t('pay',{a:nis(cur.amount)}):t('free');$('fields').style.display=Number(cur.amount)>0?'flex':'none'};
  draw();
  if($('ap'))$('ap').onclick=async()=>{const c=$('code').value.trim();if(!c)return;$('ap').disabled=true;$('cm').className='small';$('cm').textContent='';
    const{data,error}=await sb.rpc('pay_quote',{p_product:o.product,p_coupon:c,p_ref:o.ref||null});$('ap').disabled=false;
    if(error||!data||(!data.ok&&data.reason!=='too many')){$('cm').className='small err';$('cm').textContent=t('busy');return}
    if(data.reason==='too many'){$('cm').className='small err';$('cm').textContent=t('ctoo');return}
    if(data.coupon_error){$('cm').className='small err';$('cm').textContent=t('c'+data.coupon_error);cur={...cur,list:data.list,discount:0,amount:data.amount,code:''};draw();return}
    $('cm').className='small good';$('cm').textContent=t('cOk');cur={...cur,list:data.list,discount:data.discount,amount:data.amount,code:data.coupon};draw()};
  $('f').onsubmit=async e=>{e.preventDefault();$('e').textContent='';
    const name=$('nm').value.trim(),phone=$('ph').value.replace(/\D/g,'').replace(/^972/,'0'),email=$('ml').value.trim();
    if(Number(cur.amount)>0&&PUB.mode==='live'&&(name.split(/\s+/).length<2||!/^05\d{8}$/.test(phone))){$('e').textContent=t('details');return}
    save({name,phone,email});$('go').disabled=true;
    const j=await o.onPay({name,phone,email,coupon:cur.code||''});
    if(j.url){location.href=j.url;return}
    if(j.paid)return paidView(o.back);
    if(j.demo){$('go').textContent=t('demoBtn');$('go').disabled=false;$('f').onsubmit=async ev=>{ev.preventDefault();$('go').disabled=true;const d=await fn({mode:'demo_paid',order:j.id});if(d.paid)return paidView(o.back);$('e').textContent=t('busy');$('go').disabled=false};return}
    $('go').disabled=false;$('e').textContent=j.error==='details'?t('details'):j.error==='off'?t('off'):j.error==='sign in'?t('login'):t('busy')};
}

function loginView(then){
  app.innerHTML=`<form class="ticket" id="l" novalidate><h1>${esc(t('login'))}</h1>
    <label>${esc(t('email'))}<input id="em" type="email" dir="ltr" autocomplete="email"></label>
    <label>${esc(t('pass'))}<input id="pw" type="password" dir="ltr" autocomplete="current-password"></label>
    <p class="err" id="e" role="alert"></p><button>${esc(t('loginBtn'))}</button><p class="mute small">${t('noAcc')}</p></form>`;
  document.getElementById('l').onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:document.getElementById('em').value.trim(),password:document.getElementById('pw').value});
    if(r.error){document.getElementById('e').textContent=t('badLogin');return}then()};
}

async function productView(id,ref,back){
  const prod=(PUB.products||[]).find(p=>p.id===id);
  if(!prod)return say(t('title'),t('none'),t('cont'),safeBack(back));
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return loginView(()=>productView(id,ref,back));
  const{data}=await sb.rpc('pay_quote',{p_product:id,p_coupon:null,p_ref:ref||null});
  if(!data||!data.ok)return say(t('title'),t('none'),t('cont'),safeBack(back||prod.back_url));
  form({product:id,ref,title:prod.name,desc:prod.description,list:data.list,discount:data.discount,amount:data.amount,couponable:true,back:back||prod.back_url,
    onPay:f=>fn({mode:'create',product:id,ref:ref||undefined,...f})});
}

async function orderView(id,back){
  const{data}=await sb.rpc('pay_order_view',{p_id:id});
  if(!data)return say(t('title'),t('gone'));
  if(data.status==='paid')return paidView(back||data.back_url);
  if(data.status==='cancelled'||data.status==='refunded')return say(t('title'),t('gone'));
  form({title:data.title,list:data.list,discount:data.discount,amount:data.amount,couponable:false,back:back||data.back_url,
    onPay:f=>fn({mode:'order',order:id,...f})});
}

(async()=>{
  try{const{data}=await sb.rpc('pay_public');PUB=data}catch{}
  if(!PUB)return say(t('title'),t('busy'));
  const id=q.get('o'),back=q.get('back');
  // Hyp comes back with its own parameters in the address
  if(q.get('Order')&&q.get('CCode')!==null){
    if(q.get('CCode')!=='0')return say(t('title'),t('notPaid'));
    return confirmView(null,Object.fromEntries(q.entries()),back);
  }
  if(q.has('cancel'))return id?(say(t('title'),t('notPaid'),t('again'),`/pay/?o=${encodeURIComponent(id)}${back?'&back='+encodeURIComponent(back):''}`)):say(t('title'),t('notPaid'));
  if(q.has('done')&&id)return confirmView(id,{},back);
  if(id)return orderView(id,back);
  if(PUB.mode==='off')return say(t('title'),t('off'));
  const p=q.get('p');if(!p)return say(t('title'),t('none'),t('cont'),'/');
  productView(p,/^[0-9a-f-]{36}$/i.test(q.get('ref')||'')?q.get('ref'):null,back);
})();
})();
</script>
