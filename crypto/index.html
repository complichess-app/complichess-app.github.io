<style>
:root{--bg:#0F1733;--card:#17204A;--ink:#E8ECFF;--muted:#A9B3D9;--line:rgba(255,255,255,.14);--mint:#3DDBB8;--gold:#F7B955;--bad:#FF8A8A}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Rubik,Arial,sans-serif}
body{padding:0 0 40px}.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;max-width:880px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:800;font-size:19px}.brand svg{width:34px;height:34px}
.grow{flex:1}
select,button,input{font:inherit}
select{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 12px}select option{color:#000}
button,.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--mint);color:#04241C;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}
h1{font-size:clamp(26px,6vw,40px);margin:18px 0 6px}p{line-height:1.6}
.mute{color:var(--muted)}.small{font-size:14px}.bad{color:var(--bad)}.ok{color:var(--mint)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.bal{font-size:30px;font-weight:800;direction:ltr;text-align:start}.coin{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.coin i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:15px}
.addr{direction:ltr;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#0B1230;border-radius:12px;padding:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input{background:#0B1230;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px;direction:ltr}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:6px;font-size:14px}.list div{border-top:1px solid var(--line);padding-top:6px}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:22px;padding-top:14px;line-height:1.6}
.links{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:8px}.links a{color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:9}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>

const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'complichess-auth'}}):null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let L=(()=>{const q=new URLSearchParams(location.search).get('lang');let s;try{s=localStorage.getItem('barusik.lang')}catch{}return T[q]?q:T[s]?s:'he'})();
const t=(k,v={})=>String(T[L][k]??T.en[k]??'').replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');
const num=(n,a)=>{const x=Number(n||0);return x.toLocaleString('en-US',{maximumFractionDigits:a==='BTC'?8:8,minimumFractionDigits:0})};
let USER=null,ME=null,drafts={};

function frame(){
  document.documentElement.lang=L;document.documentElement.dir=L==='he'||L==='ar'?'rtl':'ltr';
  $('lang').innerHTML=Object.entries(N).map(([k,v])=>`<option value="${k}"${k===L?' selected':''}>${v}</option>`).join('');
  $('acc').textContent=USER?t('logout'):t('login');$('note').textContent=t('note');
  $('aT').textContent=t('t');$('aT').href=`/${L}/terms/`;$('aP').textContent=t('pr');$('aP').href=`/${L}/privacy/`;$('aA').textContent=t('a');$('aA').href=`/${L}/accessibility/`;$('aH').textContent=t('home');$('aH').href=`/${L}/`;
}
const head=()=>`<h1>${t('title')}</h1><p class="mute">${t('sub')}</p>`;
function render(){
  frame();const m=$('main');
  // keep what someone was typing in a withdrawal form across refreshes
  m.querySelectorAll('[data-k]').forEach(i=>{drafts[i.dataset.k]=i.value});
  if(!sb){m.innerHTML=head()+`<p class="bad">${t('e_busy')}</p>`;return}
  if(!USER){m.innerHTML=head()+`<div class="card" style="margin-top:14px"><b>${t('outT')}</b><p class="mute">${t('outS')}</p><div class="row"><button id="go">${t('login')}</button></div></div>`;$('go').onclick=loginSheet;return}
  if(!ME){m.innerHTML=head()+'<p class="mute">…</p>';return}
  const st=ME.status;
  if(st==='none'){m.innerHTML=head()+`<div class="card" style="margin-top:14px"><b>${t('joinT')}</b><p class="mute">${t('joinS')}</p><label>${t('joinNote')}<input id="jn" maxlength="300" dir="auto"></label><div class="row"><button id="jb">${t('join')}</button></div></div>`;
    $('jb').onclick=async()=>{$('jb').disabled=true;await sb.rpc('cw_join',{p_note:$('jn').value.trim()||null});refresh()};return}
  if(st==='pending'){m.innerHTML=head()+`<div class="card" style="margin-top:14px"><b>${t('pendT')}</b><p class="mute">${t('pendS')}</p></div>`;return}
  if(st!=='approved'){m.innerHTML=head()+`<div class="card" style="margin-top:14px"><b>${t('blockT')}</b><p class="mute">${t('blockS')}</p></div>`;return}
  const R=ME.rules||{};
  m.innerHTML=head()+`<div class="grid">${['BTC','XMR'].map(a=>{const c=COINS[a],k=a.toLowerCase(),ad=(ME.addresses||{})[a];
    return `<section class="card" aria-label="${c.name}">
      <div class="coin"><i style="background:${c.color}">${c.sym}</i>${c.name} <span class="mute small">${a}</span></div>
      <div><div class="mute small">${t('bal')}</div><div class="bal">${num((ME.balances||{})[a],a)} ${a}</div></div>
      <div><b>${t('dep')}</b>
        ${ad&&ad.status==='done'?`<div class="addr" style="margin-top:6px">${esc(ad.address)}</div><div class="row" style="margin-top:6px"><button class="ghost" data-copy="${esc(ad.address)}">${t('copy')}</button><span class="mute small" aria-live="polite"></span></div><p class="mute small">${t('depRule',{c:a,n:R[k+'_conf']})}</p>`
        :ad&&ad.status==='queued'?`<p class="mute small">${t('making')}</p>`
        :`${ad&&ad.status==='failed'?`<p class="bad small">${t('failAddr')}</p>`:''}<div class="row" style="margin-top:6px"><button class="ghost" data-addr="${a}">${t('getAddr')}</button></div>`}</div>
      <form data-wd="${a}" style="display:flex;flex-direction:column;gap:8px"><b>${t('wd')}</b>
        ${ME.open?'':`<p class="bad small">${t('paused')}</p>`}
        <label>${t('to')}<input data-k="${a}to" name="to" autocomplete="off" spellcheck="false" value="${esc(drafts[a+'to']||'')}" required></label>
        <label>${t('amount')} (${a})<input data-k="${a}amt" name="amt" inputmode="decimal" autocomplete="off" value="${esc(drafts[a+'amt']||'')}" required></label>
        <p class="mute small" style="margin:0">${t('fee')}: ${R[k+'_fee']} ${a} · ${t('min')}: ${R[k+'_min']} ${a} · ${t('day',{d:R[k+'_day']+' '+a})}</p>
        <p class="small bad" role="alert" style="margin:0"></p>
        <div class="row"><button ${ME.open?'':'disabled'}>${t('send')}</button></div>
        <p class="mute small" style="margin:0">${t('wdRule')}</p></form>
    </section>`}).join('')}</div>
    <section class="card" style="margin-top:14px"><b>${t('hist')}</b><div class="list">${hist()||`<span class="mute">${t('none')}</span>`}</div></section>`;
  m.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.nextElementSibling.textContent=t('copied')}catch{}});
  m.querySelectorAll('[data-addr]').forEach(b=>b.onclick=async()=>{b.disabled=true;await sb.rpc('cw_ask_address',{p_asset:b.dataset.addr});refresh()});
  m.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{b.disabled=true;await sb.rpc('cw_cancel',{p_id:Number(b.dataset.cancel)});refresh()});
  m.querySelectorAll('form[data-wd]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const a=f.dataset.wd,k=a.toLowerCase(),to=f.to.value.trim(),amt=f.amt.value.trim().replace(',','.'),msg=f.querySelector('[role=alert]');
    msg.textContent='';if(!to||!/^\d+(\.\d+)?$/.test(amt)){msg.textContent=t('e_bad_amount');return}
    if(!confirm(t('sure',{a:amt,c:a,to,f:(ME.rules||{})[k+'_fee']})))return;
    f.querySelector('button').disabled=true;
    const{error}=await sb.rpc('cw_withdraw',{p_asset:a,p_address:to,p_amount:amt});
    if(error){const code='e_'+String(error.message||'').trim().replace(/\s+/g,'_');msg.textContent=T[L][code]?t(code):t('e_busy');f.querySelector('button').disabled=false;return}
    drafts[a+'to']='';drafts[a+'amt']='';refresh()});
}
function hist(){
  const rows=[...(ME.deposits||[]).map(d=>({at:d.at,h:`<b>${t('in')}</b> ${num(d.amount,d.asset)} ${d.asset} · <span class="${d.credited?'ok':'mute'}">${d.credited?t('credited'):t('wait')+` (${d.conf})`}</span> <span class="mute small" dir="ltr">${esc(d.txid.slice(0,12))}…</span>`})),
    ...(ME.withdrawals||[]).map(w=>({at:w.at,h:`<b>${t('out')}</b> ${num(w.amount,w.asset)} ${w.asset} · <span class="${w.status==='sent'?'ok':w.status==='rejected'?'bad':'mute'}">${t(w.status)}</span>${w.note?` <span class="mute small">(${esc(w.note)})</span>`:''}${w.txid?` <span class="mute small" dir="ltr">${esc(w.txid.slice(0,12))}…</span>`:''}${w.status==='requested'?` <button class="ghost" style="padding:4px 12px" data-cancel="${w.id}">${t('cancel')}</button>`:''}`}))];
  return rows.sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,30).map(r=>`<div>${r.h} <span class="mute small">${new Date(r.at).toLocaleString(L)}</span></div>`).join('');
}
async function refresh(){if(!sb||!USER){ME=null;render();return}const{data,error}=await sb.rpc('cw_me');ME=error?{status:'none'}:data;render()}

function loginSheet(){
  const d=document.createElement('div');d.className='scrim';d.innerHTML=`<form class="sheet" role="dialog" aria-modal="true" aria-labelledby="lgT">
    <h2 id="lgT" style="margin:0">${t('signIn')}</h2>
    <label>${t('email')}<input id="lgE" type="email" autocomplete="email"></label>
    <label>${t('password')}<input id="lgP" type="password" autocomplete="current-password"></label>
    <p class="bad small" role="alert" style="margin:0"></p>
    <button>${t('signIn')}</button><a href="/${L}/" class="mute small">${t('noAcc')}</a>
    <button type="button" class="ghost" data-close>${t('close')}</button></form>`;
  const prev=document.activeElement;document.body.appendChild(d);$('lgE').focus();
  const close=()=>{d.remove();prev&&prev.focus&&prev.focus()};
  d.onclick=e=>{if(e.target===d||e.target.closest('[data-close]'))close()};d.onkeydown=e=>{if(e.key==='Escape')close()};
  d.querySelector('form').onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:$('lgE').value.trim(),password:$('lgP').value});if(r.error)d.querySelector('[role=alert]').textContent=t('badLogin');else close()};
}
$('acc').onclick=async()=>{if(!sb)return;if(USER){await sb.auth.signOut()}else loginSheet()};
$('lang').onchange=e=>{L=e.target.value;try{localStorage.setItem('barusik.lang',L)}catch{}render()};
render();
if(sb){
  sb.auth.onAuthStateChange((_e,s)=>{const was=USER&&USER.id;USER=s?.user||null;if((USER&&USER.id)!==was){ME=null;refresh()}else frame()});
  setInterval(()=>{if(!document.hidden&&USER&&!document.querySelector('.scrim')&&!document.activeElement.closest('form'))refresh()},20000);
}
</script>
</body>
</html>
