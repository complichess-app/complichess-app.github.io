<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ניהול · Barusik Platforms</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#090B1F;--card:#12163A;--line:rgba(255,255,255,.09);--ink:#EEEAF8;--mute:#A3A5CB;--pk:#6A63FF;--cx:#D8AE57;--ok:#49E8C8;--bad:#FF7A7A}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif}
body{min-height:100svh;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:24px;margin:0;font-weight:800}h2{font-size:17px;margin:0 0 10px}
.sp{flex:1}.mute{color:var(--mute)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat small{color:var(--mute);font-size:13px}.stat b{display:block;font-size:28px;margin-top:4px;font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;background:var(--pk);color:#fff;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
input{font:inherit;background:#0B0E28;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--cx);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:transparent;border:1px solid var(--line);color:var(--mute)}.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tbl{overflow:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#0F1333;color:var(--mute);font-weight:600;cursor:pointer;user-select:none}
tr:hover td{background:rgba(255,255,255,.03)}td.l{direction:ltr;text-align:right}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.y{background:rgba(73,232,200,.15);color:var(--ok)}.n{background:rgba(255,122,122,.14);color:var(--bad)}
.box{max-width:420px;margin:10vh auto 0;display:flex;flex-direction:column;gap:12px}
.err{color:var(--bad);font-size:14px}.list{display:flex;flex-direction:column;gap:8px}
.post{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px}
.post small{color:var(--mute);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="mute">טוען…</p></div>
<script src="/lib/supabase.js"></script>
<script>
(()=>{
const sb=window.supabase.createClient('https://iktmyrfbejtjsiehcrar.supabase.co','sb_publishable_vEUqQPQSE0EG7YRnwNeAbg_PzViDO1a',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'complichess-auth'}});
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d=x=>x?new Date(x).toLocaleString('he-IL',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const n=x=>new Intl.NumberFormat('he-IL').format(x||0);
let DATA=null,TAB='all',Q='',SORT={k:'created_at',dir:-1};

function login(msg){
  app.innerHTML=`<form class="box card" id="f"><h1>ניהול Barusik</h1><p class="mute">הדף פתוח רק למשתמש של המנהל. התחברו עם המשתמש הכללי שלכם.</p>
  <input id="m" type="email" dir="ltr" placeholder="מייל" autocomplete="email" required><input id="p" type="password" dir="ltr" placeholder="סיסמה" autocomplete="current-password" required>
  <span class="err" role="alert">${esc(msg||'')}</span><button>התחברות</button><a class="mute" href="/">← חזרה לאתר</a></form>`;
  document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='מתחבר…';
    const{error}=await sb.auth.signInWithPassword({email:document.getElementById('m').value.trim(),password:document.getElementById('p').value});
    if(error)login(error.message.toLowerCase().includes('invalid')?'מייל או סיסמה לא נכונים':error.message);else load()};
}
function denied(email){
  app.innerHTML=`<div class="box card"><h1>אין הרשאה</h1><p class="mute">המשתמש <b dir="ltr">${esc(email)}</b> אינו מנהל. הדף הזה פתוח רק לבר.</p><button class="ghost" id="o">התנתקות</button><a class="mute" href="/">← חזרה לאתר</a></div>`;
  document.getElementById('o').onclick=async()=>{await sb.auth.signOut();login()};
}
async function load(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){login();return}
  const{data,error}=await sb.rpc('admin_overview');
  if(error){if(/not allowed|42501|permission/i.test(error.message+error.code))denied(session.user.email);else app.innerHTML=`<div class="box card"><h1>שגיאה</h1><p class="err">${esc(error.message)}</p><p class="mute">אם זה "function does not exist" — צריך להריץ את קובץ ה־SQL של ברוסיק ב־Supabase.</p><button id="r">נסו שוב</button></div>`,document.getElementById('r')&&(document.getElementById('r').onclick=load);return}
  if(!data||!data.totals){app.innerHTML=`<div class="box card"><h1>אין נתונים</h1><p class="mute">השרת לא החזיר נתונים. נסו לרענן.</p><button id="r">רענון</button></div>`;document.getElementById('r').onclick=load;return}
  DATA=data;draw(session.user.email);
}
function rows(){
  let u=DATA.users.map(x=>({...x,cxn:x.complichess?.username||'',pkh:x.platformika?.profile?.handle||'',rating:x.complichess?.rating??null,games:x.complichess?.games??0,
    pkp:(x.platformika?.posts||0)+(x.platformika?.clips||0)+(x.platformika?.stories||0)}));
  if(TAB==='cx')u=u.filter(x=>x.complichess);if(TAB==='pk')u=u.filter(x=>x.platformika?.profile);
  if(Q){const q=Q.toLowerCase();u=u.filter(x=>[x.email,x.cxn,x.pkh,x.platformika?.profile?.name].some(v=>String(v||'').toLowerCase().includes(q)))}
  const k=SORT.k;u.sort((a,b)=>{const A=a[k]??'',B=b[k]??'';return(A>B?1:A<B?-1:0)*SORT.dir});
  return u;
}
function cols(){
  const base=[['email','מייל'],['created_at','נרשם'],['last_sign_in_at','התחבר לאחרונה'],['confirmed','אימות']];
  const cx=[['cxn','קומפליצס: שם'],['rating','דירוג'],['games','משחקים']];
  const pk=[['pkh','פלטפורמיקה: @'],['pkp','פרסומים'],['pkc','תגובות'],['pkl','לייקים שקיבל'],['pkm','הודעות']];
  return TAB==='cx'?base.concat(cx):TAB==='pk'?base.concat(pk):base.concat(cx,pk);
}
function cell(x,k){
  const pk=x.platformika||{};
  switch(k){
    case'email':return`<td class="l">${esc(x.email)}</td>`;
    case'created_at':case'last_sign_in_at':return`<td>${d(x[k])}</td>`;
    case'confirmed':return`<td><span class="pill ${x.confirmed?'y':'n'}">${x.confirmed?'מאומת':'לא'}</span></td>`;
    case'cxn':return`<td>${esc(x.cxn)||'—'}</td>`;case'rating':return`<td>${x.rating??'—'}</td>`;case'games':return`<td>${n(x.games)}</td>`;
    case'pkh':return`<td class="l">${x.pkh?'@'+esc(x.pkh):'—'}</td>`;case'pkp':return`<td>${n(x.pkp)}</td>`;
    case'pkc':return`<td>${n(pk.comments)}</td>`;case'pkl':return`<td>${n(pk.likes_received)}</td>`;case'pkm':return`<td>${n(pk.messages_sent)}</td>`;
  }return'<td></td>';
}
function csv(){
  const c=cols(),r=rows();const line=a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',');
  const vals=x=>c.map(([k])=>({email:x.email,created_at:x.created_at,last_sign_in_at:x.last_sign_in_at,confirmed:x.confirmed,cxn:x.cxn,rating:x.rating,games:x.games,pkh:x.pkh,pkp:x.pkp,pkc:x.platformika?.comments,pkl:x.platformika?.likes_received,pkm:x.platformika?.messages_sent})[k]);
  const blob=new Blob(['﻿'+[line(c.map(x=>x[1]))].concat(r.map(x=>line(vals(x)))).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='barusik-users.csv';a.click();
}
function draw(email){
  const T=DATA.totals,cxUsers=DATA.users.filter(x=>x.complichess).length,pkUsers=DATA.users.filter(x=>x.platformika?.profile).length,m=DATA.cx_matches;
  const r=rows(),c=cols();
  app.innerHTML=`
  <header><h1>ניהול · Barusik Platforms</h1><span class="sp"></span><span class="mute" dir="ltr">${esc(email)}</span><button class="ghost" id="rf">רענון</button><button class="ghost" id="out">התנתקות</button></header>
  <p class="mute" style="margin:0">נכון ל־${d(DATA.generated_at)}</p>
  <section class="grid">
    <div class="card stat"><small>משתמשים (כל הפלטפורמות)</small><b>${n(T.users)}</b></div>
    <div class="card stat"><small>נרשמו ב־7 ימים</small><b>${n(T.users_7d)}</b></div>
    <div class="card stat"><small>פעילים ב־7 ימים</small><b>${n(T.active_7d)}</b></div>
    <div class="card stat"><small>שחקני קומפליצס</small><b>${n(cxUsers)}</b></div>
    <div class="card stat"><small>משחקים מדורגים</small><b>${n(m?.total)}</b></div>
    <div class="card stat"><small>פרופילים בפלטפורמיקה</small><b>${n(pkUsers)}</b></div>
    <div class="card stat"><small>פרסומים בפלטפורמיקה</small><b>${n(T.pk_posts)}</b></div>
    <div class="card stat"><small>תגובות · לייקים</small><b>${n(T.pk_comments)} · ${n(T.pk_likes)}</b></div>
    <div class="card stat"><small>הודעות צ'אט</small><b>${n(T.pk_messages)}</b></div>
    <div class="card stat"><small>LearnLume · קריפטו</small><b class="mute" style="font-size:18px">בקרוב</b></div>
  </section>
  <section class="card">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <div class="tabs" role="tablist">${[['all','כולם'],['cx','קומפליצס'],['pk','פלטפורמיקה']].map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${TAB===k}">${l}</button>`).join('')}</div>
      <span class="sp"></span><input id="q" placeholder="חיפוש מייל או שם" value="${esc(Q)}" style="max-width:260px"><button class="ghost" id="csv">ייצוא CSV</button>
    </div>
    <p class="mute" style="margin:0 0 8px">${n(r.length)} משתמשים · לחיצה על כותרת ממיינת</p>
    <div class="tbl"><table><thead><tr>${c.map(([k,l])=>`<th data-k="${k}" aria-sort="${SORT.k===k?(SORT.dir>0?'ascending':'descending'):'none'}">${l}${SORT.k===k?(SORT.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
    <tbody>${r.map(x=>`<tr>${c.map(([k])=>cell(x,k)).join('')}</tr>`).join('')||`<tr><td colspan="${c.length}" class="mute">אין משתמשים</td></tr>`}</tbody></table></div>
  </section>
  <section class="card"><h2>פרסומים אחרונים בפלטפורמיקה</h2><div class="list">${(DATA.pk_recent||[]).map(p=>`<div class="post"><small>${d(p.created_at)}</small><b dir="ltr">@${esc(p.handle||'?')}</b><span class="pill y">${{post:'פוסט',clip:'קליפ',story:'סטורי'}[p.kind]||p.kind}</span><span>${esc(p.body)||'<span class=mute>(מדיה)</span>'}</span></div>`).join('')||'<p class="mute">עוד אין פרסומים</p>'}</div></section>
  <p class="mute" style="font-size:13px">תוכן הודעות פרטיות לא מוצג כאן — רק כמה הודעות כל משתמש שלח. סיסמאות לא נשמרות אצלנו בכלל (Supabase שומר רק גיבוב).</p>`;
  document.getElementById('out').onclick=async()=>{await sb.auth.signOut();login()};
  document.getElementById('rf').onclick=load;
  document.getElementById('csv').onclick=csv;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;draw(email)});
  document.querySelectorAll('th[data-k]').forEach(t=>t.onclick=()=>{const k=t.dataset.k;SORT=SORT.k===k?{k,dir:-SORT.dir}:{k,dir:-1};draw(email)});
  const q=document.getElementById('q');q.oninput=()=>{Q=q.value;const p=q.selectionStart;draw(email);const e=document.getElementById('q');e.focus();e.setSelectionRange(p,p)};
}
load();
})();
</script>
</body>
</html>
