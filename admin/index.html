<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ניהול · Barusik Platforms</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#090B1F;--panel:#10143A;--raise:#171C49;--line:rgba(255,255,255,.1);--ink:#EEEAF8;--mute:#A3A5CB;--pk:#6A63FF;--gold:#D8AE57;--ok:#3DDC97;--bad:#FF7A7A;--warn:#F5B45B}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif}
body{min-height:100svh}
a{color:var(--gold)}h1,h2,h3,p{margin:0}
.mute{color:var(--mute)}.sp{flex:1}.small{font-size:13.5px}.err{color:var(--bad);font-size:14px}.okc{color:var(--ok)}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:9px 16px;background:var(--pk);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button:disabled{opacity:.55;cursor:wait}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.go{background:var(--ok);color:#04261A}.warnb{background:var(--warn);color:#2B1B00}
input,select,textarea{font:inherit;background:#0B0E28;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.y{background:rgba(61,220,151,.15);color:var(--ok)}.n{background:rgba(255,122,122,.14);color:var(--bad)}.w{background:rgba(245,180,91,.16);color:var(--warn)}.m{background:rgba(255,255,255,.08);color:var(--mute)}

/* the frame: a rail on the side on a computer, a bar at the bottom on the phone */
.frame{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100svh}
nav.rail{position:sticky;top:0;align-self:start;height:100svh;border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:3px;background:#0B0E28}
.rail .logo{font-weight:800;font-size:17px;padding:4px 10px 14px;color:var(--gold)}
.rail button{background:transparent;color:var(--mute);justify-content:space-between;border-radius:10px;padding:10px 12px;width:100%}
.rail button[aria-current=page]{background:var(--raise);color:var(--ink)}
.rail .badge{background:var(--bad);color:#2B0606;border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:12px;display:inline-grid;place-items:center}
.rail .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--mute);padding:8px 10px;word-break:break-all}
main{padding:max(18px,env(safe-area-inset-top)) clamp(14px,3vw,34px) 100px;max-width:1120px;width:100%;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top h1{font-size:24px;font-weight:800}
section>h2{font-size:17px;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.rows{display:flex;flex-direction:column}.rowx{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.rowx:last-child{border-bottom:0}
.rowx small{color:var(--mute)}.grow{flex:1;min-width:180px}
.nums{display:flex;flex-wrap:wrap;gap:0}.nums div{flex:1 1 130px;padding:6px 12px 6px 0}.nums b{display:block;font-size:24px;font-variant-numeric:tabular-nums;font-weight:800}.nums small{color:var(--mute);font-size:13px}

/* the one thing to see first: is the travel site live right now */
.lamp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border-radius:18px;padding:16px 18px;border:1px solid var(--line);background:var(--panel)}
.lamp.on{border-color:rgba(61,220,151,.45);background:linear-gradient(90deg,rgba(61,220,151,.12),transparent 60%)}
.lamp.off{border-color:rgba(255,122,122,.4);background:linear-gradient(90deg,rgba(255,122,122,.1),transparent 60%)}
.dot{width:26px;height:26px;border-radius:50%;background:var(--bad);box-shadow:0 0 18px var(--bad)}.lamp.on .dot{background:var(--ok);box-shadow:0 0 18px var(--ok)}
.lamp b{font-size:18px;display:block}
@media (max-width:560px){.lamp{grid-template-columns:auto minmax(0,1fr)}.lamp>:last-child{grid-column:1/-1}.lamp>:last-child button{width:100%}}

.todo{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-radius:0;color:var(--ink);font-weight:500;text-align:start;white-space:normal;justify-content:flex-start}
.todo:last-child{border-bottom:0}.todo b{min-width:28px;text-align:center;font-size:20px;color:var(--gold)}.todo .sp{text-align:end;color:var(--mute)}

.tbl{overflow:auto;max-width:100%;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#0F1333;color:var(--mute);font-weight:600;cursor:pointer;user-select:none}
td.l{direction:ltr;text-align:right}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:transparent;border:1px solid var(--line);color:var(--mute)}.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}.form input,.form select{width:100%}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.links h3{font-size:15px;margin-bottom:6px}.links a{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14.5px}.links a small{color:var(--mute)}
.box{max-width:420px;margin:10vh auto 0;display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.box input{width:100%}
.price{width:92px;font-variant-numeric:tabular-nums}
#toast{position:fixed;inset-inline:16px;bottom:84px;margin-inline:auto;max-width:420px;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-weight:700;z-index:50;text-align:center}
@media (max-width:860px){
  .frame{display:block}
  nav.rail{position:fixed;bottom:0;inset-inline:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;padding:6px 8px max(6px,env(safe-area-inset-bottom));border:0;border-top:1px solid var(--line);z-index:20;gap:2px}
  .rail .logo,.rail .foot{display:none}.rail button{flex:0 0 auto;width:auto;padding:9px 12px;font-size:14px;gap:6px}
}
</style>
</head>
<body>
<div id="app"><p class="mute" style="padding:24px">טוען…</p></div>
<div id="toast" role="status" hidden></div>
<script src="/lib/supabase.js"></script>
<script>
(()=>{
const SB_URL='https://iktmyrfbejtjsiehcrar.supabase.co',REF='iktmyrfbejtjsiehcrar';
const sb=window.supabase.createClient(SB_URL,'sb_publishable_vEUqQPQSE0EG7YRnwNeAbg_PzViDO1a',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'complichess-auth'}});
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d=x=>x?new Date(x).toLocaleString('he-IL',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const n=x=>new Intl.NumberFormat('he-IL').format(x||0);
const nis=x=>'₪'+new Intl.NumberFormat('he-IL',{maximumFractionDigits:2}).format(Number(x||0));
const usd=x=>'$'+Number(x||0).toFixed(2);
const wa=p=>{let x=String(p||'').replace(/\D/g,'');if(x.startsWith('0'))x='972'+x.slice(1);return'https://wa.me/'+x};
function toast(t,ms=2600){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms)}
const copy=async t=>{try{await navigator.clipboard.writeText(t);toast('הועתק');return true}catch{toast('לא הצלחתי להעתיק: '+t,6000);return false}};

const TABS=[['home','בית'],['travel','נסיעות'],['penina','פנינה'],['pay','תשלומים ושוברים'],['cx','קומפליצס'],['users','משתמשים'],['pk','פלטפורמיקה'],['links','קישורים']];
let VIEW=TABS.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):'home';
let CG=null,CGT='ads',CGQ='';
let EMAIL='',DATA=null,TRQ=[],TRF='open',REP=null,PNR=null,PNERR='',PNS=null,BILL=null,SRV=null,PAY=null,LIVE=[];
let TAB='all',Q='',SORT={k:'created_at',dir:-1};
const PLAT={pn:'פנינה',cx:'קומפליצס',pk:'פלטפורמיקה',lr:'LearnLume',cr:'קריפטו',other:'אחר'};
const KIND={flights:'טיסות',hotels:'מלונות',cars:'השכרת רכב',packages:'חבילות נופש',tours:'טיולים מאורגנים',tickets:'כרטיסים'};
const PROV={
  allpay:{name:'Allpay',open:'https://www.allpay.co.il/en/signup',keys:'<b dir="ltr">ALLPAY_LOGIN, ALLPAY_KEY</b>. מוצאים אותם ב־Allpay תחת Settings ← Integrations. כדי לנסות קודם בכרטיסי בדיקה מוסיפים <b dir="ltr">ALLPAY_TEST</b> עם הערך <b dir="ltr">1</b>, ומוחקים אותו כשעוברים לכסף אמיתי.'},
  grow:{name:'Grow',open:'https://grow.business/join-us/',keys:'<b dir="ltr">GROW_USER_ID, GROW_PAGE_CODE</b>, ואם נתנו לך גם <b dir="ltr">GROW_API_KEY</b>. כש־Grow מאשרים מעבר לייצור, מוסיפים <b dir="ltr">GROW_ENV</b> עם הערך <b dir="ltr">live</b>.'},
  hyp:{name:'Hyp',open:'https://hyp.co.il/online-payments/',keys:'<b dir="ltr">HYP_MASOF, HYP_KEY, HYP_PASSP</b>. בהגדרות המסוף ב־Hyp מגדירים דף הצלחה וכישלון: <span dir="ltr">https://barusik.com/pay/</span>'},
};
const ST={new:['ממתין לאישור','n'],quoted:['אושר · נשלחה הצעה','y'],paid:['שולם','y'],closed:['הושלם','y'],cancelled:['בוטל','n']};
const PN_LANG={he:'עברית',en:'אנגלית',ar:'ערבית',ru:'רוסית',es:'ספרדית',fr:'צרפתית'};
const PN_MODEL={sonnet:['סונט כותב · אופוס מתכנן','כ־$1–2 לדוח'],opus:['אופוס כותב ומתכנן','כ־$1.5–3.5 לדוח'],fable:['פייבל כותב · אופוס מתכנן','כ־$3.5–8 לדוח']};
const PN_ST={pending:['מחכה','n'],approved:['אושר, עוד לא נוצל','y'],used:['הדוח נכתב','y'],declined:['נדחה','m']};
const ORD={created:['נפתח','m'],pending:['ממתין לתשלום','w'],paid:['שולם','y'],failed:['נכשל','n'],cancelled:['בוטל','m'],refunded:['הוחזר','m']};

// ---------- sign-in and the second step ----------
function login(msg){
  app.innerHTML=`<form class="box" id="f"><h1>ניהול Barusik</h1><p class="mute">הדף פתוח רק למשתמש של המנהל.</p>
  <input id="m" type="email" dir="ltr" placeholder="מייל" autocomplete="email" required><input id="p" type="password" dir="ltr" placeholder="סיסמה" autocomplete="current-password" required>
  <span class="err" role="alert">${esc(msg||'')}</span><button>התחברות</button><a class="mute" href="/">← חזרה לאתר</a></form>`;
  document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='מתחבר…';
    const{error}=await sb.auth.signInWithPassword({email:document.getElementById('m').value.trim(),password:document.getElementById('p').value});
    if(error)login(error.message.toLowerCase().includes('invalid')?'מייל או סיסמה לא נכונים':error.message);else load()};
}
function denied(email){
  app.innerHTML=`<div class="box"><h1>אין הרשאה</h1><p class="mute">המשתמש <b dir="ltr">${esc(email)}</b> אינו מנהל. הדף הזה פתוח רק לבר.</p><button class="ghost" id="o">התנתקות</button><a class="mute" href="/">← חזרה לאתר</a></div>`;
  document.getElementById('o').onclick=async()=>{await sb.auth.signOut();login()};
}
function codeForm(title,intro,btn,onCode,extra){
  app.innerHTML=`<form class="box" id="f"><h1>${title}</h1><p class="mute">${intro}</p><div id="x"></div>
  <input id="c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr" placeholder="000000" aria-label="קוד בן 6 ספרות" required>
  <span class="err" role="alert" id="e"></span><button>${btn}</button><button type="button" class="ghost" id="o">התנתקות</button>
  <p class="mute small">הקוד נמצא באפליקציית האימות בטלפון (Google Authenticator או דומה), בשורה של Barusik. מתחלף כל 30 שניות.</p></form>`;
  if(extra)extra(document.getElementById('x'));
  const c=document.getElementById('c'),e=document.getElementById('e');c.focus();
  document.getElementById('o').onclick=async()=>{await sb.auth.signOut();login()};
  document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const b=ev.target.querySelector('button');
    const code=c.value.replace(/\D/g,'');if(code.length!==6){e.textContent='צריך 6 ספרות';return}
    b.disabled=true;e.textContent='';const err=await onCode(code);b.disabled=false;
    if(err){e.textContent=err;c.value='';c.focus()}else load()};
}
async function mfaVerify(){
  const{data:f}=await sb.auth.mfa.listFactors();const t=f&&f.totp&&f.totp[0];
  if(!t){mfaEnroll();return}
  codeForm('אימות דו-שלבי','הזינו את הקוד בן 6 הספרות מאפליקציית האימות.','אישור',async code=>{
    const{error}=await sb.auth.mfa.challengeAndVerify({factorId:t.id,code});
    return error?'הקוד לא נכון או שפג תוקפו. נסו שוב עם הקוד הנוכחי.':''});
}
async function mfaEnroll(){
  const{data:f}=await sb.auth.mfa.listFactors();
  for(const x of(f&&f.all)||[])if(x.factor_type==='totp'&&x.status!=='verified')await sb.auth.mfa.unenroll({factorId:x.id});
  const{data,error}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'Barusik admin '+new Date().toISOString().slice(0,10)});
  if(error||!data){app.innerHTML=`<div class="box"><h1>אימות דו-שלבי</h1><p class="err">${esc(error?error.message:'לא התקבלה תשובה')}</p><button id="r">נסו שוב</button></div>`;document.getElementById('r').onclick=load;return}
  codeForm('הפעלת אימות דו-שלבי','מעכשיו דף הניהול דורש גם קוד מהטלפון. סרקו את הקוד באפליקציית אימות (Google Authenticator, Microsoft Authenticator או 1Password) והזינו את 6 הספרות שהיא מציגה.','הפעלה',async code=>{
    const{error}=await sb.auth.mfa.challengeAndVerify({factorId:data.id,code});
    return error?'הקוד לא התקבל. בדקו שהשעון בטלפון מדויק ונסו את הקוד הבא.':''},
  x=>{const img=new Image(200,200);img.alt='קוד QR להוספה לאפליקציית האימות';img.src=data.totp.qr_code;img.style.cssText='display:block;margin:0 auto;background:#fff;border-radius:12px;padding:8px';
    const p=document.createElement('p');p.className='mute small';p.textContent='אי אפשר לסרוק? הקלידו באפליקציה את המפתח: ';
    const s=document.createElement('span');s.dir='ltr';s.style.cssText='user-select:all;word-break:break-all;color:var(--ink)';s.textContent=data.totp.secret;p.appendChild(s);x.append(img,p)});
}
async function load(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){login();return}
  const{data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aal&&aal.currentLevel==='aal1'&&aal.nextLevel==='aal2'){mfaVerify();return}
  const{data,error}=await sb.rpc('admin_overview');
  if(error&&/not allowed|42501|permission/i.test(error.message+error.code)){
    const{data:mine}=await sb.rpc('is_admin_account');
    if(mine===true){mfaEnroll();return}
  }
  if(!error&&!(aal&&aal.currentLevel==='aal2')){mfaEnroll();return}
  if(error){if(/not allowed|42501|permission/i.test(error.message+error.code))denied(session.user.email);else{app.innerHTML=`<div class="box"><h1>שגיאה</h1><p class="err">${esc(error.message)}</p><button id="r">נסו שוב</button></div>`;document.getElementById('r').onclick=load}return}
  if(!data||!data.totals){app.innerHTML=`<div class="box"><h1>אין נתונים</h1><p class="mute">השרת לא החזיר נתונים. נסו לרענן.</p><button id="r">רענון</button></div>`;document.getElementById('r').onclick=load;return}
  DATA=data;EMAIL=session.user.email;
  await Promise.all([loadTravel(),loadReports(),loadPenina(),loadPay(),loadSrv(),loadCg()]);
  loadBill();
  draw();listen();
}
function listen(){
  if(LIVE.length)return;
  const on=(name,table,fn)=>LIVE.push(sb.channel(name).on('postgres_changes',{event:'*',schema:'public',table},async()=>{await fn();draw()}).subscribe());
  if(PNR!==null)on('pnr','pn_requests',loadPenina);
  if(TRQ!==null)on('trq','travel_requests',loadTravel);
  if(PAY&&!PAY.err)on('ord','pay_orders',loadPay);
  setInterval(async()=>{if(document.hidden)return;const was=SRV&&SRV.online;await loadSrv();if((SRV&&SRV.online)!==was)draw()},10000);
}
// ---------- data ----------
async function loadSrv(){try{const{data}=await sb.rpc('travel_status');SRV=data||{online:false}}catch{SRV={online:false}}}
async function loadTravel(){const{data,error}=await sb.from('travel_requests').select('*').order('created_at',{ascending:false}).limit(300);TRQ=error?null:(data||[])}
async function loadReports(){try{const{data,error}=await sb.from('pk_reports').select('*').order('created_at',{ascending:false}).limit(100);REP=error?null:(data||[])}catch{REP=null}}
async function loadPenina(){PNERR='';try{const[{data,error},sp]=await Promise.all([sb.rpc('pn_admin_list'),sb.rpc('pn_admin_spend')]);if(error)PNERR=error.message||'';PNR=error?null:(data||[]);PNS=sp.error?null:sp.data}catch(e){PNR=null;PNERR=String(e&&e.message||e)}}
const callFn=async(name,body)=>{const{data:{session}}=await sb.auth.getSession();const r=await fetch(`${SB_URL}/functions/v1/${name}`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`,apikey:'sb_publishable_vEUqQPQSE0EG7YRnwNeAbg_PzViDO1a'},body:JSON.stringify(body)});return r.json()};
// what Anthropic itself charged. The page works without it, so it never holds anything up
async function loadBill(){try{BILL=await callFn('penina',{mode:'billing'});if(VIEW==='penina')draw()}catch{BILL={connected:false,failed:true}}}
async function loadPay(){
  try{
    const [s,p,c,o]=await Promise.all([sb.from('pay_settings').select('*').eq('id',1).maybeSingle(),sb.from('pay_products').select('*').order('sort'),sb.from('pay_coupons').select('*').order('created_at',{ascending:false}),sb.from('pay_orders').select('id,created_at,email,name,phone,title,platform,product_id,amount,list_price,discount,coupon,status,provider,receipt,paid_at,by_admin').order('created_at',{ascending:false}).limit(300)]);
    if(s.error)throw s.error;
    PAY={s:s.data||{mode:'off',provider:'allpay'},products:(p.data||[]).filter(x=>x.platform!=='tr'),coupons:c.data||[],orders:o.data||[],check:PAY&&PAY.check||null};
  }catch(e){PAY={err:String(e&&e.message||e)}}
}
// ---------- what's new, for the badges and the home page ----------
const counts=()=>({pn:(PNR||[]).filter(r=>r.status==='pending').length,tr:(TRQ||[]).filter(r=>r.status==='new').length,pk:(REP||[]).filter(r=>r.status==='open').length});
const thisMonth=x=>{const t=new Date(x),m=new Date();return t.getFullYear()===m.getFullYear()&&t.getMonth()===m.getMonth()};

async function cgSaveAd(form){
  const f=new FormData(form),btn=form.querySelector('button');btn.disabled=true;
  try{
    let img=String(f.get('image_url')||'').trim()||null;const file=f.get('file');
    if(file&&file.size){
      if(file.size>3145728){toast('התמונה גדולה מ־3MB',4000);btn.disabled=false;return}
      const ext=(file.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'png',path=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
      const up=await sb.storage.from('cg-ads').upload(path,file,{contentType:file.type,upsert:false});
      if(up.error)throw up.error;
      img=sb.storage.from('cg-ads').getPublicUrl(path).data.publicUrl;
    }
    const link=String(f.get('link_url')||'').trim()||null;
    if(link&&!/^(https:\/\/|\/)/.test(link)){toast('הקישור צריך להתחיל ב־https:// או ב־/',4000);btn.disabled=false;return}
    const row={name:String(f.get('name')).trim(),title:String(f.get('title')||'').trim(),body:String(f.get('body')||'').trim(),cta:String(f.get('cta')||'').trim(),link_url:link,image_url:img,
      placement:f.get('placement'),lang:f.get('lang')||null,active:!!f.get('active'),weight:Math.max(1,Math.min(100,Number(f.get('weight')||1))),
      starts_at:f.get('starts_at')?new Date(f.get('starts_at')+'T00:00:00').toISOString():null,ends_at:f.get('ends_at')?new Date(f.get('ends_at')+'T23:59:59').toISOString():null,updated_at:new Date().toISOString()};
    if(!row.title&&!row.body&&!row.image_url){toast('צריך לפחות כותרת, טקסט או תמונה',4000);btn.disabled=false;return}
    const id=f.get('id');
    const r=id?await sb.from('cg_ads').update(row).eq('id',id):await sb.from('cg_ads').insert(row);
    if(r.error)throw r.error;
    toast(id?'נשמר':'הפרסומת נוצרה');CG.edit=null;await loadCg();draw();
  }catch(e){toast('שגיאה: '+(e.message||e),5000);btn.disabled=false}
}

  const adf=document.getElementById('adf');if(adf){adf.onsubmit=e=>{e.preventDefault();cgSaveAd(adf)};adf.oninput=()=>{const f=new FormData(adf),pv=document.getElementById('adpv');if(pv)pv.innerHTML=adPreview({title:f.get('title'),body:f.get('body'),cta:f.get('cta'),link_url:f.get('link_url'),image_url:/^https:\/\//.test(String(f.get('image_url')||''))?f.get('image_url'):null})}}
  document.querySelectorAll('[data-cg]').forEach(el=>el.onchange=async()=>{const k=el.dataset.cg;let v=el.type==='checkbox'?el.checked:parseInt(el.value,10);
    if(el.type!=='checkbox'){const[,,,mi,ma]=CG_SET.find(x=>x[0]===k);if(!(v>=mi&&v<=ma)){toast('מספר בין '+mi+' ל־'+ma,4000);el.value=CG.config[k];return}}
    if(await after(()=>sb.from('cg_config').update({[k]:v,updated_at:new Date().toISOString()}).eq('id',1),'נשמר'))CG.config[k]=v;else{await loadCg();draw()}});
  const cgq=document.getElementById('cgq');if(cgq)cgq.oninput=()=>{CGQ=cgq.value;const p=cgq.selectionStart;draw();const e=document.getElementById('cgq');e.focus();e.setSelectionRange(p,p)};
  const nl=document.getElementById('newl');if(nl)nl.onsubmit=async e=>{e.preventDefault();const f=new FormData(nl);
    const{data,error}=await sb.rpc('pay_admin_link',{p_title:String(f.get('title')).trim(),p_amount:Number(f.get('amount')),p_platform:f.get('platform')});
    if(error){toast('שגיאה: '+error.message,5000);return}await copy(`https://barusik.com/pay/?o=${data}`);await loadPay();draw()};
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&ACT[el.dataset.a]){e.preventDefault();ACT[el.dataset.a](el,e)}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(DATA&&TABS.some(t=>t[0]===h)&&h!==VIEW){VIEW=h;draw()}});
load();
})();
</script>
</body>
</html>
