<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ניהול · Barusik Platforms</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#090B1F;--card:#12163A;--line:rgba(255,255,255,.09);--ink:#EEEAF8;--mute:#A3A5CB;--pk:#6A63FF;--cx:#D8AE57;--ok:#49E8C8;--bad:#FF7A7A}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif}
body{min-height:100svh;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:24px;margin:0;font-weight:800}h2{font-size:17px;margin:0 0 10px}
.sp{flex:1}.mute{color:var(--mute)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat small{color:var(--mute);font-size:13px}.stat b{display:block;font-size:28px;margin-top:4px;font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;background:var(--pk);color:#fff;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
input{font:inherit;background:#0B0E28;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 14px;width:100%}
input:focus-visible,button:focus-visible{outline:3px solid var(--cx);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{background:transparent;border:1px solid var(--line);color:var(--mute)}.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tbl{overflow:auto;max-width:100%;border-radius:12px;border:1px solid var(--line)}
.card{min-width:0;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#0F1333;color:var(--mute);font-weight:600;cursor:pointer;user-select:none}
tr:hover td{background:rgba(255,255,255,.03)}td.l{direction:ltr;text-align:right}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.y{background:rgba(73,232,200,.15);color:var(--ok)}.n{background:rgba(255,122,122,.14);color:var(--bad)}
.box{max-width:420px;margin:10vh auto 0;display:flex;flex-direction:column;gap:12px}
.err{color:var(--bad);font-size:14px}.list{display:flex;flex-direction:column;gap:8px}
.post{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px}
.post small{color:var(--mute);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="mute">טוען…</p></div>
<script src="/lib/supabase.js"></script>
<script>
(()=>{
const sb=window.supabase.createClient('https://iktmyrfbejtjsiehcrar.supabase.co','sb_publishable_vEUqQPQSE0EG7YRnwNeAbg_PzViDO1a',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'complichess-auth'}});
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d=x=>x?new Date(x).toLocaleString('he-IL',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const n=x=>new Intl.NumberFormat('he-IL').format(x||0);
let DATA=null,TAB='all',Q='',SORT={k:'created_at',dir:-1},TRQ=[],TRF='open',LIVE=null;
const KIND={flights:'טיסות',hotels:'מלונות',cars:'השכרת רכב',packages:'חבילות נופש',tours:'טיולים מאורגנים',tickets:'כרטיסים'};
const ST={new:['ממתין לאישור','n'],quoted:['אושר · נשלחה הצעה','y'],paid:['שולם','y'],closed:['הושלם','y'],cancelled:['בוטל','n']};
const wa=p=>{let x=String(p||'').replace(/\D/g,'');if(x.startsWith('0'))x='972'+x.slice(1);return'https://wa.me/'+x};
async function loadTravel(){const{data,error}=await sb.from('travel_requests').select('*').order('created_at',{ascending:false}).limit(300);TRQ=error?null:(data||[])}
function travelHTML(){
  if(TRQ===null)return`<section class="card"><h2>הזמנות Bar Lvovski Travel</h2><p class="err">לא הצלחתי לטעון את ההזמנות. אם זו הפעם הראשונה — צריך להריץ את travel.sql ב־Supabase.</p></section>`;
  const open=TRQ.filter(r=>r.status==='new');
  const list=TRF==='open'?open:TRQ;
  const det=r=>{const x=r.details||{};const lines=(x.lines||[]).slice(0,14).map(esc).join(' · ');
    return`${x.title?`<b>${esc(x.title)}</b><br>`:''}${x.search?`<span class="mute">${esc(x.search)}</span><br>`:''}${lines?`<span style="font-size:13px">${lines}</span><br>`:''}${x.customer_price?`<b>מחיר ללקוח: ₪${n(x.customer_price)}</b> <span class="mute">(מחיר סוכן בערך ₪${n(Math.round(x.customer_price/1.12))} · רווח בערך ₪${n(x.customer_price-Math.round(x.customer_price/1.12))})</span>`:''}${x.link?`<br><a href="${esc(x.link)}" target="_blank" rel="noopener" style="color:var(--cx)">פתיחת החיפוש ב־BeAgent ←</a>`:''}`};
  return`<section class="card" id="trv"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><h2 style="margin:0">הזמנות Bar Lvovski Travel</h2>${open.length?`<span class="pill n">${open.length} ממתינות לאישור</span>`:''}<span class="sp"></span>
    <div class="tabs">${[['open','ממתינות'],['all','הכל']].map(([k,l])=>`<button data-trf="${k}" aria-selected="${TRF===k}">${l}</button>`).join('')}</div></div>
    <div class="list">${list.map(r=>`<div class="post" style="flex-wrap:wrap;align-items:flex-start;white-space:normal">
      <small>${d(r.created_at)}</small><span class="pill y">${KIND[r.kind]||esc(r.kind)}</span>
      <div style="flex:1;min-width:240px">${det(r)}${r.notes?`<br><span class="mute">הערות הלקוח:</span> ${esc(r.notes)}`:''}</div>
      <div style="display:flex;flex-direction:column;gap:6px;min-width:200px"><b>${esc(r.name)}</b><a class="l" style="color:var(--ok)" href="${wa(r.phone)}" target="_blank" rel="noopener">${esc(r.phone)} · וואטסאפ</a>${r.email?`<a class="l" style="color:var(--mute)" href="mailto:${esc(r.email)}">${esc(r.email)}</a>`:''}
      <select data-st="${r.id}" style="font:inherit;background:#0B0E28;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px">${Object.entries(ST).map(([k,[l]])=>`<option value="${k}" ${r.status===k?'selected':''}>${l}</option>`).join('')}</select></div></div>`).join('')||`<p class="mute">${TRF==='open'?'אין הזמנות שממתינות לאישור':'עוד אין הזמנות'}</p>`}</div></section>`;
}

function login(msg){
  app.innerHTML=`<form class="box card" id="f"><h1>ניהול Barusik</h1><p class="mute">הדף פתוח רק למשתמש של המנהל. התחברו עם המשתמש הכללי שלכם.</p>
  <input id="m" type="email" dir="ltr" placeholder="מייל" autocomplete="email" required><input id="p" type="password" dir="ltr" placeholder="סיסמה" autocomplete="current-password" required>
  <span class="err" role="alert">${esc(msg||'')}</span><button>התחברות</button><a class="mute" href="/">← חזרה לאתר</a></form>`;
  document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;b.textContent='מתחבר…';
    const{error}=await sb.auth.signInWithPassword({email:document.getElementById('m').value.trim(),password:document.getElementById('p').value});
    if(error)login(error.message.toLowerCase().includes('invalid')?'מייל או סיסמה לא נכונים':error.message);else load()};
}
function denied(email){
  app.innerHTML=`<div class="box card"><h1>אין הרשאה</h1><p class="mute">המשתמש <b dir="ltr">${esc(email)}</b> אינו מנהל. הדף הזה פתוח רק לבר.</p><button class="ghost" id="o">התנתקות</button><a class="mute" href="/">← חזרה לאתר</a></div>`;
  document.getElementById('o').onclick=async()=>{await sb.auth.signOut();login()};
}
async function load(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){login();return}
  const{data,error}=await sb.rpc('admin_overview');
  if(error){if(/not allowed|42501|permission/i.test(error.message+error.code))denied(session.user.email);else app.innerHTML=`<div class="box card"><h1>שגיאה</h1><p class="err">${esc(error.message)}</p><p class="mute">אם זה "function does not exist" — צריך להריץ את קובץ ה־SQL של ברוסיק ב־Supabase.</p><button id="r">נסו שוב</button></div>`,document.getElementById('r')&&(document.getElementById('r').onclick=load);return}
  if(!data||!data.totals){app.innerHTML=`<div class="box card"><h1>אין נתונים</h1><p class="mute">השרת לא החזיר נתונים. נסו לרענן.</p><button id="r">רענון</button></div>`;document.getElementById('r').onclick=load;return}
  DATA=data;await loadTravel();await loadReports();await loadPenina();draw(session.user.email);
  if(!PNLIVE&&PNR!==null)PNLIVE=sb.channel('pnr').on('postgres_changes',{event:'*',schema:'public',table:'pn_requests'},async()=>{await loadPenina();draw(session.user.email)}).subscribe();
  if(!LIVE&&TRQ!==null)LIVE=sb.channel('trq').on('postgres_changes',{event:'*',schema:'public',table:'travel_requests'},async()=>{await loadTravel();draw(session.user.email)}).subscribe();
}
let PNR=null,PNLIVE=null,PNERR='';
async function loadPenina(){PNERR='';try{const{data,error}=await sb.rpc('pn_admin_list');if(error)PNERR=error.message||'';PNR=error?null:(data||[])}catch(e){PNR=null;PNERR=String(e&&e.message||e)}}
const PN_LANG={he:'עברית',en:'אנגלית',ar:'ערבית',ru:'רוסית',es:'ספרדית',fr:'צרפתית'};
const PN_MODEL={sonnet:['Sonnet','כ־$0.6–2'],opus:['Opus','כ־$1.2–4'],fable:['Fable','כ־$3–10']};
const PN_ST={pending:['מחכה','n'],approved:['אושר, עוד לא נוצל','y'],used:['הדוח נכתב','y'],declined:'נדחה'};

function pnView(x){
  const A=v=>Array.isArray(v)?v:[],P=(t,h)=>h?`<h3 style="margin:18px 0 6px">${t}</h3>${h}`:'';
  const r=x.report||{},bl=s=>String(s??'').split(/\n\s*\n/).map(q=>`<p>${esc(q)}</p>`).join('');
  const li=(a,f)=>A(a).map(f).join('');
  return`<div style="max-width:760px;margin:0 auto;padding:18px;line-height:1.55" dir="auto">
  <button class="ghost" id="pnClose">← חזרה</button>
  <p class="mute" dir="rtl">${esc(x.email)} · ${d(x.created_at)} · ${(PN_MODEL[x.model]||[x.model])[0]}${x.cost_usd!=null?' · עלה $'+Number(x.cost_usd).toFixed(2):''}</p>
  <h2 style="margin:4px 0">${esc(r.headline)} <span class="pill y">${esc(r.score)}/10</span></h2>
  ${r.score_line?`<p><i>${esc(r.score_line)}</i></p>`:''}${bl(r.verdict)}
  ${P('פרסים',li(r.awards,a=>`<p><b>${esc(a.title)}</b> — ${esc(a.who)}: ${esc(a.why)}</p>`))}
  ${P('אנשים',li(r.people,p=>`<p><b>${esc(p.name)}</b> · ${esc(p.role)}<br>${esc(p.roast)}<br><i>${esc(p.kind)}</i><br>🟢 ${esc(p.green)} · 🔴 ${esc(p.red)}${A(p.habits).length?'<br>'+A(p.habits).map(esc).join(' · '):''}${A(p.signature).length?'<br>'+A(p.signature).map(q=>'״'+esc(q)+'״').join(' · '):''}${p.fun_fact?'<br>'+esc(p.fun_fact):''}</p>`))}
  ${P('מקרים ('+A(r.cases).length+')',li(r.cases,(c,i)=>`<p><b>${i+1}. ${esc(c.title)}</b> <span class="mute">${esc(c.when)} · ${esc(c.who)}</span><br>${esc(c.story)}${c.quote?`<br>״${esc(c.quote)}״`:''}<br><i>${esc(c.punchline)}</i></p>`))}
  ${P('בדיחות פנימיות',li(r.jokes,j=>`<p><b>${esc(j.title)}</b> (${esc(j.who)}): ${esc(j.explain)}${j.quote?` ״${esc(j.quote)}״`:''}</p>`))}
  ${P('משחקונים',li(r.games,g=>`<p><b>${esc(g.title)}</b> (${esc(g.type)}): ${esc(g.intro)}</p>`))}
  ${P('טיפים מפנינה',li(r.tips,x=>`<p><b>💡 ${esc(x.title)}</b> ${esc(x.who)}: ${esc(x.tip)}</p>`))}
  ${P('מי עם מי',li(r.pairs,p=>`<p><b>${esc(p.a)} + ${esc(p.b)}</b>: ${esc(p.note)}</p>`))}
  ${P('לאורך הזמן',li(r.eras,e=>`<p><b>${esc(e.label)}</b>: ${esc(e.note)}</p>`))}
  ${P('דינמיקה',li(r.dynamics,q=>`<p>${esc(q)}</p>`))}
  ${P('רגעים',li(r.moments,m=>`<p>״${esc(m.quote)}״ — ${esc(m.who)} · ${esc(m.note)}</p>`))}
  ${P('עצה',r.advice?`<p>${esc(r.advice)}</p>`:'')}
  ${P('תשובות הלקוח לשאלות',li(x.answers,a=>`<p><b>${esc(a.q)}</b><br>${esc(a.a)}</p>`))}
  </div>`;
}
function peninaHTML(){
  if(PNR===null)return`<section class="card" id="penina"><h2>בקשות לדוח של פנינה <span class="pill n">לא זמין</span></h2><p class="err">${esc(PNERR||'השרת לא ענה')}</p><p class="mute" style="margin:0">אם כתוב ש־pn_admin_list לא קיימת — צריך להריץ את penina.sql ב־Supabase. בלי זה פנינה לא יכולה לכתוב דוחות.</p></section>`;
  const wait=PNR.filter(r=>r.status==='pending'),tot=PNR.reduce((a,r)=>a+Number(r.cost_usd||0),0);
  const st=r=>{const v=PN_ST[r.status];return Array.isArray(v)?`<span class="pill ${v[1]}">${v[0]}</span>`:`<span class="mute">${v||r.status}</span>`};
  return`<section class="card" id="penina"><h2>בקשות לדוח של פנינה <span class="pill ${wait.length?'n':'y'}">${n(wait.length)} מחכות</span>${tot?` <span class="mute">· עלו עד היום $${tot.toFixed(2)}</span>`:''}</h2>
  <p class="mute" style="margin:0 0 10px">כל דוח נכתב מהקרדיט שלך ב־Claude ולכן הוא נכתב רק אחרי שתאשר כאן ותבחר מודל (המחיר ליד כל מודל הוא טווח משוער לדוח מלא, תלוי בגודל הצ׳אט, והעלות האמיתית תופיע ליד כל דוח אחרי שנכתב). גם בקשות שלך עוברות כאן. הצ׳אט עצמו לא מגיע אליך ולא נשמר. הדוחות המוכנים נשמרים וניתן לפתוח אותם מכאן.</p>
  ${PNR.length?`<div class="list">${PNR.map(r=>`<div class="post"><small>${d(r.created_at)}</small><b dir="ltr">${esc(r.email)}</b><span>${n(r.msgs)} הודעות${Number(r.mb)?' · '+Number(r.mb).toLocaleString(undefined,{maximumFractionDigits:1})+' MB':''} · ${n(r.people)} משתתפים · ${PN_LANG[r.lang]||r.lang}</span><span class="sp"></span>${r.status==='pending'?`<select data-pnm aria-label="מודל">${Object.entries(PN_MODEL).map(([k,v])=>`<option value="${k}"${k==='opus'?' selected':''}>${v[0]} · ${v[1]}</option>`).join('')}</select><button data-pn="${r.id}" data-ok="1">אישור</button><button class="ghost" data-pn="${r.id}" data-ok="0">דחייה</button>`:`${st(r)} <span class="mute">${(PN_MODEL[r.model]||[r.model])[0]}${r.cost_usd!=null?' · עלה $'+Number(r.cost_usd).toFixed(2):''}</span>${r.has_report?` <button class="ghost" data-pnopen="${r.id}">פתיחת הדוח</button>`:''}${r.status==='approved'?`<select data-pns aria-label="מודל">${Object.entries(PN_MODEL).map(([k,v])=>`<option value="${k}"${k===r.model?' selected':''}>${v[0]} · ${v[1]}</option>`).join('')}</select><button class="ghost" data-pnset="${r.id}">החלפת מודל</button>`:''}`}</div>`).join('')}</div>`:'<p class="mute">עוד אין בקשות.</p>'}</section>`;
}
let REP=null;
async function loadReports(){try{const{data,error}=await sb.from('pk_reports').select('*').order('created_at',{ascending:false}).limit(100);REP=error?null:(data||[])}catch(e){REP=null}}
function reportsHTML(){
  if(REP===null)return'';
  const open=REP.filter(r=>r.status==='open');
  const name=id=>{const u=DATA.users.find(x=>x.id===id);return u?(u.platformika?.profile?.handle?'@'+u.platformika.profile.handle:u.email):'—'};
  return`<section class="card"><h2>דיווחים בפלטפורמיקה <span class="pill ${open.length?'n':'y'}">${n(open.length)} פתוחים</span></h2>${REP.length?`<div class="list">${REP.map(r=>`<div class="post"><small>${d(r.created_at)}</small><b dir="ltr">${esc(name(r.target_user))}</b><span>${r.post?'פוסט':'משתמש'}</span><span>${esc(r.reason)}</span><span class="sp"></span><span class="mute" dir="ltr">מאת ${esc(name(r.reporter))}</span>${r.status==='open'?`<button class="ghost" data-rep="${r.id}">טופל</button>`:'<span class="pill y">טופל</span>'}</div>`).join('')}</div>`:'<p class="mute">אין דיווחים</p>'}</section>`;
}
function rows(){
  let u=DATA.users.map(x=>({...x,cxn:x.complichess?.username||'',pkh:x.platformika?.profile?.handle||'',rating:x.complichess?.rating??null,games:x.complichess?.games??0,
    pkp:(x.platformika?.posts||0)+(x.platformika?.clips||0)+(x.platformika?.stories||0)}));
  if(TAB==='cx')u=u.filter(x=>x.complichess);if(TAB==='pk')u=u.filter(x=>x.platformika?.profile);
  if(Q){const q=Q.toLowerCase();u=u.filter(x=>[x.email,x.cxn,x.pkh,x.platformika?.profile?.name].some(v=>String(v||'').toLowerCase().includes(q)))}
  const k=SORT.k;u.sort((a,b)=>{const A=a[k]??'',B=b[k]??'';return(A>B?1:A<B?-1:0)*SORT.dir});
  return u;
}
function cols(){
  const base=[['email','מייל'],['created_at','נרשם'],['last_sign_in_at','התחבר לאחרונה'],['confirmed','אימות']];
  const cx=[['cxn','קומפליצס: שם'],['rating','דירוג'],['games','משחקים']];
  const pk=[['pkh','פלטפורמיקה: @'],['pkp','פרסומים'],['pkc','תגובות'],['pkl','לייקים שקיבל'],['pkm','הודעות']];
  return TAB==='cx'?base.concat(cx):TAB==='pk'?base.concat(pk):base.concat(cx,pk);
}
function cell(x,k){
  const pk=x.platformika||{};
  switch(k){
    case'email':return`<td class="l">${esc(x.email)}</td>`;
    case'created_at':case'last_sign_in_at':return`<td>${d(x[k])}</td>`;
    case'confirmed':return`<td><span class="pill ${x.confirmed?'y':'n'}">${x.confirmed?'מאומת':'לא'}</span></td>`;
    case'cxn':return`<td>${esc(x.cxn)||'—'}</td>`;case'rating':return`<td>${x.rating??'—'}</td>`;case'games':return`<td>${n(x.games)}</td>`;
    case'pkh':return`<td class="l">${x.pkh?'@'+esc(x.pkh):'—'}</td>`;case'pkp':return`<td>${n(x.pkp)}</td>`;
    case'pkc':return`<td>${n(pk.comments)}</td>`;case'pkl':return`<td>${n(pk.likes_received)}</td>`;case'pkm':return`<td>${n(pk.messages_sent)}</td>`;
  }return'<td></td>';
}
function csv(){
  const c=cols(),r=rows();const line=a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',');
  const vals=x=>c.map(([k])=>({email:x.email,created_at:x.created_at,last_sign_in_at:x.last_sign_in_at,confirmed:x.confirmed,cxn:x.cxn,rating:x.rating,games:x.games,pkh:x.pkh,pkp:x.pkp,pkc:x.platformika?.comments,pkl:x.platformika?.likes_received,pkm:x.platformika?.messages_sent})[k]);
  const blob=new Blob(['﻿'+[line(c.map(x=>x[1]))].concat(r.map(x=>line(vals(x)))).join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='barusik-users.csv';a.click();
}
function draw(email){
  const T=DATA.totals,cxUsers=DATA.users.filter(x=>x.complichess).length,pkUsers=DATA.users.filter(x=>x.platformika?.profile).length,m=DATA.cx_matches;
  const r=rows(),c=cols();
  app.innerHTML=`
  <header><h1>ניהול · Barusik Platforms</h1><span class="sp"></span><span class="mute" dir="ltr">${esc(email)}</span><button class="ghost" id="rf">רענון</button><button class="ghost" id="out">התנתקות</button></header>
  <p class="mute" style="margin:0">נכון ל־${d(DATA.generated_at)}</p>
  ${peninaHTML()}
  ${travelHTML()}
  ${reportsHTML()}
  <section class="grid">
    <div class="card stat"><small>משתמשים (כל הפלטפורמות)</small><b>${n(T.users)}</b></div>
    <div class="card stat"><small>נרשמו ב־7 ימים</small><b>${n(T.users_7d)}</b></div>
    <div class="card stat"><small>פעילים ב־7 ימים</small><b>${n(T.active_7d)}</b></div>
    <div class="card stat"><small>שחקני קומפליצס</small><b>${n(cxUsers)}</b></div>
    <div class="card stat"><small>משחקים מדורגים</small><b>${n(m?.total)}</b></div>
    <div class="card stat"><small>פרופילים בפלטפורמיקה</small><b>${n(pkUsers)}</b></div>
    <div class="card stat"><small>פרסומים בפלטפורמיקה</small><b>${n(T.pk_posts)}</b></div>
    <div class="card stat"><small>תגובות · לייקים</small><b>${n(T.pk_comments)} · ${n(T.pk_likes)}</b></div>
    <div class="card stat"><small>הודעות צ'אט</small><b>${n(T.pk_messages)}</b></div>
    <div class="card stat"><small>LearnLume · קריפטו</small><b class="mute" style="font-size:18px">בקרוב</b></div>
  </section>
  <section class="card">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <div class="tabs" role="tablist">${[['all','כולם'],['cx','קומפליצס'],['pk','פלטפורמיקה']].map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${TAB===k}">${l}</button>`).join('')}</div>
      <span class="sp"></span><input id="q" placeholder="חיפוש מייל או שם" value="${esc(Q)}" style="max-width:260px"><button class="ghost" id="csv">ייצוא CSV</button>
    </div>
    <p class="mute" style="margin:0 0 8px">${n(r.length)} משתמשים · לחיצה על כותרת ממיינת</p>
    <div class="tbl"><table><thead><tr>${c.map(([k,l])=>`<th data-k="${k}" aria-sort="${SORT.k===k?(SORT.dir>0?'ascending':'descending'):'none'}">${l}${SORT.k===k?(SORT.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
    <tbody>${r.map(x=>`<tr>${c.map(([k])=>cell(x,k)).join('')}</tr>`).join('')||`<tr><td colspan="${c.length}" class="mute">אין משתמשים</td></tr>`}</tbody></table></div>
  </section>
  <section class="card"><h2>פרסומים אחרונים בפלטפורמיקה</h2><div class="list">${(DATA.pk_recent||[]).map(p=>`<div class="post"><small>${d(p.created_at)}</small><b dir="ltr">@${esc(p.handle||'?')}</b><span class="pill y">${{post:'פוסט',clip:'קליפ',story:'סטורי'}[p.kind]||p.kind}</span><span>${esc(p.body)||'<span class=mute>(מדיה)</span>'}</span></div>`).join('')||'<p class="mute">עוד אין פרסומים</p>'}</div></section>
  <p class="mute" style="font-size:13px">תוכן הודעות פרטיות לא מוצג כאן — רק כמה הודעות כל משתמש שלח. סיסמאות לא נשמרות אצלנו בכלל (Supabase שומר רק גיבוב).</p>`;
  document.getElementById('out').onclick=async()=>{await sb.auth.signOut();login()};
  document.getElementById('rf').onclick=load;
  document.querySelectorAll('[data-trf]').forEach(b=>b.onclick=()=>{TRF=b.dataset.trf;draw(email)});
  document.querySelectorAll('[data-st]').forEach(sel=>sel.onchange=async()=>{sel.disabled=true;const{error}=await sb.from('travel_requests').update({status:sel.value,updated_at:new Date().toISOString()}).eq('id',sel.dataset.st);
    if(error){alert('שגיאה: '+error.message);sel.disabled=false;return}const r=TRQ.find(x=>x.id===sel.dataset.st);if(r)r.status=sel.value;draw(email)});
  document.getElementById('csv').onclick=csv;
  document.querySelectorAll('[data-pn]').forEach(b=>b.onclick=async()=>{const row=b.parentElement;row.querySelectorAll('button').forEach(x=>x.disabled=true);
    const{error}=await sb.rpc('pn_admin_decide',{p_id:b.dataset.pn,p_approve:b.dataset.ok==='1',p_model:row.querySelector('[data-pnm]')?.value||'sonnet'});
    if(error){alert('שגיאה: '+error.message);row.querySelectorAll('button').forEach(x=>x.disabled=false);return}await loadPenina();draw(email)});
  document.querySelectorAll('[data-pnopen]').forEach(b=>b.onclick=async()=>{b.disabled=true;const{data,error}=await sb.rpc('pn_admin_get_report',{p_id:b.dataset.pnopen});b.disabled=false;
    if(error||!data){alert('שגיאה: '+(error?error.message:'אין דוח'));return}
    const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:99;overflow:auto;background:var(--bg,#fff);color:inherit';o.innerHTML=pnView(data);document.body.appendChild(o);o.querySelector('#pnClose').onclick=()=>o.remove()});
  document.querySelectorAll('[data-pnset]').forEach(b=>b.onclick=async()=>{const row=b.parentElement;b.disabled=true;
    const{error}=await sb.rpc('pn_admin_set_model',{p_id:b.dataset.pnset,p_model:row.querySelector('[data-pns]').value});
    if(error){alert('שגיאה: '+error.message);b.disabled=false;return}await loadPenina();draw(email)});
  document.querySelectorAll('[data-rep]').forEach(b=>b.onclick=async()=>{b.disabled=true;const{error}=await sb.from('pk_reports').update({status:'done'}).eq('id',b.dataset.rep);if(error){b.disabled=false;return}const r=REP.find(x=>x.id===b.dataset.rep);if(r)r.status='done';draw(email)});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;draw(email)});
  document.querySelectorAll('th[data-k]').forEach(t=>t.onclick=()=>{const k=t.dataset.k;SORT=SORT.k===k?{k,dir:-SORT.dir}:{k,dir:-1};draw(email)});
  const q=document.getElementById('q');q.oninput=()=>{Q=q.value;const p=q.selectionStart;draw(email);const e=document.getElementById('q');e.focus();e.setSelectionRange(p,p)};
}
load();
})();
</script>
</body>
</html>
